[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mddb-client"
version = "2.11.4"
description = "Python gRPC client for MDDB (Markdown Database)."
readme = "README.md"
license = { text = "BSD-3-Clause" }
authors = [{ name = "tradik" }]
requires-python = ">=3.9"
dependencies = [
    "grpcio>=1.62",
    "protobuf>=4.25",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/tradik/mddb"
Repository = "https://github.com/tradik/mddb"

[tool.setuptools]
packages = ["mddb_client"]

[tool.pytest.ini_options]
testpaths = ["tests"]
