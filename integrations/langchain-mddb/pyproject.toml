[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "langchain-mddb"
version = "2.13.0"
description = "LangChain VectorStore and Retriever backed by MDDB (Markdown Database)."
readme = "README.md"
license = { text = "BSD-3-Clause" }
authors = [{ name = "tradik" }]
requires-python = ">=3.10"
keywords = ["langchain", "rag", "retrieval", "vectorstore", "mddb"]
dependencies = [
    "langchain-core>=0.3",
]

[project.optional-dependencies]
# The MDDB client itself. Separate because a caller may already have it
# pinned, and because the adapter is useful to read without installing gRPC.
#
# mddb-client is NOT on PyPI, and cannot be installed from git either: its
# protobuf stubs are generated at build time and are not committed. It is
# installed from a checkout — see the README. The extra names the dependency
# so the requirement is declared rather than implied; it does not make `pip
# install "langchain-mddb[client]"` work on its own.
client = ["mddb-client>=2.13.0"]
test = ["pytest>=8.0", "langchain-core>=0.3"]

[project.urls]
Homepage = "https://github.com/tradik/mddb"
Repository = "https://github.com/tradik/mddb"
Documentation = "https://mddb.tradik.com/docs/integrations/"

[tool.setuptools]
packages = ["langchain_mddb"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# The client is a path dependency, not a published one. Without this, locking
# the project fails outright: uv looks for mddb-client on PyPI and does not
# find it, because it is not there.
[tool.uv.sources]
mddb-client = { path = "../../clients/python" }
