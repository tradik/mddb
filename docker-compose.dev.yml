# Reusable anchors (OPS-002): log rotation (max 10 MB × 3) + resource
# limits/reservations. Dev limits are generous so they don't throttle builds.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-deploy-server: &deploy-server
  resources:
    limits:
      cpus: "2.00"
      memory: 2G
    reservations:
      cpus: "0.25"
      memory: 256M

x-deploy-medium: &deploy-medium
  resources:
    limits:
      cpus: "2.00"
      memory: 1G
    reservations:
      cpus: "0.10"
      memory: 128M

x-deploy-small: &deploy-small
  resources:
    limits:
      cpus: "1.00"
      memory: 512M
    reservations:
      cpus: "0.05"
      memory: 64M

services:
  # MDDB Server (Backend)
  mddbd:
    build:
      context: .
      dockerfile: services/mddbd/Dockerfile.dev
    container_name: mddb-server
    ports:
      - "11023:11023"  # HTTP API
      - "11024:11024"  # gRPC
      - "9000:9000"    # MCP
    # GO-034: room for the ordered shutdown to drain (see docker-compose.yml).
    stop_grace_period: 20s
    volumes:
      - ./services/mddbd:/app
      - mddb-data:/data
    environment:
      - MDDB_PATH=/data/mddb.db
      - MDDB_MODE=wr
      - MDDB_ADDR=:11023
      - MDDB_GRPC_ADDR=:11024
      - MDDB_AUTH_ENABLED=true
      # SEC-007: secrets come from .env (gitignored), never hardcoded here.
      # Copy .env.example to .env and set these. Compose errors if unset.
      - MDDB_AUTH_JWT_SECRET=${MDDB_AUTH_JWT_SECRET:?set MDDB_AUTH_JWT_SECRET in .env, see .env.example}
      - MDDB_AUTH_JWT_EXPIRY=24h
      - MDDB_AUTH_ADMIN_USERNAME=${MDDB_AUTH_ADMIN_USERNAME:-admin}
      - MDDB_AUTH_ADMIN_PASSWORD=${MDDB_AUTH_ADMIN_PASSWORD:?set MDDB_AUTH_ADMIN_PASSWORD in .env, see .env.example}
      - MDDB_METRICS=true
      - MDDB_MCP_ENABLED=true
      - MDDB_GRPC_ENABLED=true
      - MDDB_EMBEDDING_PROVIDER=ollama
      - MDDB_EMBEDDING_API_URL=http://host.docker.internal:11434
      - MDDB_EMBEDDING_MODEL=nomic-embed-text
      - MDDB_EMBEDDING_DIMENSIONS=768
      # - MDDB_PANEL_MODE=external  # internal (default, CORS enabled) or external (CORS disabled, panel proxies)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - mddb-network
    restart: unless-stopped
    logging: *default-logging
    deploy: *deploy-server
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11023/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # MDDB Panel (Frontend)
  mddb-panel:
    build:
      context: .
      dockerfile: services/mddb-panel/Dockerfile
      target: development
    container_name: mddb-panel
    ports:
      - "3000:3000"
    volumes:
      - ./services/mddb-panel:/app
      - /app/node_modules
      - ./scripts:/app/scripts
    environment:
      - MDDB_SERVER=http://mddbd:11023
      - NODE_ENV=development
    networks:
      - mddb-network
    depends_on:
      - mddbd
    restart: unless-stopped
    logging: *default-logging
    deploy: *deploy-small
    command: npm run dev -- --host 0.0.0.0

  # MCP is built into mddbd — runs on port 9000 by default

  # MDDB Chat (Rust server)
  mddb-chat:
    build:
      context: .
      dockerfile: services/mddb-chat/Dockerfile.dev
    container_name: mddb-chat
    ports:
      - "11030:11030"
    volumes:
      - ./services/mddb-chat:/app
      - ./proto:/proto
    environment:
      - MDDB_CHAT_CONFIG=/app/config.toml
      - MDDB_CHAT_LLM_API_KEY=${MDDB_CHAT_LLM_API_KEY}
      # SEC-007: chat authenticates to mddbd with the admin creds from .env
      # (env overrides config.toml), so no password is committed to config.toml.
      - MDDB_CHAT_AUTH_USERNAME=${MDDB_AUTH_ADMIN_USERNAME:-admin}
      - MDDB_CHAT_AUTH_PASSWORD=${MDDB_AUTH_ADMIN_PASSWORD:?set MDDB_AUTH_ADMIN_PASSWORD in .env, see .env.example}
      - RUST_LOG=mddb_chat=debug,tower_http=debug
    networks:
      - mddb-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mddbd:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    deploy: *deploy-medium

  # MDDB Chat Widget (static JS)
  mddb-chat-widget:
    build:
      context: .
      dockerfile: services/mddb-chat-widget/Dockerfile
    container_name: mddb-chat-widget
    ports:
      - "11032:8080" # nginx-unprivileged listens on 8080 (OPS-006)
    networks:
      - mddb-network
    restart: unless-stopped
    logging: *default-logging
    deploy: *deploy-small

  # Ollama (Optional - use profile "with-ollama" if no local Ollama)
  ollama:
    image: ollama/ollama:0.32.15
    container_name: mddb-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - mddb-network
    restart: unless-stopped
    logging: *default-logging
    deploy: *deploy-server
    profiles:
      - with-ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mddb-data:
    driver: local
  ollama-data:
    driver: local

networks:
  mddb-network:
    driver: bridge
