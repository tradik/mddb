          type: integer
          description: 1-based; <=0 appends after organic results
      required: [ key, position ]

    CurationRule:
      type: object
      description: (v2.9.15+) Pinned + hidden document overrides for FTS/Hybrid search
      properties:
        id:
          type: string
          description: Server-assigned. Omit on POST.
        collection:
          type: string
        query:
          type: string
        matchMode:
          type: string
          enum: [ exact, contains ]
          default: exact
        pins:
          type: array
          items:
            $ref: "#/components/schemas/PinnedDoc"
        hides:
          type: array
          items:
            type: string
          description: Document keys to drop from results
        enabled:
          type: boolean
        createdAt:
          type: integer
          format: int64
        updatedAt:
          type: integer
          format: int64
      required: [ collection, query ]

    SearchRecommendation:
      type: object
      description: |
        How to search a collection, measured rather than guessed (SRCH-010).

        MDDB offers eight vector algorithms, four ranking algorithms, three
        fusion strategies and four retrieval modes. An agent connecting over
        MCP has no basis for choosing among them. This measures the collection
        — length, vocabulary, whether it is embedded, whether it is code — and
        recommends, with a reason for every choice.

        It changes nothing. `retrievalProfile` is the advice encoded as a
        RAG-001 profile, ready to `PUT` to `/v1/collection-config` if you agree.
      properties:
        profile:
          $ref: "#/components/schemas/CollectionProfile"
        searchType:
          type: string
          enum: [ fts, vector, hybrid ]
        ftsAlgorithm:
          type: string
          enum: [ tfidf, bm25, bm25f, pmisparse ]
        vectorAlgorithm:
          type: string
          enum: [ flat, hnsw, ivf, pq, opq, sq, sq4, bq ]
        hybridStrategy:
          type: string
          enum: [ alpha, rrf, weighted ]
        hybridAlpha:
          type: number
        retrievalMode:
          type: string
          enum: [ parent, chunk, window, graph ]
        topK:
          type: integer
        signals:
          $ref: "#/components/schemas/FusionSignals"
        reasons:
          type: array
          description: >-
            One line per decision, in plain language. The part worth reading:
            a recommendation nobody can argue with is one nobody should follow.
          items:
            type: string
        warnings:
          type: array
          description: What would stop the recommendation working — a
            half-embedded collection, a missing provider.
          items:
            type: string
        retrievalProfile:
          $ref: "#/components/schemas/RetrievalProfile"

    CollectionProfile:
      type: object
      description: What the advisor measured, from a sample of up to 2000 documents.
      properties:
        collection:
          type: string
        documents:
          type: integer
        sampled:
          type: integer
          description: How many were actually read. A recommendation from a
            sample should say so.
        embeddedDocuments:
          type: integer
        vectorDimensions:
          type: integer
        medianWords:
          type: integer
          description: Median, not mean — one long manual among ten thousand
            notes moves a mean and describes nothing.
        longDocumentRatio:
          type: number
          description: Share above 500 words, where returning whole documents
            starts wasting a prompt.
        distinctTerms:
          type: integer
        termsPerDocument:
          type: number
          description: >-
            Vocabulary divided by documents sampled — how much new vocabulary
            each document contributes. This decides whether keyword search can
            discriminate. Type-token ratio would not: pooled over a corpus it
            falls towards zero as the corpus grows, so every large collection
            would look repetitive.
        typeTokenRatio:
          type: number
          description: Reported because it is familiar; not used for any decision.
        codeDocuments:
          type: integer
          description: How many carry extracted symbols, which is what makes
            the connection graph useful.
        estimatedVectorBytes:
          type: integer
          format: int64

    FusionSignals:
      type: object
      description: |
        Ranking signals for the `weighted` hybrid strategy (SRCH-002).

        **A weight is a fraction of the result's own score**: `proximity: 0.1`
        means "up to 10% better", `diversity: 0.8` means "up to 80% worse".
        That keeps the signals scale-free, and makes large weights genuinely
        powerful — at 1.0 a proximity bonus can carry a result past one scoring
        half again as much. Weights are clamped to [0, 1].

        Every weight defaults to 0, so a `weighted` request with no signals
        behaves exactly like `alpha`.
      properties:
        diversity:
          type: number
          minimum: 0
          maximum: 1
          description: >-
            Penalise a result that is a near-copy of a higher-ranked one,
            measured by text overlap. A vector score cannot do this: near-copies
            have near-identical embeddings, so similarity rewards the
            duplication. Suggested range 0.5-1.0.
          example: 0.8
        diversityThreshold:
          type: number
          minimum: 0
          maximum: 1
          default: 0.5
          description: Overlap below which two documents count as unrelated.
        proximity:
          type: number
          minimum: 0
          maximum: 1
          description: >-
            Reward a result whose key shares a directory with a higher-ranked
            one. Suggested range 0.05-0.15.
          example: 0.1
        freshness:
          type: number
          minimum: 0
          maximum: 1
          description: >-
            Reward recently updated documents on an exponential decay. Off by
            default because it is wrong for reference material — an API
            specification does not become less true with age. Suggested range
            0.05-0.2.
          example: 0.1
        freshnessHalfLifeDays:
          type: number
          default: 180
          description: How long the freshness bonus takes to halve.

    SignalBreakdown:
      type: object
      description: >-
        What each signal contributed to one result, in the same order as
        `results`. Returned by the `weighted` strategy, because a reranking
        nobody can explain is a reranking nobody trusts.
      properties:
        base:
          type: number
          description: The score before any signal applied
        diversity:
          type: number
          description: Negative — the near-duplicate penalty
        proximity:
          type: number
        freshness:
          type: number
        final:
          type: number

    PersistenceStatus:
      type: object
      description: >-
        What the data directory can promise about durability (GO-032). Reported
        by /health so an operator sees whether acknowledged writes will survive,
        not only that the process is up.
      properties:
        path:
          type: string
          description: The data directory the server writes to
          example: /var/lib/mddb
        filesystem:
          type: string
          description: Detected filesystem type, when it could be determined
          example: ext4
        ephemeral:
          type: boolean
          description: >-
            True when the directory lives on storage that does not survive a
            container restart (tmpfs, overlayfs upper layer).
          example: false
        writable:
          type: boolean
          example: true
        freeBytes:
          type: integer
          format: int64
          description: Free space on the filesystem holding the data directory
          example: 21474836480
        warnings:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
                example: EPHEMERAL_FS
              detail:
                type: string
                example: data directory is on tmpfs; writes will not survive a restart

