        webhookUrl:
          type: string
        status:
          type: string
          enum: [ success, error, skipped ]
        httpStatus:
          type: integer
        durationMs:
          type: integer
        error:
          type: string
        attempt:
          type: integer

    SearchStats:
      type: object
      description: Statistics about a search execution
      properties:
        durationMs:
          type: integer
          description: Search execution time in milliseconds
          example: 12
        queryTerms:
          type: array
          items:
            type: string
          description: Tokenized query terms
          example: [ cancel, subscription ]
        indexSize:
          type: integer
          description: Documents in search scope
          example: 150
        totalTokens:
          type: integer
          description: Number of tokens in query
          example: 2

    RevisionEntry:
      type: object
      properties:
        timestamp:
          type: integer
          format: int64
          description: Unix timestamp of the revision
          example: 1704844800
        updatedAt:
          type: integer
          format: int64
          description: Unix timestamp when the revision was saved
          example: 1704844800
        contentMd:
          type: string
          description: Markdown content at this revision
          example: "# Hello World\n\nOriginal content."
        meta:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: Metadata at this revision
          example:
            category: [ blog ]
            author: [ John Doe ]

    RetrievalProfile:
      type: object
      description: >
        (v2.12.0+) Per-collection retrieval defaults. Every field is optional;
        an unset field means "not configured". Precedence is fixed everywhere:
        an explicit request parameter wins, then this profile, then MDDB's own
        default for that endpoint — so a collection without a profile behaves
        exactly as it did before this existed.
      properties:
        defaultSearchType:
          type: string
          enum: [ fts, vector, hybrid ]
          description: >
            Which search this collection expects. Consumed by clients reading
            the config (mddb-chat, MCP agents); the server does not reroute a
            request to a different endpoint because of it.
        topK:
          type: integer
          minimum: 0
          maximum: 1000
          description: Results per search. 0 = unset.
        retrievalMode:
          type: string
          enum: [ parent, chunk, window, graph ]
          description: Granularity — whole document, matching passage, or passage with neighbours.
        hybridStrategy:
          type: string
          enum: [ alpha, rrf, weighted ]
          description: Hybrid fusion strategy.
        hybridAlpha:
          type: number
          minimum: 0
          maximum: 1
          description: >
            Keyword-to-semantic weight: 0 = keyword only, 1 = semantic only.
            Requires hybridAlphaSet, because 0.0 is a meaningful weight and
            cannot double as "unset".
        hybridAlphaSet:
          type: boolean
          description: Whether hybridAlpha was configured.
        oversample:
          type: number
          minimum: 1.0
          maximum: 10.0
          description: >
            (SRCH-005) Default recall/latency knob for this collection:
            candidates fetched per requested result before deduplication,
            merging or rescoring. A request parameter overrides it.
        contextTokenBudget:
          type: integer
          minimum: 0
          maximum: 1000000
          description: >
            Cap on the total context a search returns, so a RAG caller cannot be
            handed more than its model holds. Results are dropped from the tail,
            never truncated mid-document — half a document still costs tokens and
            no longer says anything reliable. Approximated as bytes/4 rather than
            tokenised: a real tokeniser would tie the budget to one model family.
            Responses set `contextTruncated` when this applied. 0 = no cap.
      example:
        defaultSearchType: hybrid
        topK: 40
        retrievalMode: chunk
        contextTokenBudget: 8000

    CollectionConfig:
      type: object
      properties:
        type:
          type: string
          description: Collection type (e.g., default, website, images, audio, documents)
          example: website
        description:
          type: string
          description: Collection description
          example: Blog posts and articles
        icon:
          type: string
          description: Collection icon (emoji or icon name)
          example: "🌐"
        color:
          type: string
          description: Collection color (hex code)
          example: "#3B82F6"
        customMeta:
          type: object
          additionalProperties: true
          description: Custom key-value metadata for the collection
        trackAccess:
          type: boolean
          description: Record per-read access events for temporal analytics
        trackHot:
          type: boolean
          description: Maintain a hot-documents leaderboard for this collection
        spellCorrect:
          type: boolean
          description: Auto-correct FTS queries using the spell checker
        spellLang:
          type: string
          description: Override language for spell correction (defaults to query language)
        encrypted:
          type: boolean
          description: >-
            Encrypt documents and revisions of this collection at rest
            (AES-256-GCM; requires MDDB_ENCRYPTION_KEY on the server)
        storageBackend:
          type: string
          enum: [ boltdb, memory, s3 ]
          description: >
            (Honoured from v2.12.0; accepted and ignored before that.) Where
            this collection's document *bodies* are stored. The metadata index,
            revisions, search indexes and replication binlog stay in the
            server's own database in every configuration — they are written in
            one transaction that a remote object store cannot join. A backend
            that cannot be reached is refused at configuration time, and writes
            to a collection whose backend fails later error rather than falling
            back to local disk.
          example: boltdb
        storageConfig:
          $ref: "#/components/schemas/StorageConfigDef"
        quantization:
          type: string
          enum: [ float32, int8, int4 ]
          description: "Vector quantization level. int8 = 4x compression, int4 = 8x
            compression. Default: float32."
          example: float32
        maxRevisions:
          type: integer
          description: |
            (v2.9.15+) Revision retention cap per document. `0` (default) = unlimited.
            When `> 0`, older revisions are trimmed synchronously on every write so
            history stays capped even under high write-churn.
          default: 0
        retrieval:
          $ref: "#/components/schemas/RetrievalProfile"
        responsePrompt:
          type: string
          maxLength: 4096
          description: >
            (v2.12.0+) How answers drawn from this collection should be
            formatted — numbered steps for runbooks, code blocks for API docs.
            Applied automatically by mddb-chat and returned alongside MCP search
            results, so the instruction travels with the data instead of living
            in every client. Supports `{{collection}}` and `{{query}}`
            placeholders. Plain text for a model; never rendered as markup.
            Capped at 4 KiB because it is prepended to prompts automatically and
            would otherwise eat the context the answer needs.
          example: "Answer as numbered steps. Quote the exact command for each step."
          example: 20
        wordpress:
          $ref: "#/components/schemas/WordPressTargetConfig"

    WordPressTargetConfig:
      type: object
      description: |
        (v2.11.0+) WordPress remote-publishing target used by the
        wordpress_publish / wordpress_set_status MCP tools. Points at a site
        running the mddb-sync plugin with "Remote publishing" enabled.
      required:
        - url
      properties:
        url:
          type: string
          description: Site base URL. Must be https:// (http only for localhost).
          example: https://blog.example.com
        apiKey:
          type: string
          description: mddb-sync publish key (Settings → MDDB Sync), sent as Authorization Bearer.

    StorageConfigDef:
      type: object
      description: Backend-specific configuration for non-default storage backends
        (required when storageBackend is 's3').
      properties:
        endpoint:
          type: string
          description: S3-compatible endpoint URL
          example: s3.amazonaws.com
        bucket:
          type: string
          description: S3 bucket name
          example: my-mddb-bucket
        region:
          type: string
          description: AWS region
          example: us-east-1
        accessKey:
          type: string
          description: Access key for authentication
          example: AKIAIOSFODNN7EXAMPLE
        secretKey:
          type: string
          description: Secret key for authentication
          example: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
        prefix:
          type: string
          description: Key prefix within the bucket
          example: mddb/
        useTLS:
          type: boolean
          description: Use HTTPS for S3 connections
          example: true

    AggregateRequest:
      type: object
      required:
        - collection
      properties:
        collection:
          type: string
          description: Collection name
          example: blog
        filterMeta:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: Optional metadata pre-filter (AND over keys, OR over values)
        facets:
          type: array
          items:
            type: object
            required:
              - field
            properties:
              field:
                type: string
                description: Metadata key to aggregate
                example: category
              orderBy:
                type: string
                enum: [ count, value ]
                description: Sort order for facet buckets (default count descending)
                example: count
        histograms:
          type: array
          items:
            type: object
            required:
              - field
            properties:
              field:
                type: string
                description: Time field to histogram (addedAt or updatedAt)
                example: addedAt
              interval:
                type: string
                enum: [ day, week, month, year ]
                description: Histogram bucket interval (default month)
                example: month
        maxFacetSize:
          type: integer
          description: Maximum number of values per facet (default 50)
          example: 50

    AggregateResponse:
      type: object
      properties:
        collection:
          type: string
          example: blog
        totalDocs:
          type: integer
          description: Total documents matching the filter (or all docs if no filter)
          example: 42
        facets:
          type: object
          additionalProperties:
            type: array
            items:
              type: object
              properties:
                value:
                  type: string
                count:
                  type: integer
          description: Facet results keyed by metadata field name
        histograms:
          type: object
          additionalProperties:
            type: array
            items:
              type: object
              properties:
                key:
                  type: string
                  description: Formatted date label
                from:
                  type: integer
                  description: Unix timestamp start
                to:
                  type: integer
                  description: Unix timestamp end (exclusive)
                count:
                  type: integer
          description: Histogram results keyed by field name
        durationMs:
          type: integer
          description: Query execution time in milliseconds
          example: 3

    CrossSearchRequest:
      type: object
      properties:
        oversample:
          type: number
          minimum: 1.0
          maximum: 10.0
          description: >
            (v2.12.0+) Recall/latency knob: candidates fetched per requested
            result before deduplication, merging or rescoring trims them.
            Omitted, uses the collection's retrieval profile then MDDB's default
            of 3.0. Out of range returns 422 rather than clamping. See
            SEARCH.md#oversampling-v2120 for measured effect.
        sourceCollection:
          type: string
          description: Collection containing the source document (for document-as-query)
          example: content
        sourceDocID:
          type: string
          description: ID of the source document whose embedding to use as query
          example: post-123
        query:
          type: string
          description: Text query (alternative to sourceCollection/sourceDocID)
          example: machine learning tutorial
        queryVector:
          type: array
          items:
            type: number
          description: Pre-computed query vector (alternative to query or source document)
        targetCollections:
          type: array
          items:
            type: string
          description: Collections to search in
          example: [ "images", "audio" ]
        topK:
          type: integer
          description: Number of results to return
          default: 10
          example: 10
        threshold:
          type: number
          description: Minimum similarity score
          default: 0.0
          example: 0.5
        algorithm:
          type: string
          description: Vector search algorithm
          enum: [ flat, hnsw, ivf, pq, opq, sq, bq ]
          default: flat
          example: flat
        distanceMetric:
          type: string
          description: Distance metric for similarity computation
          enum: [ cosine, dot_product, euclidean ]
          default: cosine
          example: cosine
        filterMeta:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: Metadata filters applied to target documents
        includeContent:
          type: boolean
          description: Include document content in results
          default: false
          example: false

    CrossSearchResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/CrossSearchResultItem"
        total:
          type: integer
          description: Total number of results
          example: 5
        sourceCollection:
          type: string
          description: Source collection (if document-as-query was used)
          example: content
        sourceDocID:
          type: string
          description: Source document ID (if document-as-query was used)
          example: post-123
        targetCollections:
          type: array
          items:
            type: string
          description: Collections that were searched
          example: [ "images", "audio" ]
        algorithm:
          type: string
          description: Vector search algorithm used
          example: flat
        distanceMetric:
          type: string
          description: Distance metric used
          example: cosine
        searchStats:
          $ref: "#/components/schemas/SearchStats"

    CrossSearchResultItem:
      type: object
      properties:
        collection:
          type: string
          description: Collection the result came from
          example: images
        document:
          $ref: "#/components/schemas/Document"
        score:
          type: number
          format: float
          description: Similarity score
          example: 0.89
        rank:
          type: integer
          description: Result rank (1-based)
          example: 1

    FindDuplicatesRequest:
      type: object
      required:
        - collection
      properties:
        collection:
          type: string
          description: Collection to scan
        mode:
          type: string
          enum: [ exact, similar, minhash, both ]
          default: both
          description: |
            Detection mode.
            - **exact**: identical content hashes
            - **similar**: close embeddings — finds documents on the same
              topic, and needs an embedding provider configured
            - **minhash**: overlapping text (SRCH-002) — finds a page that was
              forked and lightly edited, which `exact` misses and `similar`
              cannot distinguish from two independent pages on one subject.
              Needs no embeddings.
            - **both**: exact and similar. Deliberately excludes `minhash`,
              which reads every document body.
        threshold:
          type: number
          minimum: 0
          maximum: 1
          default: 0.9
          description: Similarity threshold for similar mode
        maxDocs:
          type: integer
          default: 5000
          description: Maximum documents to process (safety bound)
        distanceMetric:
          type: string
          enum: [ cosine, dot_product, euclidean ]
          default: cosine
        includeContent:
          type: boolean
          default: false
    FindDuplicatesResponse:
      type: object
      properties:
        collection:
          type: string
        mode:
          type: string
        threshold:
          type: number
        distanceMetric:
          type: string
        totalDocuments:
          type: integer
        totalEmbedded:
          type: integer
        exactGroups:
          type: array
          items:
            $ref: "#/components/schemas/DuplicateGroup"
        similarGroups:
          type: array
          items:
            $ref: "#/components/schemas/DuplicateGroup"
        exactDuplicates:
          type: integer
        similarPairs:
          type: integer
        searchStats:
          $ref: "#/components/schemas/SearchStats"
    DuplicateGroup:
      type: object
      properties:
        groupId:
          type: integer
        type:
          type: string
          enum: [ exact, similar, minhash ]
        documents:
          type: array
          items:
            $ref: "#/components/schemas/DuplicateDocInfo"
        score:
          type: number
          description: Average similarity score for the group
    DuplicateDocInfo:
      type: object
      properties:
        docId:
          type: string
        key:
          type: string
        contentHash:
          type: string
        contentMd:
          type: string
        score:
          type: number
          description: Max similarity to another document in the group

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from POST /v1/auth/login
    APIKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key obtained from POST /v1/auth/api-key
