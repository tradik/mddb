            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Read-only mode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/schema/set:
    post:
      tags:
        - Schema Validation
      summary: Set collection schema
      description: |
        Set a JSON Schema for a collection's metadata validation. This is a write-protected endpoint.

        Once set, all documents added to the collection will have their metadata validated against this schema.
      operationId: setSchema
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetSchemaRequest"
      responses:
        "200":
          description: Schema set successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  collection:
                    type: string
                    example: blog
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Read-only mode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/schema/get:
    post:
      tags:
        - Schema Validation
      summary: Get collection schema
      description: Retrieve the JSON Schema currently set for a collection.
      operationId: getSchema
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - collection
              properties:
                collection:
                  type: string
                  description: Collection name
                  example: blog
      responses:
        "200":
          description: Schema retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchemaResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/schema/delete:
    post:
      tags:
        - Schema Validation
      summary: Delete collection schema
      description: Remove the JSON Schema for a collection, disabling metadata
        validation. This is a write-protected endpoint.
      operationId: deleteSchema
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - collection
              properties:
                collection:
                  type: string
                  description: Collection name
                  example: blog
      responses:
        "200":
          description: Schema deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  collection:
                    type: string
                    example: blog
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Read-only mode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/schema/list:
    post:
      tags:
        - Schema Validation
      summary: List all schemas
      description: List all JSON Schemas set across all collections.
      operationId: listSchemas
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: List of schemas
          content:
            application/json:
              schema:
                type: object
                properties:
                  schemas:
                    type: array
                    items:
                      type: object
                      properties:
                        collection:
                          type: string
                          example: blog
                        schema:
                          type: string
                          description: JSON Schema string
                          example: "{\"type\":\"object\",\"required\":[\"author\"]}"

  /v1/validate:
    post:
      tags:
        - Schema Validation
      summary: Validate metadata against schema
      description: |
        Validate a metadata object against the JSON Schema set for a collection.

        This is a dry-run validation that does not modify any data. Useful for pre-validating metadata before adding a document.
      operationId: validateMetadata
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidateRequest"
      responses:
        "200":
          description: Validation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidateResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /metrics:
    get:
      tags:
        - Telemetry
      summary: Prometheus metrics
      description: |
        Returns server telemetry in Prometheus text exposition format.

        Includes HTTP request counters, latency histograms, database statistics,
        vector search status, and Go runtime metrics. Enabled by default
        (set `MDDB_METRICS=false` to disable).

        See [Telemetry documentation](TELEMETRY.md) for Grafana dashboards and alerting rules.
      operationId: getMetrics
      responses:
        "200":
          description: Prometheus metrics
          content:
            text/plain:
              schema:
                type: string
                example: |
                  # HELP mddb_uptime_seconds Time since server start in seconds.
                  # TYPE mddb_uptime_seconds gauge
                  mddb_uptime_seconds 3621.4
                  # HELP mddb_http_requests_total Total number of HTTP requests.
                  # TYPE mddb_http_requests_total counter
                  mddb_http_requests_total{method="POST",path="/v1/add",status="200"} 1523
        "404":
          description: Metrics disabled (MDDB_METRICS=false)

  /v1/replication/status:
    get:
      tags:
        - Replication
      summary: Replication status
      description: |
        Returns the replication status of this node, including role, LSN, binlog stats,
        and connected followers (leader only).

        Available for all roles: standalone, leader, and follower.

        ### Replication Architecture
        MDDB uses a pull-based, single-leader replication model. Wait for the `healthy` flag to determine if the node is fully synced.

        ```mermaid
        graph LR
            L[Leader] -->|Binlog Stream| F1[Follower 1]
            L -->|Binlog Stream| F2[Follower 2]
        ```

        See [Replication documentation](REPLICATION.md) for full setup instructions and monitoring.
      operationId: getReplicationStatus
      responses:
        "200":
          description: Replication status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplicationStatusResponse"

  /v1/synonyms:
    get:
      tags:
        - Synonyms
      summary: List synonyms
      description: List all synonym entries for a collection. Synonyms are used to
        expand FTS queries with related terms.
      operationId: listSynonyms
      parameters:
        - name: collection
          in: query
          required: true
          description: Collection name
          schema:
            type: string
            example: blog
      responses:
        "200":
          description: Synonym list retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SynonymListResponse"
        "400":
          description: Invalid request (missing collection parameter)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags:
        - Synonyms
      summary: Add or update synonym group
      description: |
        Add or update a synonym mapping for a term in a collection. Synonyms are bidirectional --
        if "big" has synonym "large", then querying "large" will also expand to include "big".
      operationId: setSynonym
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SynonymRequest"
      responses:
        "200":
          description: Synonym group set successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags:
        - Synonyms
      summary: Delete synonym group
      description: Delete a synonym mapping for a term in a collection.
      operationId: deleteSynonym
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SynonymDeleteRequest"
      responses:
        "200":
          description: Synonym group deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/stopwords:
    get:
      tags:
        - Stop Words
      summary: List stop words
      description: List all stop word entries (default + custom) for a collection.
        Stop words are excluded from FTS indexing.
      operationId: listStopWords
      parameters:
        - name: collection
          in: query
          required: true
          description: Collection name
          schema:
            type: string
            example: blog
      responses:
        "200":
          description: Stop word list retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  collection:
                    type: string
                    example: blog
                  entries:
                    type: array
                    items:
                      type: object
                      properties:
                        word:
                          type: string
                          example: the
                        isDefault:
                          type: boolean
                          example: true
                  total:
                    type: integer
                    example: 35
                  defaults:
                    type: integer
                    example: 33
                  custom:
                    type: integer
                    example: 2
        "400":
          description: Invalid request (missing collection parameter)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags:
        - Stop Words
      summary: Add custom stop words
      description: Add custom stop words to a collection. These words will be excluded
        from FTS indexing.
      operationId: addStopWords
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - collection
                - words
              properties:
                collection:
                  type: string
                  example: blog
                words:
                  type: array
                  items:
                    type: string
                  example: [ "foo", "bar" ]
      responses:
        "200":
          description: Stop words added successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  added:
                    type: integer
                    example: 2
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags:
        - Stop Words
      summary: Delete custom stop words
      description: Delete custom stop words from a collection. Default stop words
        cannot be deleted.
      operationId: deleteStopWords
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - collection
                - words
              properties:
                collection:
                  type: string
                  example: blog
                words:
                  type: array
                  items:
                    type: string
                  example: [ "foo" ]
      responses:
        "200":
          description: Stop words deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  deleted:
                    type: integer
                    example: 1
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/embedding-configs:
    get:
      tags:
        - Embedding Config
      summary: List embedding configurations
      description: List all embedding model configurations.
      operationId: listEmbeddingConfigs
      responses:
        "200":
          description: List of embedding configurations
          content:
            application/json:
              schema:
                type: object
                properties:
                  configs:
                    type: array
                    items:
                      $ref: "#/components/schemas/EmbeddingConfig"
    post:
      tags:
        - Embedding Config
      summary: Create embedding configuration
      description: |
        Create a new embedding model configuration. Required fields: id, name, provider, model, dimensions.

        Supported providers: `openai`, `ollama`, `cohere`, `voyage`.
      operationId: createEmbeddingConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmbeddingConfig"
      responses:
        "201":
          description: Embedding configuration created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmbeddingConfig"
        "400":
          description: Invalid request (missing required fields or invalid provider)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/embedding-configs/{id}:
    get:
      tags:
        - Embedding Config
      summary: Get embedding configuration
      description: Retrieve a specific embedding configuration by ID.
      operationId: getEmbeddingConfig
      parameters:
        - name: id
          in: path
          required: true
          description: Embedding configuration ID
          schema:
            type: string
            example: openai-small
      responses:
        "200":
          description: Embedding configuration retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmbeddingConfig"
        "404":
          description: Configuration not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      tags:
        - Embedding Config
      summary: Update embedding configuration
      description: |
        Update an existing embedding configuration. The ID in the path is used (body ID is ignored).

        Supported providers: `openai`, `ollama`, `cohere`, `voyage`.
      operationId: updateEmbeddingConfig
      parameters:
        - name: id
          in: path
          required: true
          description: Embedding configuration ID
          schema:
            type: string
            example: openai-small
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmbeddingConfig"
      responses:
        "200":
          description: Embedding configuration updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmbeddingConfig"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags:
        - Embedding Config
      summary: Delete embedding configuration
      description: Delete an embedding configuration. Cannot delete the default
        configuration.
      operationId: deleteEmbeddingConfig
      parameters:
        - name: id
          in: path
          required: true
          description: Embedding configuration ID
          schema:
            type: string
            example: openai-small
      responses:
        "204":
          description: Embedding configuration deleted
        "400":
          description: Cannot delete default config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Configuration not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/embedding-configs/set-default:
    post:
      tags:
        - Embedding Config
      summary: Set default embedding configuration
      description: |
        Set an embedding configuration as the default. This will unset any previously default configuration
        and reinitialize the embedding system with the new default config.
      operationId: setDefaultEmbeddingConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
              properties:
                id:
                  type: string
                  description: ID of the embedding configuration to set as default
                  example: openai-small
      responses:
        "200":
          description: Default configuration updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: default config updated
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Configuration not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/system/info:
    get:
      tags:
        - System
      summary: System information
      description: |
        Returns detailed system information including hostname, OS, architecture, CPU count,
        Go version, memory statistics, goroutine count, CPU usage, and network interfaces.
      operationId: getSystemInfo
      responses:
        "200":
          description: System information retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemInfoResponse"

  /v1/config:
    get:
      tags:
        - Configuration
      summary: Server configuration
      description: |
        Returns the current server configuration including version, database path, mode,
        protocol statuses, authentication state, and vector/chunk configuration.
      operationId: getConfig
      responses:
        "200":
          description: Server configuration retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigResponse"

  /v1/mcp/config:
    get:
      tags:
        - Configuration
      summary: MCP YAML configuration
      description: |
        Returns a YAML configuration template for the MCP (Model Context Protocol) server.
        Includes gRPC and REST connection settings and example custom tool configurations.
      operationId: getMCPConfig
      responses:
        "200":
          description: MCP configuration in YAML format
          content:
            text/yaml:
              schema:
                type: string
                example: |
                  mcp:
                    # listenAddress: "0.0.0.0:9000"
                  mddb:
                    grpcAddress: "localhost:11024"
                    restBaseUrl: "http://localhost:11023"
                    transportMode: "grpc_with_rest_fallback"
                    timeoutSeconds: 2
                    maxRetries: 1

  /v1/endpoints:
    get:
      tags:
        - System
      summary: List all endpoints
      description: |
        Returns a comprehensive list of all available HTTP endpoints, gRPC methods, and MCP tools
        supported by this server instance.
      operationId: listEndpoints
      responses:
        "200":
          description: Endpoint list retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EndpointsResponse"

  /v1/auth/login:
    post:
      tags:
        - Authentication
      summary: Login
      description: |
        Authenticate with username and password to receive a JWT token.
        The token should be included in subsequent requests via the `Authorization: Bearer <token>` header.
      operationId: authLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/auth/register:
    post:
      tags:
        - Users
      summary: Register new user
      description: Create a new user account. Requires admin authentication.
      operationId: authRegister
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "200":
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: User already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/auth/api-key:
    post:
      tags:
        - Authentication
      summary: Create API key
      description: |
        Create a new API key for the authenticated user. The key is returned only once in the response.
        Use the `X-API-Key` header to authenticate with the key in subsequent requests.
      operationId: authCreateAPIKey
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAPIKeyRequest"
      responses:
        "200":
          description: API key created (key shown only once)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateAPIKeyResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/auth/api-keys:
    get:
      tags:
        - Authentication
      summary: List API keys
      description: List all API keys for the authenticated user (key values are not
        included, only hashes).
      operationId: authListAPIKeys
      security:
        - BearerAuth: []
      responses:
        "200":
          description: List of API keys
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListAPIKeysResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/auth/api-keys/{keyHash}:
    delete:
      tags:
        - Authentication
      summary: Delete API key
      description: Delete an API key by its hash. Users can only delete their own API keys.
      operationId: authDeleteAPIKey
      security:
        - BearerAuth: []
      parameters:
        - name: keyHash
          in: path
          required: true
          description: SHA256 hash of the API key
          schema:
            type: string
            example: a1b2c3d4e5f6...
      responses:
        "200":
          description: API key deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: deleted
        "400":
          description: Key hash required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden (can only delete own keys)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: API key not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/auth/me:
    post:
      tags:
        - Authentication
      summary: Get current user info
      description: Returns information about the currently authenticated user.
      operationId: authGetMe
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Current user info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetMeResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/auth/permissions:
    get:
      tags:
        - Users
      summary: Get user permissions
      description: Get all permissions for a specific user. Requires admin authentication.
      operationId: authGetPermissions
      security:
        - BearerAuth: []
      parameters:
        - name: username
          in: query
          required: true
          description: Username to get permissions for
          schema:
            type: string
            example: alice
      responses:
        "200":
          description: User permissions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Permission"
        "400":
          description: Username parameter required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags:
        - Users
      summary: Set user permissions
      description: Set permissions for a user on a specific collection. Requires admin
        authentication.
      operationId: authSetPermissions
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetPermissionRequest"
      responses:
        "200":
          description: Permission set successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetPermissionResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/auth/users:
    get:
      tags:
        - Users
      summary: List all users
      description: List all user accounts with their details. Requires admin authentication.
      operationId: authListUsers
      security:
        - BearerAuth: []
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsersListResponse"
        "403":
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/auth/users/{username}:
    delete:
      tags:
        - Users
      summary: Delete user
      description: Delete (disable) a user account. Requires admin authentication.
      operationId: authDeleteUser
      security:
        - BearerAuth: []
      parameters:
        - name: username
          in: path
          required: true
          description: Username to delete
          schema:
            type: string
            example: alice
      responses:
