        strategy:
          type: string
          description: Fusion strategy used
          example: alpha
        alpha:
          type: number
          description: Alpha value used (only for alpha strategy)
          example: 0.5
        rrfK:
          type: integer
          description: RRF k value used (only for rrf strategy)
          example: 60
        ftsAlgorithm:
          type: string
          description: FTS algorithm used
          example: bm25
        vectorAlgorithm:
          type: string
          description: Vector algorithm used
          example: flat
        distanceMetric:
          type: string
          description: Distance metric used for this search
          example: cosine
        searchStats:
          $ref: "#/components/schemas/SearchStats"
        facets:
          $ref: "#/components/schemas/FacetMap"

    HybridSearchResultItem:
      type: object
