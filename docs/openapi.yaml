          example: true

    ValidateRequest:
      type: object
      required:
        - collection
        - meta
      properties:
        collection:
          type: string
          description: Collection name
          example: blog
        meta:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: Metadata to validate against the collection schema
          example:
            category: [ blog ]
            author: [ John Doe ]

    ValidateResponse:
      type: object
      properties:
        valid:
          type: boolean
