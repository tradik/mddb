        current_lsn:
          type: integer
          format: uint64
          description: Current Log Sequence Number
          example: 45230
        binlog_oldest_lsn:
          type: integer
          format: uint64
          description: Oldest LSN still in the binlog (leader only)
          example: 40000
        binlog_size_bytes:
          type: integer
          format: int64
          description: Binlog file size in bytes (leader only)
          example: 15728640
        leader_addr:
          type: string
          description: Address of the leader node (follower only)
          example: leader:11024
        replication_lag_ms:
          type: integer
          format: int64
          description: Replication lag in milliseconds (follower only)
          example: 12
        healthy:
          type: boolean
          description: Whether this node is healthy
          example: true
        followers:
          type: array
          items:
            $ref: "#/components/schemas/FollowerInfo"
          description: Connected followers (leader only)
        uptime_seconds:
          type: integer
          format: int64
          description: Node uptime in seconds
          example: 86400

    FollowerInfo:
      type: object
      properties:
        follower_id:
          type: string
          description: Follower node identifier
          example: follower-1
        address:
          type: string
          description: Follower network address
          example: "10.0.0.2:11034"
        confirmed_lsn:
          type: integer
          format: uint64
          description: Last LSN confirmed by this follower
          example: 45228
        lag_ms:
          type: integer
          format: int64
          description: Estimated replication lag in milliseconds
          example: 12
        last_seen_at:
          type: integer
          format: int64
          description: Unix timestamp of last communication
          example: 1709500000
        status:
          type: string
          enum: [ healthy, warning, unhealthy ]
          description: "Follower health status (healthy: <1s lag, warning: 1-30s,
            unhealthy: >30s)"
          example: healthy

    HybridSearchRequest:
      type: object
      required:
        - collection
        - query
      properties:
        oversample:
          type: number
          minimum: 1.0
          maximum: 10.0
          description: >
            (v2.12.0+) Recall/latency knob: candidates fetched per requested
            result before deduplication, merging or rescoring trims them.
            Omitted, uses the collection's retrieval profile then MDDB's default
            of 3.0. Out of range returns 422 rather than clamping. See
            SEARCH.md#oversampling-v2120 for measured effect.
        collection:
          type: string
          description: Collection name to search
          example: blog
        query:
          type: string
          description: Search query string (used for both FTS and embedding)
          example: how to deploy with Docker
        topK:
          type: integer
          description: Number of top results to return (default 10)
          default: 10
          example: 10
        algorithm:
          type: string
          enum: [ bm25, bm25f, pmisparse ]
          description: FTS algorithm (default "bm25")
          default: bm25
          example: bm25
        vectorAlgorithm:
          type: string
          enum: [ flat, hnsw, ivf, pq, opq, sq, sq4, bq ]
          description: Vector search algorithm (default "flat")
          default: flat
          example: flat
        signals:
          $ref: "#/components/schemas/FusionSignals"
        strategy:
          type: string
          enum: [ alpha, rrf, weighted ]
          description: |
            Fusion strategy (default "alpha").
            - **alpha**: Weighted blending — `combined = (1-alpha) * normalizedFTS + alpha * vectorScore`
            - **rrf**: Reciprocal Rank Fusion — `score = 1/(k + rank_fts) + 1/(k + rank_vector)`
            - **weighted** (SRCH-002): alpha's blend, then adjusted by the
              signals in `signals`. Nothing changes unless a weight is set, and
              `alpha`/`rrf` are unaffected.
          default: alpha
          example: alpha
        alpha:
          type: number
          format: float
          description: Alpha blending weight (0=keyword only, 1=semantic only, default
            0.5). Only used with "alpha" strategy.
          minimum: 0
          maximum: 1
          default: 0.5
          example: 0.5
        rrfK:
          type: integer
          description: RRF parameter k (default 60). Only used with "rrf" strategy.
          default: 60
          example: 60
        fuzzy:
          type: integer
          enum: [ 0, 1, 2 ]
          description: Typo tolerance for FTS (0=off, 1=1 edit, 2=2 edits)
          default: 0
          example: 0
        threshold:
          type: number
          format: float
          description: Minimum vector similarity score (0.0 to 1.0)
          minimum: 0
          maximum: 1
          example: 0.0
        filterMeta:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: Metadata filters applied to both FTS and vector results
          example:
            category: [ tutorial ]
        geo:
          type: object
          description: |
            Optional spatial pre-filter. When set, only documents present in the
            in-memory geo index AND within `radiusMeters` of the given point are
            considered by both FTS and vector search; each result then carries a
            `distanceMeters` value. Required when `sort` is `distance`.
          required:
            - lat
            - lng
            - radiusMeters
          properties:
            lat:
              type: number
              format: double
              description: Latitude of the center point
              example: 51.5074
            lng:
              type: number
              format: double
              description: Longitude of the center point
              example: -0.1278
            radiusMeters:
              type: number
              format: double
              description: Search radius in meters
              example: 5000
        includeContent:
          type: boolean
          description: Include document content in results
          default: false
        fieldWeights:
          type: object
          additionalProperties:
            type: number
          description: Field weights for BM25F (keys are "title", "meta", "content")
          example:
            title: 3.0
            meta: 2.0
            content: 1.0
        disableStem:
          type: boolean
          description: Disable stemming for FTS
          default: false
        disableSynonyms:
          type: boolean
          description: Disable synonym expansion for FTS
          default: false
        lang:
          type: string
          description: Language for FTS query tokenization and stemming (e.g. "en", "pl", "de")
          example: en
        distanceMetric:
          type: string
          enum: [ cosine, dot_product, euclidean ]
          description: Distance metric for similarity computation
          default: cosine
          example: cosine
        boost:
          type: object
          additionalProperties:
            type: number
          description: |
            Per-query boost map applied to the fused combined score (not raw FTS/vector sub-scores).
            Keys follow the format `"metaKey:metaValue"`; positive values multiply the score of
            matching documents, negative values demote. See the same field on `FTSSearchRequest`
            for full semantics.
          example:
            "tag:featured": 2.0
            "status:archived": -3
        sort:
          type: string
          enum: [ combined, distance ]
          default: combined
          description: |
            Result ordering. `combined` (default) ranks by the fused score — keyword relevance
            and semantic similarity blended per `strategy`. `distance` re-sorts the post-merge
            result set by `distanceMeters` ascending so the nearest documents surface first.
            Requires a `geo` filter on the request; otherwise the server rejects the call
            because distances would all be zero.
          example: distance
        facetBy:
          type: array
          items:
            type: string
          description: (v2.9.15+) Metadata keys to aggregate into `facets` on the response
        facetMaxValues:
          type: integer
          description: (v2.9.15+) Cap per-key bucket count; 0 = unlimited

    HybridSearchResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/HybridSearchResultItem"
        total:
