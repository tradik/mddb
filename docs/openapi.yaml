  /v1/code-graph:
    get:
      tags:
        - Search
      summary: Code connection graph for one document
      description: >
        Answers the relational questions full-text search cannot: what breaks if
        this selector changes, which pages load this script, what does nothing
        reference any more. Edges are derived at query time from the
        `defines`/`uses`/`imports` metadata of code documents through the
        metadata index — nothing is stored, so a reindex reproduces the graph
        exactly. Resolution stays inside one collection.
      parameters:
        - name: collection
          in: query
          required: true
          schema:
            type: string
          description: Collection name
        - name: key
          in: query
          required: true
          schema:
            type: string
          description: Document key, e.g. `theme/style.css`
        - name: direction
          in: query
          schema:
            type: string
            enum: [ in, out, both ]
            default: both
          description: >
            `in` = what depends on this document, `out` = what it depends on.
        - name: depth
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 3
            default: 1
          description: Hops to follow. Values above the maximum are clamped, not rejected.
        - name: maxDegree
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
          description: >
            Maximum neighbours per node. A selector such as `.title` appears in
            nearly every template, so an unbounded walk returns the whole theme.
        - name: lines
          in: query
          schema:
            type: boolean
            default: false
          description: >
            Include the first line each edge's symbol appears on, both sides.
            Off by default: it is the only part of a traversal that reads
            document content.
      responses:
        "200":
          description: The graph around the requested document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodeGraphResponse"
        "400":
          description: Missing collection/key, or an unknown direction
        "404":
          description: No such document in the collection
    post:
      tags:
        - Search
      summary: Code connection graph for one document (JSON body)
      description: >
        Identical to the GET form. Accepts a JSON body for keys containing
        characters awkward in a query string.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ collection, key ]
              properties:
                collection:
                  type: string
                key:
                  type: string
                direction:
                  type: string
                  enum: [ in, out, both ]
                  default: both
                depth:
                  type: integer
                  minimum: 1
                  maximum: 3
                  default: 1
                maxDegree:
                  type: integer
                  minimum: 1
                  maximum: 100
                  default: 100
                lines:
                  type: boolean
                  default: false
                  description: Include first-occurrence line numbers for each edge.
              example:
                collection: theme
                key: theme/style.css
                direction: in
                depth: 2
      responses:
        "200":
          description: The graph around the requested document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodeGraphResponse"
        "400":
          description: Missing collection/key, or an unknown direction
        "404":
          description: No such document in the collection
  /v1/meta-keys:
    get:
      tags:
        - Search
      summary: List metadata keys and values for a collection
      description: Returns all unique metadata keys and their unique values for a
        given collection. Useful for building filter UIs.
      parameters:
        - name: collection
          in: query
          required: true
          schema:
            type: string
          description: Collection name
      responses:
        "200":
          description: Metadata keys with their unique values
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: string
                example:
                  meta:
                    tag: [ "go", "rust", "python" ]
                    author: [ "alice", "bob" ]
        "400":
          description: Missing collection parameter

  /v1/checksum:
    get:
      tags:
        - Collections
      summary: Get collection checksum
      description: Returns a CRC32-based checksum for a collection that changes
        whenever documents are added, updated, or deleted. Useful for cache
        invalidation - clients can poll this lightweight endpoint to detect
        changes without downloading all documents.
      parameters:
        - name: collection
          in: query
          required: true
          schema:
            type: string
          description: Collection name
      responses:
        "200":
          description: Collection checksum and document count
          content:
            application/json:
              schema:
                type: object
                properties:
                  collection:
                    type: string
                  checksum:
                    type: string
                    description: 8-character hex CRC32 checksum
                  documentCount:
                    type: integer
                example:
                  collection: "blog"
                  checksum: "a1b2c3d4"
                  documentCount: 42
        "400":
          description: Missing collection parameter

  /v1/update:
    patch:
      tags:
        - Documents
      summary: Partial document update
      description: |
        Update document metadata and/or content independently.
        Only provided fields are updated; omitted fields remain unchanged.
        Use `meta: {}` to clear all metadata.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - collection
                - key
                - lang
              properties:
                collection:
                  type: string
                key:
                  type: string
                lang:
                  type: string
                meta:
                  type: object
                  description: "If provided, replaces all metadata. Use {} to clear."
                  additionalProperties:
                    type: array
                    items:
                      type: string
                contentMd:
                  type: string
                  description: "If provided, replaces document content."
                ttl:
                  type: integer
                  description: "If provided, updates TTL in seconds. 0 = no expiry."
            examples:
              meta-only:
                summary: Update only metadata
                value:
                  collection: "blog"
                  key: "p1"
                  lang: "en"
                  meta:
                    tag: [ "go", "updated" ]
              content-only:
                summary: Update only content
                value:
                  collection: "blog"
                  key: "p1"
                  lang: "en"
                  contentMd: "# New Content"
      responses:
        "200":
          description: Updated document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "400":
          description: Missing required fields or no fields to update
        "404":
          description: Document not found
        "405":
          description: Method not allowed

  /v1/doc-meta:
    get:
      tags:
        - Documents
      summary: Get document metadata only
      description: Returns metadata for a document without content. Lightweight read
        useful for checking tags without transferring document body.
      parameters:
        - name: collection
          in: query
          required: true
          schema:
            type: string
          description: Collection name
        - name: key
          in: query
          required: true
          schema:
            type: string
          description: Document key
        - name: lang
          in: query
          schema:
            type: string
            default: "en"
          description: Language code (defaults to "en")
      responses:
        "200":
          description: Document metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  key:
                    type: string
                  lang:
                    type: string
                  meta:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: string
                  addedAt:
                    type: integer
                  updatedAt:
                    type: integer
                  expiresAt:
                    type: integer
                example:
                  key: "p1"
                  lang: "en"
                  meta:
                    tag: [ "go", "rust" ]
                    author: [ "alice" ]
                  addedAt: 1709600000
                  updatedAt: 1709610000
        "400":
          description: Missing required parameters
        "404":
          description: Document not found

  /v1/classify:
    post:
      tags:
        - Classification
      summary: Zero-shot document classification
      description: |
        Classify a document or text against candidate labels using embedding similarity.
        Provide either a document reference (collection + key + lang) or raw text, plus an array of candidate labels.
        Returns labels ranked by cosine similarity to the document/text embedding.
        Requires an embedding provider to be configured.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - labels
              properties:
                collection:
                  type: string
                  description: Collection name (for document reference)
                key:
                  type: string
                  description: Document key (for document reference)
                lang:
                  type: string
                  description: Language code (for document reference, defaults to "en")
                text:
                  type: string
                  description: Raw text to classify (alternative to document reference)
                labels:
                  type: array
                  items:
                    type: string
                  description: Candidate labels to rank by similarity (max 100)
                topK:
                  type: integer
                  description: Return top K labels (0 = all, default is all)
                multi:
                  type: boolean
                  description: If true, return all labels above threshold
                threshold:
                  type: number
                  description: Minimum similarity score (default 0.0)
            example:
              text: "Go is a statically typed, compiled language designed at Google"
              labels: [ "programming", "cooking", "sports", "music" ]
      responses:
        "200":
          description: Classification results
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        label:
                          type: string
                        score:
                          type: number
                  model:
                    type: string
                  dimensions:
                    type: integer
              example:
                results:
                  - label: "programming"
                    score: 0.87
                  - label: "music"
                    score: 0.21
                  - label: "sports"
                    score: 0.18
                  - label: "cooking"
                    score: 0.12
                model: "text-embedding-3-small"
                dimensions: 1536
        "400":
          description: Missing labels, invalid request, or no embedding provider
        "404":
          description: Referenced document not found

  /v1/revisions:
    post:
      tags:
        - Revisions
      summary: List document revision history
      description: |
        Returns the revision history for a specific document, ordered by timestamp descending.
        Each revision includes the content and metadata at that point in time.
      operationId: listRevisions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - collection
                - key
                - lang
              properties:
                collection:
                  type: string
                  description: Collection name
                  example: blog
                key:
                  type: string
                  description: Document key
                  example: hello-world
                lang:
                  type: string
                  description: Language code
                  example: en_US
      responses:
        "200":
          description: Revision history retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  collection:
                    type: string
                    example: blog
                  key:
                    type: string
                    example: hello-world
                  lang:
                    type: string
                    example: en_US
                  revisions:
                    type: array
                    items:
                      $ref: "#/components/schemas/RevisionEntry"
                  total:
                    type: integer
                    description: Total number of revisions
                    example: 3
        "400":
          description: Missing required fields
        "404":
          description: Document not found

  /v1/revisions/restore:
    post:
      tags:
        - Revisions
      summary: Restore a document to a previous revision
      description: |
        Restores a document to the state it was in at a specific revision timestamp.
        The restored content becomes the current version of the document.
      operationId: restoreRevision
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - collection
                - key
                - lang
                - timestamp
              properties:
                collection:
                  type: string
                  description: Collection name
                  example: blog
                key:
                  type: string
                  description: Document key
                  example: hello-world
                lang:
                  type: string
                  description: Language code
                  example: en_US
                timestamp:
                  type: integer
                  format: int64
                  description: Unix timestamp of the revision to restore
                  example: 1704844800
      responses:
        "200":
          description: Document restored successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "400":
          description: Missing required fields or invalid timestamp
        "404":
          description: Document or revision not found

  /mcp:
    post:
      tags:
        - MCP
      summary: MCP Streamable HTTP endpoint (2025-11-25)
      description: |
        Streamable HTTP transport for MCP protocol 2025-11-25. Accepts JSON-RPC requests.
        Supported methods: initialize, tools/list, tools/call, resources/list, resources/read,
        prompts/list, prompts/get, completion/complete, logging/setLevel, ping.
        Notifications (no id) return 202 Accepted.
        Session management via MCP-Session-Id header.
        Available on MCP port (default 9000).
      operationId: mcpStreamableHTTP
      parameters:
        - name: MCP-Session-Id
          in: header
          description: Session identifier (assigned by server at initialize)
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                jsonrpc:
                  type: string
                  example: "2.0"
                id:
                  type: integer
                  example: 1
                method:
                  type: string
                  example: "tools/list"
                params:
                  type: object
      responses:
        "200":
          description: JSON-RPC response
          headers:
            MCP-Session-Id:
              description: Session identifier (present on initialize response)
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
        "202":
          description: Notification accepted (no response body)
    get:
      tags:
        - MCP
      summary: MCP SSE stream for server-initiated messages
      description: |
        Open an SSE stream for receiving server-initiated messages (notifications, progress).
        Requires MCP-Session-Id header from a previous initialize call.
      operationId: mcpStreamableSSE
      parameters:
        - name: MCP-Session-Id
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: SSE event stream
          content:
            text/event-stream:
              schema:
                type: string
    delete:
      tags:
        - MCP
      summary: Terminate MCP session
      description: Close an active MCP Streamable HTTP session.
      operationId: mcpTerminateSession
      parameters:
        - name: MCP-Session-Id
          in: header
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Session terminated

  /v1/events:
    get:
      tags:
        - Real-Time
      summary: Server-Sent Events stream
      description: |
        Subscribe to real-time events via SSE.

        Document events: `doc.added`, `doc.updated`, `doc.deleted`.

        Async job events: `job.started`, `job.progress`, `job.completed`,
        `job.failed`, `job.cancelled` — so a client can watch a bulk import
        finish instead of polling its status endpoint. Job events carry the
        same record `GET /v1/bulk/jobs/{id}` returns, under a `job` key.
        `job.progress` is throttled to one event per second per job; terminal
        events are not throttled.

        Default enabled (MDDB_SSE_ENABLED=false to disable).
      operationId: sseEvents
      parameters:
        - name: collection
          in: query
          description: Filter events to a specific collection (optional)
          schema:
            type: string
        - name: job
          in: query
          description: |
            Filter to one async job's events. A connection with this parameter
            receives that job's events only — no `doc.*` events — since a
            client asking for one job's stream wants the job, not every
            document change. Combines with `collection`.
          schema:
            type: string
      responses:
        "200":
          description: SSE event stream
          content:
            text/event-stream:
              schema:
                type: string

  /v1/audit:
    get:
      tags:
        - Audit
      summary: Query audit-log events (admin-only)
      description: |
        List structured audit-log events recorded by the server for ISO 27001
        A.8.15 / SOC 2 CC7.2 compliance. Admin JWT required. Returns 404 when
        `MDDB_AUDIT_ENABLED` is not set. Events are returned newest-first.
      operationId: auditQuery
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date-time
          description: RFC3339 lower bound (inclusive)
        - name: to
          in: query
          schema:
            type: string
            format: date-time
          description: RFC3339 upper bound (inclusive)
        - name: fromNanos
          in: query
          schema:
            type: integer
            format: int64
          description: Nanosecond-precision lower bound (overrides `from`)
        - name: toNanos
          in: query
          schema:
            type: integer
            format: int64
          description: Nanosecond-precision upper bound
        - name: actor
          in: query
          schema:
            type: string
          description: Filter by authenticated username
        - name: action
          in: query
          schema:
            type: string
          description: e.g. auth.login, auth.jwt, write./v1/add
        - name: result
          in: query
          schema:
            type: string
            enum: [ ok, fail ]
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
      responses:
        "200":
          description: Matching events
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      type: object
                      properties:
                        ts:
                          type: integer
                          format: int64
                        actor:
                          type: string
                        action:
                          type: string
                        resource:
                          type: string
                        collection:
                          type: string
                        key:
                          type: string
                        result:
                          type: string
                        ip:
                          type: string
                        userAgent:
                          type: string
                        detail:
                          type: string
                  count:
                    type: integer
                  dropped:
                    type: integer
                    format: int64
        "401":
          description: Missing or invalid token
        "403":
          description: Not an admin
        "404":
          description: Audit disabled
  /v1/audit/exporters:
    get:
      tags:
        - Audit
      summary: Per-sink audit export delivery counters (2.9.16+)
      description: |
        Returns a snapshot of every configured audit-log exporter (webhook,
        syslog) with delivered / failed / dropped counts and the last error.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        "200":
          description: Exporter status
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  exporters:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        target:
                          type: string
                        queued:
                          type: integer
                          format: int64
                        delivered:
                          type: integer
                          format: int64
                        failed:
                          type: integer
                          format: int64
                        dropped:
                          type: integer
                          format: int64
                        lastError:
                          type: string
                        bufferSize:
                          type: integer
        "401":
          description: Missing or invalid token
        "403":
          description: Not an admin
        "404":
          description: Audit disabled
  /v1/encryption/status:
    get:
      tags:
        - Encryption
      summary: At-rest encryption posture (2.9.16+)
      description: |
        Primary keyID, configured previous keyIDs, and per-collection counts
        of how each document is sealed (primary / legacy / plaintext / unknown).
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        "200":
          description: Encryption status
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled:
                    type: boolean
                  primaryKeyID:
                    type: integer
                  previousKeyIDs:
                    type: array
                    items:
                      type: integer
                  collections:
                    type: array
                    items:
                      type: object
                      properties:
                        collection:
                          type: string
                        encrypted:
                          type: boolean
                        total:
                          type: integer
                          format: int64
                        withPrimary:
                          type: integer
                          format: int64
                        withLegacy:
                          type: integer
                          format: int64
                        plaintext:
                          type: integer
                          format: int64
                        unknownKey:
                          type: integer
                          format: int64
                  currentJobID:
                    type: string
        "401":
          description: Missing or invalid token
        "403":
          description: Not an admin
  /v1/encryption/rotate:
    post:
      tags:
        - Encryption
      summary: Start a re-encryption job (2.9.16+)
      description: |
        Walks every encrypted entry sealed under a non-primary key and re-seals
        it with the current `MDDB_ENCRYPTION_KEY`. Plaintext entries and entries
        already under the primary keyID are skipped. Single-flight: calling
        rotate while a job is running returns the existing job's ID.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                collection:
                  type: string
                  description: Optional scope; empty = all collections
      responses:
        "200":
          description: Rotation job descriptor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RotationJob"
        "400":
          description: Encryption not configured
        "401":
          description: Missing or invalid token
        "403":
          description: Read-only mode or not an admin
  /v1/encryption/jobs:
    get:
      tags:
        - Encryption
      summary: List rotation jobs (2.9.16+)
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        "200":
          description: Jobs list (newest first)
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobs:
                    type: array
                    items:
                      $ref: "#/components/schemas/RotationJob"
  /v1/encryption/jobs/{id}:
    get:
      tags:
        - Encryption
      summary: Get a single key-rotation job
      description: Returns the status and progress of one encryption rotation job by ID.
      operationId: getEncryptionJob
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Rotation job ID
      responses:
        "200":
          description: Rotation job status
          content:
            application/json:
              schema:
                type: object
        "404":
          description: Job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/compliance-status:
    get:
      tags:
        - Compliance
      summary: Report the live state of the ISO 27001 / SOC 2 production guard
      description: |
        Returns the current compliance posture of the running server. No
        authentication required — designed for operator-facing liveness /
        readiness probes and external monitoring that must detect a drifted
        configuration. When `MDDB_PRODUCTION=true` is set and any guardrail is
        missing, the server refuses to boot, so a reachable endpoint with
        `production=true` implies `compliant=true`. When `MDDB_PRODUCTION` is
        unset the server runs with the existing defaults and this endpoint
        enumerates every missing control.
      operationId: complianceStatus
      responses:
        "200":
          description: Compliance posture
          content:
            application/json:
              schema:
                type: object
                required: [ production, compliant, missing, missingCount ]
                properties:
                  production:
                    type: boolean
                    description: True when MDDB_PRODUCTION=true was set at boot
                  compliant:
                    type: boolean
                    description: True when every guardrail is satisfied
                  missing:
                    type: array
                    items:
                      type: object
                      required: [ envVar, want, reason ]
                      properties:
                        envVar:
                          type: string
                          example: MDDB_AUDIT_ENABLED
                        want:
                          type: string
                          example: "true"
                        reason:
                          type: string
                          example: "A.8.15 / CC7.2 — audit trail"
                  missingCount:
                    type: integer
                    example: 0

  /v1/curation:
    get:
      tags:
        - Curation
      summary: List or fetch curation rules (v2.9.15+)
      description: |
        Pass `id` for a single rule, `collection` to list rules for one collection,
        or neither to list all rules (admin).
      parameters:
        - name: id
          in: query
          schema:
            type: string
        - name: collection
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Rule(s)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/CurationRule"
                  - type: object
                    properties:
                      rules:
                        type: array
                        items:
                          $ref: "#/components/schemas/CurationRule"
                      total:
                        type: integer
                      collection:
                        type: string
    post:
      tags:
        - Curation
      summary: Create a curation rule (v2.9.15+)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CurationRule"
      responses:
        "200":
          description: Created rule with assigned id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurationRule"
    put:
      tags:
        - Curation
      summary: Replace an existing curation rule (v2.9.15+)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CurationRule"
      responses:
        "200":
          description: Updated rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurationRule"
    delete:
      tags:
        - Curation
      summary: Delete a curation rule (v2.9.15+)
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  id:
                    type: string

  /v1/search-advisor:
    get:
      tags:
        - Search
      summary: How should I search this collection?
      description: |
        Measures a collection and recommends the search type, ranking
        algorithm, vector index, fusion weights and result shape — with a
        plain-language reason for every choice (SRCH-010).

        Read-only by default. `apply=true` additionally writes the
        recommendation into the collection's retrieval profile, which needs
        write permission.

        Also available as the `search_advisor` MCP tool, annotated read-only,
        so an agent can ask before it searches instead of guessing from
        algorithm names.
      operationId: getSearchAdvisor
      parameters:
        - name: collection
          in: query
          required: true
          schema:
            type: string
        - name: apply
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: Store the recommendation as the collection's retrieval profile.
      responses:
        "200":
          description: The recommendation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchRecommendation"
        "403":
          description: Forbidden, or read-only mode when apply=true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags:
        - Search
      summary: How should I search this collection? (body form)
      operationId: postSearchAdvisor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ collection ]
              properties:
                collection:
                  type: string
                apply:
                  type: boolean
                  default: false
      responses:
        "200":
          description: The recommendation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchRecommendation"

  /v1/collection-config:
    get:
      tags:
        - Collection Config
      summary: Get collection configuration
      description: Get the configuration for a specific collection including type,
        description, icon, color, and custom metadata.
      operationId: getCollectionConfig
      parameters:
        - name: collection
          in: query
          required: true
          schema:
            type: string
          description: Collection name
          example: blog
      responses:
        "200":
          description: Collection configuration retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  collection:
                    type: string
                    example: blog
                  config:
                    $ref: "#/components/schemas/CollectionConfig"
                  configured:
                    type: boolean
                    description: Whether the collection has been explicitly configured
                    example: true
        "400":
          description: Missing collection parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      tags:
        - Collection Config
      summary: Set collection configuration
      description: Set or update the configuration for a collection.
      operationId: setCollectionConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - collection
              properties:
                collection:
                  type: string
                  description: Collection name
                  example: blog
                type:
                  type: string
                  description: Collection type
                  example: website
                description:
                  type: string
                  description: Collection description
                  example: Blog posts and articles
                icon:
                  type: string
                  description: Collection icon (emoji or icon name)
                  example: "🌐"
                color:
                  type: string
                  description: Collection color (hex code)
                  example: "#3B82F6"
                customMeta:
                  type: object
                  additionalProperties: true
                  description: Custom key-value metadata for the collection
                wordpress:
                  $ref: "#/components/schemas/WordPressTargetConfig"
                retrieval:
                  $ref: "#/components/schemas/RetrievalProfile"
                responsePrompt:
                  type: string
                  maxLength: 4096
                  description: (v2.12.0+) How to format answers from this collection (RAG-002)
                trackAccess:
                  type: boolean
                  description: Record per-read access events for temporal analytics
                trackHot:
                  type: boolean
                  description: Maintain a hot-documents leaderboard for this collection
                spellCorrect:
                  type: boolean
                  description: Auto-correct FTS queries using the spell checker
                spellLang:
                  type: string
                  description: Override language for spell correction
                storageBackend:
                  type: string
                  enum: [ boltdb, memory, s3 ]
                  description: "Storage backend for this collection. Default: boltdb"
                  example: boltdb
                storageConfig:
                  $ref: "#/components/schemas/StorageConfigDef"
                quantization:
                  type: string
                  enum: [ float32, int8, int4 ]
                  description: "Vector quantization level for this collection. int8 gives 4x
                    compression (~1% recall drop), int4 gives 8x compression
                    (~2-3% recall drop). Default: float32 (no quantization).
                    Requires vector-reindex after changing."
                  example: int8
                diskOnlyVectors:
                  type: boolean
                  description: "Low-memory vector mode: RAM holds only the quantized
                    vectors while full-precision vectors stay on disk and are
                    read back to rescore the candidate set exactly. Requires
                    quantization (int8 or int4) and a vector-reindex after
                    enabling. Default: false"
                  example: true
      responses:
        "200":
          description: Collection configuration set successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  collection:
                    type: string
                    example: blog
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags:
        - Collection Config
      summary: Delete collection configuration
      description: Delete the configuration for a specific collection.
      operationId: deleteCollectionConfig
      parameters:
        - name: collection
          in: query
          required: true
          schema:
            type: string
          description: Collection name
          example: blog
      responses:
        "200":
          description: Collection configuration deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  collection:
                    type: string
                    example: blog
        "400":
          description: Missing collection parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/collection-configs:
    get:
      tags:
        - Collection Config
      summary: List all collection configurations
      description: Get all collection configurations.
      operationId: listCollectionConfigs
      responses:
        "200":
          description: All collection configurations retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  configs:
                    type: array
                    items:
                      type: object
                      properties:
                        collection:
                          type: string
                          example: blog
                        config:
                          $ref: "#/components/schemas/CollectionConfig"
                  total:
                    type: integer
                    description: Total number of configured collections
                    example: 3

  /v1/aggregate:
    post:
      tags:
        - Aggregations
      summary: Aggregate metadata facets and date histograms
      description: |
        Compute metadata value counts (facets) and date histograms for a collection.
        Supports optional metadata pre-filtering to scope the aggregation.
      operationId: aggregate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AggregateRequest"
      responses:
        "200":
          description: Aggregation results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AggregateResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/cross-search:
    post:
      tags:
        - Cross-Collection Search
      summary: Cross-collection vector search
      description: |
        Search across multiple collections using a source document's embedding vector or a text query.
        Useful for finding related content across different collection types (e.g., images matching blog post content).
      operationId: crossSearch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CrossSearchRequest"
      responses:
        "200":
          description: Cross-collection search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CrossSearchResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/find-duplicates:
    post:
      tags:
        - Duplicate Detection
      summary: Find duplicate and similar documents
      description: |
        Scans a collection for duplicate and similar documents using content hashes and embedding vectors.
        Exact mode groups documents with identical content hashes. Similar mode compares embedding vectors
        pairwise and clusters documents above the similarity threshold using transitive clustering.
      operationId: findDuplicates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FindDuplicatesRequest"
      responses:
        "200":
          description: Duplicate detection results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FindDuplicatesResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/memory/session:
    post:
      tags: [ Memory RAG ]
      summary: Create a new memory session
      description: Start a new conversation session for storing and recalling messages.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ userId ]
              properties:
                userId:
                  type: string
                  description: User identifier
                scenario:
                  type: string
                  description: Session context/scenario
                title:
                  type: string
                  description: Human-readable title
                meta:
                  type: object
                  additionalProperties:
                    type: string
                ttl:
                  type: integer
                  description: TTL in seconds (default 30 days)
      responses:
        "200":
          description: Session created
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessionId:
                    type: string
                  userId:
                    type: string
                  scenario:
                    type: string
                  title:
                    type: string
                  createdAt:
                    type: integer
                  expiresAt:
                    type: integer

  /v1/memory/message:
    post:
      tags: [ Memory RAG ]
      summary: Add a message to a session
      description: Store a message in a memory session. Messages are auto-embedded for
        semantic recall.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ sessionId, role, content ]
              properties:
                sessionId:
                  type: string
                role:
                  type: string
                  enum: [ user, assistant, system, tool ]
                content:
                  type: string
                meta:
                  type: object
                  additionalProperties:
                    type: string
      responses:
        "200":
          description: Message added
          content:
            application/json:
              schema:
                type: object
                properties:
                  messageId:
                    type: string
                  sessionId:
                    type: string
                  role:
                    type: string
                  createdAt:
                    type: integer
                  embedded:
                    type: boolean

  /v1/memory/recall:
    post:
      tags: [ Memory RAG ]
      summary: Recall relevant messages
      description: Semantically recall relevant messages from past conversations using
        hybrid search (vector + keyword).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ query ]
              properties:
                query:
                  type: string
                userId:
                  type: string
                sessionId:
                  type: string
                role:
                  type: string
                topK:
                  type: integer
                  default: 10
                threshold:
                  type: number
                strategy:
                  type: string
                  enum: [ hybrid, semantic, keyword ]
                  default: hybrid
                alpha:
                  type: number
                includeContent:
                  type: boolean
                filterMeta:
                  type: object
      responses:
        "200":
          description: Recall results
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        document:
                          $ref: "#/components/schemas/Document"
                        score:
                          type: number
                        rank:
                          type: integer
                        sessionId:
                          type: string
                        role:
                          type: string
                        matchStrategy:
                          type: string
                  total:
                    type: integer
                  strategy:
                    type: string
                  query:
                    type: string

  /v1/memory/summarize:
    post:
      tags: [ Memory RAG ]
      summary: Summarize a session
      description: Generate and store a summary of a session's conversation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ sessionId ]
              properties:
                sessionId:
                  type: string
                userId:
                  type: string
      responses:
        "200":
          description: Summary generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  summaryId:
                    type: string
                  sessionId:
                    type: string
                  summary:
                    type: string
                  createdAt:
                    type: integer
                  messages:
                    type: integer

  /v1/memory/sessions:
    post:
      tags: [ Memory RAG ]
      summary: List memory sessions
      description: List sessions with optional user/scenario filtering and pagination.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: string
                scenario:
                  type: string
                limit:
                  type: integer
                  default: 50
                offset:
                  type: integer
                sort:
                  type: string
                  enum: [ createdAt, updatedAt ]
                  default: createdAt
                asc:
                  type: boolean
      responses:
        "200":
          description: Session list
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions:
                    type: array
                    items:
                      type: object
                      properties:
                        sessionId:
                          type: string
                        userId:
                          type: string
                        scenario:
                          type: string
                        title:
                          type: string
                        createdAt:
                          type: integer
                        updatedAt:
                          type: integer
                        expiresAt:
                          type: integer
                        messageCount:
                          type: integer
                  total:
                    type: integer

  /v1/memory/history:
    post:
      tags: [ Memory RAG ]
      summary: Get session message history
      description: Retrieve chronologically ordered message history for a session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ sessionId ]
              properties:
                sessionId:
                  type: string
                limit:
                  type: integer
                  default: 100
                offset:
                  type: integer
      responses:
        "200":
          description: Message history
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages:
                    type: array
                    items:
                      $ref: "#/components/schemas/Document"
                  total:
                    type: integer

  /v1/temporal/query:
    post:
      tags: [ Temporal Tracking ]
      summary: Query document event history
      description: Returns create/update/access events for a specific document within
        a time range. Requires MDDB_TEMPORAL=true.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ collection, key, lang ]
              properties:
                collection:
                  type: string
                key:
                  type: string
                lang:
                  type: string
                eventType:
                  type: string
                  enum: [ create, update, access ]
                  description: Filter by event type; omit for all events
                from:
                  type: integer
                  format: int64
                  description: Unix timestamp; defaults to 30 days ago
                to:
                  type: integer
                  format: int64
                  description: Unix timestamp; defaults to now
                limit:
                  type: integer
                  default: 100
      responses:
        "200":
          description: Event history
          content:
            application/json:
              schema:
                type: object
                properties:
                  collection:
                    type: string
                  docId:
                    type: string
                  events:
                    type: array
                    items:
                      $ref: "#/components/schemas/TemporalEvent"
                  total:
                    type: integer
        "400":
          description: Missing required fields or temporal not available

  /v1/temporal/hot:
    post:
      tags: [ Temporal Tracking ]
      summary: Hot documents leaderboard
      description: Returns the top-N most accessed documents in a collection. Requires
        MDDB_TEMPORAL=true.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ collection ]
              properties:
                collection:
                  type: string
                topN:
                  type: integer
                  default: 10
                since:
                  type: integer
                  format: int64
                  description: Unix timestamp to filter events from
      responses:
        "200":
          description: Hot documents list
          content:
            application/json:
              schema:
                type: object
                properties:
                  collection:
                    type: string
                  entries:
                    type: array
                    items:
                      type: object
                      properties:
                        docId:
                          type: string
                        accessCount:
                          type: integer
                          format: int64
                        lastAccessAt:
                          type: integer
                          format: int64
                        document:
                          $ref: "#/components/schemas/Document"
        "400":
          description: Missing required field or temporal not available

  /v1/temporal/histogram:
    post:
      tags: [ Temporal Tracking ]
      summary: Event frequency histogram
      description: Returns a bucketed histogram of event frequency for a collection.
        Requires MDDB_TEMPORAL=true.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ collection ]
              properties:
                collection:
                  type: string
                eventType:
                  type: string
                  default: access
                  enum: [ create, update, access ]
                interval:
                  type: string
                  default: day
                  enum: [ day, week, month ]
                from:
                  type: integer
                  format: int64
                to:
                  type: integer
                  format: int64
      responses:
        "200":
          description: Histogram buckets
          content:
            application/json:
              schema:
                type: object
                properties:
                  collection:
                    type: string
                  eventType:
                    type: string
                  interval:
                    type: string
                  buckets:
                    type: array
                    items:
                      type: object
                      properties:
                        from:
                          type: integer
                          format: int64
                        to:
                          type: integer
                          format: int64
                        count:
                          type: integer
        "400":
          description: Missing required field or temporal not available

  /v1/spell-suggest:
    post:
      tags: [ Spell Correction ]
      summary: Spell correction suggestions
      description: Returns per-token spell suggestions and a corrected version of the
        input text. Requires MDDB_SPELL=true.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ text, lang ]
              properties:
                collection:
                  type: string
                  description: Optional — scope suggestions to collection dictionary
                text:
                  type: string
                lang:
                  type: string
                  example: en
                maxSuggestions:
                  type: integer
                  default: 5
      responses:
        "200":
          description: Spell suggestions
          content:
            application/json:
              schema:
                type: object
                properties:
                  originalText:
                    type: string
                  suggestedText:
                    type: string
                  tokenSuggestions:
                    type: array
                    items:
                      type: object
                      properties:
                        token:
                          type: string
                        suggestions:
                          type: array
                          items:
                            type: string
        "503":
          description: Spell index still loading — retry

  /v1/spell-cleanup:
    post:
      tags: [ Spell Correction ]
      summary: Apply spell corrections to text
      description: Applies the best corrections to each token and returns the cleaned
        text. Requires MDDB_SPELL=true.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ text, lang ]
              properties:
                collection:
                  type: string
                text:
                  type: string
                lang:
                  type: string
      responses:
        "200":
          description: Cleaned text
          content:
            application/json:
              schema:
                type: object
                properties:
                  original:
                    type: string
                  cleaned:
                    type: string
                  correctionsApplied:
                    type: integer
        "503":
          description: Spell index still loading — retry

  /v1/spell-dictionary:
    get:
      tags: [ Spell Correction ]
      summary: List custom dictionary words
      description: Returns words in the custom dictionary for the given collection and
        language.
      parameters:
        - in: query
          name: collection
          schema:
            type: string
        - in: query
          name: lang
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Dictionary words
          content:
            application/json:
              schema:
                type: object
                properties:
                  collection:
                    type: string
                  lang:
                    type: string
                  words:
                    type: array
                    items:
                      type: string
    put:
      tags: [ Spell Correction ]
      summary: Add words to custom dictionary
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ lang, words ]
              properties:
                collection:
                  type: string
                lang:
                  type: string
                words:
                  type: array
                  items:
                    type: string
                frequency:
                  type: integer
                  default: 100
                  description: Boost frequency for added words
      responses:
        "200":
          description: Words added
          content:
            application/json:
              schema:
                type: object
                properties:
                  added:
                    type: integer
    delete:
      tags: [ Spell Correction ]
      summary: Remove words from custom dictionary
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ lang, words ]
              properties:
                collection:
                  type: string
                lang:
                  type: string
                words:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: Words removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  removed:
                    type: integer

components:
  schemas:
    CodeGraphResponse:
      type: object
      description: >
        One traversal of the code connection graph. Nodes and edges are sorted,
        so two responses can be diffed to see what a change did.
      properties:
        collection:
          type: string
        root:
          type: string
          description: The key the traversal started from
        direction:
          type: string
          enum: [ in, out, both ]
        depth:
          type: integer
        nodes:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
              docId:
                type: string
              lang:
                type: string
              language:
                type: string
                description: Source language, e.g. `css`, `javascript`, `html`
              depth:
                type: integer
                description: Hops from the root, by the shortest path
        edges:
          type: array
          items:
            type: object
            properties:
              from:
                type: string
              to:
                type: string
              kind:
                type: string
                enum: [ uses-selector, imports ]
              symbol:
                type: string
                description: >
                  The selector or path that justifies this edge. Without it the
                  answer is only "these files are related", which is not
                  actionable.
              direction:
                type: string
                enum: [ in, out ]
              lines:
                type: object
                description: >
                  Present only when `lines` was requested. A symbol usually
                  occurs more than once, so these are the first occurrence — a
                  place to jump to, not a complete answer. Zero means the symbol
                  is not literal text in that file.
                properties:
                  fromLine:
                    type: integer
                  toLine:
                    type: integer
        truncated:
          type: boolean
          description: >
            A depth or degree limit cut the walk short, so "nothing else depends
            on this" cannot be read from a truncated result.
      example:
        collection: theme
        root: theme/style.css
        direction: in
        depth: 1
        nodes:
          - key: theme/style.css
            docId: rng|doc-0001|en
            language: css
            depth: 0
          - key: theme/index.html
            docId: rng|doc-0002|en
            language: html
            depth: 1
        edges:
          - from: theme/index.html
            to: theme/style.css
            kind: uses-selector
            symbol: .hero-banner
            direction: in
        truncated: false
    MCPAPIKeySummary:
      type: object
      description: |
        Public view of an MCP API key. Carries no key material: `fingerprint`
        is four bytes of SHA-256 over the key, and `keyPrefix` holds only the
        scheme marker every key starts with.
      properties:
        keyPrefix:
          type: string
          description: Scheme marker only — never a slice of the key.
          example: mcp_
        fingerprint:
          type: string
          description: Stable, non-reversible identifier; matches what the server logs.
          example: 9f2a41c7
        name:
          type: string
          example: claude-desktop
        createdAt:
          type: integer
          format: int64
        expiresAt:
          type: integer
          format: int64
          description: Unix timestamp; absent when the key never expires.
        disabled:
          type: boolean

    MCPAPIKeyRef:
      type: object
      description: Identifies an existing key by its full value.
      required:
        - key
      properties:
        key:
          type: string
          example: mcp_4f3c2a1b8e7d6c5b4a39281706f5e4d3

    RotationJob:
      type: object
      description: Encryption re-keying job descriptor (2.9.16+).
      properties:
        id:
          type: string
        status:
          type: string
          enum: [queued, running, completed, failed]
        primaryKeyID:
          type: integer
        startedAt:
          type: integer
          format: int64
          description: Unix nanoseconds
        finishedAt:
          type: integer
          format: int64
        scanned:
          type: integer
          format: int64
        reencrypted:
          type: integer
          format: int64
        skipped:
          type: integer
          format: int64
        errors:
          type: integer
          format: int64
        lastError:
          type: string
    WikiImportResponse:
      type: object
      properties:
        imported:
          type: integer
          description: Number of pages successfully imported
        skipped:
          type: integer
          description: Number of pages skipped (wrong namespace, redirects, empty)
        failed:
          type: integer
          description: Number of pages that failed to import
        errors:
          type: array
          items:
            type: string
          description: Error messages (capped at 10)
        collection:
          type: string
          description: Target collection name
        durationMs:
          type: integer
          format: int64
          description: Total import duration in milliseconds
    TemporalEvent:
      type: object
      properties:
        docId:
          type: string
        collection:
          type: string
        eventType:
          type: string
          enum: [ create, update, access ]
        timestamp:
          type: integer
          format: int64
    Document:
      type: object
      properties:
        id:
          type: string
          description: Auto-generated document ID
          example: doc|blog|hello-world|en_US
        key:
          type: string
          description: Document key (unique within collection and language)
          example: hello-world
        lang:
          type: string
          description: Language code (e.g., en_US, pl_PL, de_DE)
          example: en_US
        meta:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: Metadata key-value pairs (values are arrays)
          example:
            category: [ blog, tutorial ]
            author: [ John Doe ]
            tags: [ markdown, database ]
        contentMd:
          type: string
          description: Markdown content
          example: "# Hello World\n\nWelcome to MDDB!"
        addedAt:
          type: integer
          format: int64
          description: Unix timestamp when document was created
          example: 1704844800
        updatedAt:
          type: integer
          format: int64
          description: Unix timestamp when document was last updated
          example: 1704931200

    AddRequest:
      type: object
      required:
        - collection
        - key
        - lang
        - contentMd
      properties:
        collection:
          type: string
          description: Collection name
          example: blog
        key:
          type: string
          description: Document key
          example: hello-world
        lang:
          type: string
          description: Language code
          example: en_US
        meta:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: Metadata key-value pairs
          example:
            category: [ blog ]
            author: [ John Doe ]
        contentMd:
          type: string
          description: Markdown content
          example: "# Hello World\n\nWelcome to MDDB!"

    AddBatchRequest:
      type: object
      required:
        - collection
        - documents
      properties:
        collection:
          type: string
          description: Collection name
          example: blog
        documents:
          type: array
          items:
            $ref: "#/components/schemas/AddBatchDocument"
          description: Documents to add

    AddBatchDocument:
      type: object
      required:
        - key
        - lang
        - contentMd
      properties:
        key:
          type: string
          description: Document key
          example: post1
        lang:
          type: string
          description: Language code
          example: en
        contentMd:
          type: string
          description: Markdown content
          example: "# Hello World"
        meta:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: Metadata key-value pairs
          example:
            category: [ blog ]
        saveRevision:
          type: boolean
          description: Whether to save a revision
          default: false

    AddBatchResponse:
      type: object
      properties:
        added:
          type: integer
          description: Number of documents added
          example: 2
        updated:
          type: integer
          description: Number of documents updated
          example: 0
        failed:
          type: integer
          description: Number of documents that failed
          example: 0
        errors:
          type: array
          items:
            type: string
          description: Error messages for failed documents

    BulkIngestSubmitRequest:
      type: object
      required:
        - collection
        - documents
      properties:
        collection:
          type: string
          description: Target collection
          example: blog
        documents:
          type: array
          items:
            $ref: "#/components/schemas/AddBatchDocument"
          description: Documents to ingest; processed in chunks of 500
        callbackUrl:
          type: string
          description: Optional URL that receives a POST with the final job record on
            completion
          example: https://example.com/webhook

    BulkIngestJob:
      type: object
      properties:
        id:
          type: string
          description: Unique job identifier
          example: bulk_1776539903516445000_849876
        collection:
          type: string
          example: blog
        status:
          type: string
          enum: [ pending, processing, completed, failed, cancelled ]
          description: |
            - `pending`: queued, worker has not picked it up yet
            - `processing`: worker is actively committing chunks
            - `completed`: finished (may include per-document failures)
            - `failed`: all documents failed or the server restarted mid-job
            - `cancelled`: user cancelled while still pending
        total:
          type: integer
          description: Total documents submitted
        processed:
          type: integer
          description: Documents processed so far (includes successes and failures)
        added:
          type: integer
          description: Documents added to the collection
        updated:
          type: integer
          description: Documents updated
        failed:
          type: integer
          description: Documents that failed to commit
        errors:
          type: array
          items:
            type: string
          description: Up to 50 error messages recorded during processing
        callbackUrl:
          type: string
          description: Webhook URL supplied at submit time
        submittedAt:
          type: integer
          format: int64
          description: Unix timestamp (seconds) when the job was submitted
        startedAt:
          type: integer
          format: int64
          description: Unix timestamp when the worker picked up the job
        completedAt:
          type: integer
          format: int64
          description: Unix timestamp when the job reached a terminal status

    GeoJSONPolygon:
      type: object
      required:
        - coordinates
      properties:
        type:
          type: string
          enum: [ Polygon ]
          description: GeoJSON geometry type. Optional — the handler fills it in when
            omitted.
        coordinates:
          type: array
          description: |
            Array of linear rings. The first ring is the outer boundary; any
            subsequent rings are holes. Each ring is an array of `[lng, lat]`
            pairs (RFC 7946 order) with at least 3 points.
          items:
            type: array
            items:
              type: array
              minItems: 2
              maxItems: 3
              items:
                type: number

    GeoJSONMultiPolygon:
      type: object
      required:
        - coordinates
      properties:
        type:
          type: string
          enum: [ MultiPolygon ]
        coordinates:
          type: array
          description: Array of Polygon coordinate arrays. Union semantics — a document
            matches if it lies inside any member polygon.
          items:
            type: array
            items:
              type: array
              items:
                type: array
                minItems: 2
                maxItems: 3
                items:
                  type: number

    GeoPolygonRequest:
      type: object
      required:
        - collection
      properties:
        collection:
          type: string
          example: venues
        polygon:
          $ref: "#/components/schemas/GeoJSONPolygon"
        multiPolygon:
          $ref: "#/components/schemas/GeoJSONMultiPolygon"
        filterMeta:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: Optional metadata pre-filter (AND across keys, OR within key)
        includeContent:
          type: boolean
          default: false
      description: Exactly one of `polygon` or `multiPolygon` must be set.

    GeoPolygonResponse:
      type: object
      properties:
        results:
          type: array
          items:
            type: object
            properties:
              document:
                type: object
              rank:
                type: integer
        total:
          type: integer
        shape:
          type: string
          enum: [ polygon, multiPolygon ]
        algorithm:
          type: string
          example: rtree

    IngestRequest:
      type: object
      required:
        - collection
        - documents
      properties:
        collection:
          type: string
          description: Collection name
          example: imported
        documents:
          type: array
          items:
            $ref: "#/components/schemas/IngestDocument"
          description: Documents to ingest
        options:
          $ref: "#/components/schemas/IngestOptions"

    IngestDocument:
      type: object
      required:
        - lang
        - contentMd
      properties:
        url:
          type: string
          format: uri
          description: Source URL (used for key derivation and auto-injected as source_url
            metadata)
          example: https://example.com/page1
        key:
          type: string
          description: Document key (derived from URL if empty)
          example: page1
        lang:
          type: string
          description: Language code
          example: en
        contentMd:
          type: string
          description: Markdown content
          example: "# Page 1\n\nContent here."
        meta:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: Metadata key-value pairs
        extractFrontmatter:
          type: boolean
          description: Parse YAML frontmatter from content and merge into metadata
          default: false
        scrapedAt:
          type: integer
          format: int64
          description: Unix timestamp of when the content was scraped (auto-injected as
            scraped_at metadata)
          example: 1709500000
        scraper:
          type: string
          description: Scraper identifier (auto-injected as scraper metadata)
          example: my-crawler
        ttl:
          type: integer
          format: int64
          description: Time-to-live in seconds
          example: 86400

    IngestOptions:
      type: object
      properties:
        skipDuplicates:
          type: boolean
          description: Skip documents whose content hasn't changed (CRC32 hash comparison)
          default: false
        skipEmbeddings:
          type: boolean
          description: Skip embedding generation for this batch
          default: false
        skipFts:
          type: boolean
          description: Skip FTS indexing for this batch
          default: false
        skipWebhooks:
          type: boolean
          description: Skip webhook firing for this batch
          default: false
        autoConfigureCollection:
          type: boolean
          description: Auto-configure collection as "scraping" type if it doesn't exist
          default: false
        saveRevision:
          type: boolean
          description: Save revision history for all documents in this batch
          default: false
        profile:
          type: string
          enum: [ default, fast ]
          default: default
          description: >
            (v2.12.0+) Named preset of the flags above. `default` keeps every
            step. `fast` trades parsing fidelity and per-document bookkeeping
            for throughput: text-only parsing, no webhooks, no revisions,
            duplicates skipped. Notably `fast` does NOT skip embeddings or FTS —
            that is a separate decision with its own flag. Any flag set
            explicitly overrides the preset, so `fast` plus `saveRevision: true`
            keeps revisions. An unknown name is rejected with 400 rather than
            falling back silently.
        textOnly:
          type: boolean
          default: false
          description: >
            (v2.12.0+) Extract plain text from html/docx/odt instead of
            rebuilding their structure as Markdown. Implied by `profile: fast`.
            PDF has no text-only variant: its extractor already produces plain
            text and builds no structure.

    IngestResponse:
      type: object
      properties:
        added:
          type: integer
          description: Number of documents added
          example: 2
        updated:
          type: integer
          description: Number of documents updated
          example: 0
        skipped:
          type: integer
          description: Number of documents skipped (deduplication)
          example: 0
        failed:
          type: integer
          description: Number of documents that failed
          example: 0
        errors:
          type: array
          items:
            type: string
          description: Error messages for failed documents
        collection:
          type: string
          description: Collection name
          example: imported
        durationMs:
          type: integer
          format: int64
          description: Total processing time in milliseconds
          example: 45
        profile:
          type: string
          description: >
            (v2.12.0+) Which ingest profile actually applied, so a corpus
            loaded months ago can be explained without guessing which flags the
            caller sent.

    GetRequest:
      type: object
      required:
