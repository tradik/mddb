          description: Number of documents skipped (content unchanged)
          example: 10
        failed:
          type: integer
          description: Number of documents that failed to embed
          example: 0
        totalChunks:
          type: integer
          description: Total number of chunks embedded across all documents
          example: 128
        errors:
          type: array
          items:
            type: string
          description: Error messages for failed embeddings

    VectorStatsResponse:
      type: object
      properties:
        enabled:
          type: boolean
          description: Whether vector search is enabled
          example: true
        provider:
          type: string
          description: Embedding provider name
          example: text-embedding-3-small
        model:
          type: string
          description: Embedding model name
          example: text-embedding-3-small
        dimensions:
          type: integer
          description: Embedding vector dimensions
          example: 1536
        index_ready:
          type: boolean
          description: Whether the vector index is loaded and ready
          example: true
        collections:
          type: object
          additionalProperties:
            type: object
            properties:
              total_documents:
                type: integer
                description: Total documents in collection
                example: 100
              embedded_documents:
                type: integer
                description: Documents with embeddings
                example: 95
              total_chunks:
                type: integer
                description: Total embedding chunks (including multi-chunk documents)
                example: 280
          description: Per-collection embedding statistics
          example:
            blog:
              total_documents: 100
              embedded_documents: 95
              total_chunks: 280
        chunking:
          type: object
          properties:
            enabled:
              type: boolean
              description: Whether document chunking is enabled
              example: true
            chunkSize:
              type: integer
              description: Maximum characters per chunk
              example: 1500
          description: Chunking configuration

    FTSSearchRequest:
      type: object
      required:
        - collection
        - query
      properties:
        collection:
          type: string
          description: Collection name to search
          example: blog
        query:
          type: string
          description: Full-text search query string
          example: cancel subscription
        limit:
          type: integer
          description: Maximum number of results (default 50)
          default: 50
          example: 50
        algorithm:
          type: string
          enum: [ tfidf, bm25, bm25f, pmisparse ]
          description: |
            Scoring algorithm to use (default "tfidf").
            - **tfidf**: Classic TF-IDF scoring
            - **bm25**: Okapi BM25 with document length normalization (k1=1.2, b=0.75)
            - **bm25f**: BM25F field-weighted scoring — applies different weights to title, metadata, and content
            - **pmisparse**: PMISparse — BM25 + PMI query expansion (invented by Tradik Limited)
          default: tfidf
          example: bm25
        fuzzy:
          type: integer
          enum: [ 0, 1, 2 ]
          description: |
            Typo tolerance level (default 0).
            - **0**: Off — exact term matching only
            - **1**: Low — matches terms within 1 edit distance (e.g. "javascrip" → "javascript")
            - **2**: Medium — matches terms within 2 edit distances
          default: 0
          example: 0
        filterMeta:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: Metadata filters to narrow results before scoring (AND between
            keys, OR between values)
          example:
            category: [ tutorial ]
        fieldWeights:
          type: object
          additionalProperties:
            type: number
          description: Field weights for BM25F algorithm (keys are "title", "meta",
            "content")
          example:
            title: 3.0
            meta: 2.0
            content: 1.0
        disableStem:
          type: boolean
          description: Disable stemming for this query
          default: false
        disableSynonyms:
          type: boolean
          description: Disable synonym expansion for this query
          default: false
        mode:
          type: string
          enum: [ auto, simple, boolean, phrase, wildcard, proximity, expression ]
          description: |
            Search mode (default "auto"). Auto-detect parses the query to determine the appropriate mode.
            - **auto**: Auto-detect from query syntax
            - **simple**: Classic keyword search
            - **boolean**: AND/OR/NOT operators, +required, -excluded
            - **phrase**: Exact word sequence (`"quoted phrases"`)
            - **wildcard**: Pattern matching (`*` any chars, `?` single char)
            - **proximity**: Terms within N words (`"term1 term2"~5`)
            - **expression**: Full query DSL with nested parens, precedence, and mixed atoms (v2.9.15+)
          default: auto
          example: auto
        distance:
          type: integer
          description: Maximum word distance for proximity search (default 5)
          default: 5
          example: 5
        lang:
          type: string
          description: |
            Language code for query tokenization (e.g., "en", "pl", "de"). Uses language-specific stemmer and stop words.
            Language codes are normalized: "en_US" → "en", "pl_PL" → "pl". Falls back to server default if omitted.
          example: en
        rangeMeta:
          type: array
          description: Range filters on metadata or timestamp fields
          items:
            $ref: "#/components/schemas/RangeFilter"
        boost:
          type: object
          additionalProperties:
            type: number
          description: |
            Per-query boost map. Keys follow the format `"metaKey:metaValue"`.
            Positive values multiply the score of documents matching that
            metadata pair (e.g. `5.0` = 5× boost); negative values demote
            (e.g. `-2.0` = ½× penalty). Zero is ignored. Multipliers from
            multiple matching entries combine multiplicatively; the final
            per-document multiplier is floored at `0.001` to prevent total
            score collapse.
          example:
            "tag:breed": 5.0
            "category:health": -2
        highlight:
          type: boolean
          default: false
          description: |
            When true (v2.9.15+), each result gains a `highlights` array with
            text snippets around matched terms. Works uniformly across every
            FTS mode.
        highlightTag:
          type: string
          default: "<mark>"
          description: Wrap tag for matched terms (close tag derived automatically)
        maxHighlights:
          type: integer
          default: 3
          description: Cap fragments per result
        fragmentSize:
          type: integer
          default: 150
          description: Approximate chars per fragment (snapped to word boundaries)
        facetBy:
          type: array
          items:
            type: string
          description: |
            (v2.9.15+) Metadata keys to aggregate into `facets` on the response.
            Counts are computed over the documents actually returned (after
            filtering, boosts, curation).
          example: [ category, lang ]
        facetMaxValues:
          type: integer
          description: (v2.9.15+) Cap per-key bucket count; 0 = unlimited
          default: 0

        cacheTtl:
          type: integer
          description: |
            Serve this search from the result cache when a matching response is
            no older than this many seconds, and store the response for that
            long. Omitted or 0 means no caching at all — neither served nor
            stored — so a request that says nothing keeps the default
            behaviour and the default freshness.

            Writes to the collection invalidate its cached results
            immediately. The response carries `X-MDDB-Cache: hit|miss`.
            Capped at 3600; `MDDB_SEARCH_CACHE_SIZE=0` disables the cache
            server-wide.
          minimum: 0
          maximum: 3600
          example: 60
    Highlight:
      type: object
      properties:
        fragment:
          type: string
          description: Snippet with matched terms wrapped in the configured tag; ellipsis
            `…` markers denote truncation
        matchedTerms:
          type: array
          items:
            type: string
        startOffset:
          type: integer
          description: Byte offset into the raw ContentMD where the fragment begins
        endOffset:
          type: integer

        startLine:
          type: integer
          description: |
            (v2.12.0+) 1-based, inclusive line where the fragment begins. This
            is what makes a result a place to edit rather than a document to
            read — see docs/API.md#finding-the-place-not-just-the-file.
        endLine:
          type: integer
          description: (v2.12.0+) 1-based, inclusive line where the fragment ends
    RangeFilter:
      type: object
      properties:
        field:
          type: string
          description: Field name — metadata key, or built-in "addedAt" / "updatedAt"
          example: price
        gte:
          type: string
          description: Greater than or equal (numeric, date string, or unix timestamp)
          example: "10"
        lte:
          type: string
          description: Less than or equal
          example: "100"
        gt:
          type: string
          description: Greater than
        lt:
          type: string
          description: Less than

    FTSSearchResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/FTSResultItem"
        total:
          type: integer
          description: Number of results returned
          example: 3
        algorithm:
          type: string
          description: Algorithm used for this search
          example: tfidf
        mode:
          type: string
          description: Search mode used (simple, boolean, phrase, wildcard, proximity)
          example: simple
        lang:
          type: string
          description: Language used for query tokenization
          example: en
        fuzzy:
          type: integer
          description: Typo tolerance level used
          example: 0
        searchStats:
          $ref: "#/components/schemas/SearchStats"
        facets:
          $ref: "#/components/schemas/FacetMap"
        stemmingActive:
          type: boolean
          description: Whether stemming was applied to this query
        synonymsActive:
          type: boolean
          description: Whether synonym expansion was applied to this query
        fieldWeights:
          type: object
          additionalProperties:
            type: number
          description: Effective per-field weights used for scoring (BM25F)
        spellCorrected:
          type: object
          nullable: true
          description: >-
            Spell-correction info when the collection has spellCorrect enabled
            and the query was auto-corrected (original and corrected terms).

    FacetBucket:
      type: object
      properties:
        value:
          type: string
        count:
          type: integer
      required: [ value, count ]

    FacetMap:
      type: object
      description: |
        (v2.9.15+) Per-key facet counts. Buckets are ordered by count desc,
        value asc. Missing keys produce an empty bucket list so UIs can
        render a stable facet group layout across queries.
      additionalProperties:
        type: array
        items:
          $ref: "#/components/schemas/FacetBucket"

    FTSResultItem:
      type: object
      properties:
        document:
          $ref: "#/components/schemas/Document"
        score:
          type: number
          format: float
          description: TF-IDF relevance score
          example: 2.45
        matchedTerms:
          type: array
          items:
            type: string
          description: Terms from the query that matched
          example: [ cancel, subscription ]
        pinned:
          type: boolean
          description: |
            (v2.9.15+) Marked `true` when a curation rule injected this row at
