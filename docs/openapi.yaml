              example: 3
            queueLen:
              type: integer
              example: 0
        uptime:
          type: string
          example: 2h15m30s

    VectorSearchRequest:
      type: object
      required:
        - collection
      properties:
        oversample:
          type: number
          minimum: 1.0
          maximum: 10.0
          description: >
            (v2.12.0+) Recall/latency knob: candidates fetched per requested
            result before deduplication, merging or rescoring trims them.
            Omitted, uses the collection's retrieval profile then MDDB's default
            of 3.0. Out of range returns 422 rather than clamping. See
            SEARCH.md#oversampling-v2120 for measured effect.
        collection:
          type: string
          description: Collection name to search
          example: blog
        query:
          type: string
          description: Natural language query string (required if queryVector is not
            provided)
          example: How to set up a CI/CD pipeline?
        queryVector:
          type: array
          items:
            type: number
            format: float
          description: Raw embedding vector (optional, use instead of query for
            pre-computed embeddings)
        topK:
          type: integer
          description: Number of top results to return (default 5)
          default: 5
          example: 5
        threshold:
          type: number
          format: float
          description: Minimum cosine similarity score (0.0 to 1.0)
          minimum: 0
          maximum: 1
          example: 0.7
        filterMeta:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: Metadata filters to narrow results before ranking
          example:
            category: [ devops, tutorial ]
        includeContent:
          type: boolean
          description: Whether to include document content in results (default false)
          default: false
          example: false
        algorithm:
          type: string
          enum: [ flat, hnsw, ivf, pq, opq, sq, sq4, bq, quantized ]
          description: |
            Search algorithm to use (default "flat").
            - **flat**: Exact brute-force cosine similarity (most accurate, slower for large datasets)
            - **hnsw**: Hierarchical Navigable Small World graph (fast approximate, best general-purpose)
            - **ivf**: Inverted File Index with k-means clustering (good for large datasets)
            - **pq**: Product Quantization (compressed, lowest memory, slightly less accurate)
            - **opq**: Optimised Product Quantization — PQ with a learned rotation
            - **sq**: Scalar Quantization to 8 bits per dimension (4x smaller than float32)
            - **sq4**: Scalar Quantization to 4 bits, two dimensions per byte (8x smaller).
              Measured at 99.5% of `sq`'s recall@10 for half its storage — see
              `TestQuantizerRecallCurve`. Reach for it when a collection no longer
              fits in RAM at `sq`.
            - **bq**: Binary Quantization to 1 bit per dimension (32x smaller, much coarser)
            - **quantized**: Follows the collection's own `quantization` setting
          default: flat
          example: flat
        distanceMetric:
          type: string
          enum: [ cosine, dot_product, euclidean ]
          description: Distance metric for similarity computation
          default: cosine
          example: cosine
        retrievalMode:
          type: string
          enum: [ parent, chunk, window, graph ]
          description: |
            Result granularity (default "parent").
            - **parent**: One result per document, scored by its best-matching chunk.
            - **chunk**: One result per matching chunk; each result carries
              `chunkIndex` and `chunkText` with the exact matching passage —
              ideal for feeding precise context to an LLM.
            - **window**: Like `chunk`, but the passage is widened with
              `windowSize` neighboring chunks on each side.
          default: parent
          example: chunk
        windowSize:
          type: integer
          description: Neighbor chunks per side in "window" retrieval mode (default 1)
          default: 1
          example: 1
        mmr:
          type: boolean
          description: >-
            Diversify results with Maximal Marginal Relevance reranking.
            Selection balances query relevance against similarity to already
            selected results, so near-duplicate documents stop crowding out
            distinct ones.
          default: false
          example: true
        mmrLambda:
          type: number
          format: float
          description: >-
            MMR relevance/diversity balance in [0,1] — 1.0 keeps the pure
            relevance order, 0.0 maximizes diversity (default 0.5).
          minimum: 0
          maximum: 1
          default: 0.5
          example: 0.5

    VectorSearchResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/VectorSearchResultItem"
        total:
          type: integer
          description: Number of results returned
          example: 5
        model:
          type: string
          description: Embedding model used
          example: text-embedding-3-small
        dimensions:
          type: integer
          description: Embedding vector dimensions
          example: 1536
        algorithm:
          type: string
          description: Algorithm used for this search
          example: flat
        distanceMetric:
          type: string
          description: Distance metric used for this search
          example: cosine
        searchStats:
          $ref: "#/components/schemas/SearchStats"

    VectorSearchResultItem:
      type: object
      properties:
        document:
          $ref: "#/components/schemas/Document"
        score:
          type: number
          format: float
          description: Cosine similarity score (0.0 to 1.0)
          example: 0.92
        rank:
          type: integer
          description: Result rank (1-based)
          example: 1
        chunkIndex:
          type: integer
          description: Index of the matching chunk (only in chunk/window retrieval modes)
          example: 2
        chunkText:
          type: string
          description: The matching passage text (only in chunk/window retrieval modes)
          example: "## Deployment\nTo deploy the service..."

    VectorReindexRequest:
      type: object
      required:
        - collection
      properties:
        collection:
          type: string
          description: Collection name to reindex
          example: blog
        force:
          type: boolean
          description: If true, re-embed even if content is unchanged
          default: false
          example: false

    VectorReindexResponse:
      type: object
