openapi: 3.0.3
info:
  title: MDDB API
  description: |
    MDDB (Markdown Database) is a high-performance, version-controlled markdown database with triple protocol support.

    ## Features
    - Store and manage markdown documents with metadata
    - Full revision history for all documents
    - Multi-language support
    - Fast metadata-based search
    - **Vector search** with embedding providers (OpenAI, Cohere, Voyage AI, Ollama)
    - **Full-text search** with TF-IDF, BM25, BM25F, PMISparse scoring, 7 search modes (simple, boolean, phrase, wildcard, proximity, range, fuzzy), and multi-language stemming (18 languages)
    - **Hybrid search** combining FTS + vector search with alpha blending or RRF fusion
    - **Webhooks** for real-time event notifications
    - **TTL** (time-to-live) support for automatic document expiration
    - **JSON Schema validation** for document metadata
    - **URL import** with YAML frontmatter parsing
    - **Authentication** - JWT tokens and API keys
    - **Authorization** - Collection-level RBAC (Read/Write/Admin)
    - **Memory RAG** - Conversational memory system with session management, message storage, semantic/hybrid recall, and summarization
    - **User Management** - Multi-user with admin roles
    - **Group Permissions** - Organize users into groups
    - Template variable substitution
    - Export capabilities (NDJSON, ZIP)
    - Backup and restore operations
    - **Replication** - Leader-follower replication with binlog streaming
    - **Automation** - Webhooks, triggers (FTS/vector/hybrid + sentiment), crons
    - **Automation Logs** - Execution history with configurable TTL retention

    ## Protocols
    - **HTTP/JSON** - Port 11023 (documented here)
    - **gRPC/Protobuf** - Port 11024 (see gRPC documentation)
    - **GraphQL** - Port 11023/graphql (enable with MDDB_GRAPHQL_ENABLED=true)
    - **MCP** - Port 9000 (Streamable HTTP at `/mcp`, legacy SSE at `/sse`)
    - **HTTP/3 + QUIC** - Port 11443 (extreme mode only)

    ## Per-Protocol Access Modes
    Each protocol can have its own read/write mode: `MDDB_API_MODE`, `MDDB_GRPC_MODE`, `MDDB_MCP_MODE`, `MDDB_HTTP3_MODE`.
    Values: `read`, `write`, `wr`. Default: inherits from `MDDB_MODE`.
    Set `MDDB_MCP_BUILTIN_TOOLS=false` to hide built-in MCP tools.

    ## Authentication
    MDDB supports JWT tokens and API keys for authentication with collection-level RBAC authorization.

    ### JWT Authentication
    ```bash
    # Login to get JWT token
    curl -X POST http://localhost:11023/v1/auth/login \
      -H "Content-Type: application/json" \
      -d '{"username":"admin","password":"secret"}'

    # Use token in requests
    curl -H "Authorization: Bearer YOUR_TOKEN" http://localhost:11023/v1/stats
    ```

    ### API Key Authentication
    ```bash
    # Create API key (requires JWT first)
    curl -X POST http://localhost:11023/v1/auth/api-key \
      -H "Authorization: Bearer YOUR_JWT_TOKEN" \
      -H "Content-Type: application/json" \
      -d '{"description":"My API key"}'

    # Use API key in requests
    curl -H "X-API-Key: YOUR_API_KEY" http://localhost:11023/v1/stats
    ```

    See authentication endpoints below for user management, groups, and permissions.

  version: "2.12.0"
  contact:
    name: MDDB Team
    url: https://github.com/tradik/mddb
  license:
    name: BSD-3-Clause
    url: https://github.com/tradik/mddb/blob/main/LICENSE

servers:
  - url: http://localhost:11023
    description: Local development server
  - url: http://localhost:11023/v1
    description: Local development server (with version prefix)

tags:
  - name: Health
    description: Health check and monitoring endpoints
  - name: Authentication
    description: User authentication with JWT tokens and API keys
  - name: Users
    description: User management (admin only)
  - name: Groups
    description: Group management and permissions (admin only)
  - name: Embedding Config
    description: Embedding provider configuration management
  - name: Documents
    description: Document management operations
  - name: Search
    description: Search and query operations
  - name: Vector Search
    description: Semantic/vector search operations
  - name: Full-Text Search
    description: Keyword-based full-text search
  - name: Hybrid Search
    description: Combined sparse (FTS) + dense (vector) search with fusion strategies
  - name: Import
    description: Document import from URLs
  - name: TTL
    description: Document time-to-live management
  - name: Webhooks
    description: Webhook registration and management
  - name: Schema Validation
    description: JSON Schema validation for metadata
  - name: Export
    description: Export and backup operations
  - name: Maintenance
    description: Database maintenance operations
  - name: Telemetry
    description: Prometheus-compatible metrics endpoint
  - name: Replication
    description: Leader-follower replication status and monitoring
  - name: Synonyms
    description: FTS synonym dictionary management
  - name: Curation
    description: (v2.9.15+) Editorial overrides for FTS + Hybrid search — pin
      documents to fixed positions, hide others for specific queries
  - name: System
    description: System information and endpoint discovery
  - name: MCP
    description: Model Context Protocol 2025-11-25 — Streamable HTTP transport,
      tools, resources, prompts, completion, logging
  - name: Memory RAG
    description: Conversational memory system for RAG — session management, message
      storage, semantic/hybrid recall, summarization
  - name: Configuration
    description: Server and MCP configuration
  - name: GraphQL
    description: GraphQL API and interactive playground
  - name: Automation
    description: Triggers, crons, and webhook targets for automated workflows
  - name: Revisions
    description: Document revision history and restore operations
  - name: Collection Config
    description: Per-collection type, description, icon, color, and custom metadata
  - name: Cross-Collection Search
    description: Search across multiple collections using embeddings or text queries
  - name: Temporal Tracking
    description: Document event history, hot-docs leaderboard and activity
      histograms (requires MDDB_TEMPORAL=true)
  - name: Spell Correction
    description: SymSpell-based FTS spell suggestions, text cleanup, and
      per-collection custom dictionaries (requires MDDB_SPELL=true)

paths:
  /health:
    get:
      tags:
        - Health
      summary: Health check
      description: Simple health check endpoint that verifies database connectivity
      operationId: getHealth
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy
                  mode:
                    type: string
                    enum: [ read, write, wr ]
                    example: wr
                  persistence:
                    $ref: "#/components/schemas/PersistenceStatus"
                  durable:
                    type: boolean
                    description: >-
                      Whether an acknowledged write can be expected to survive a
                      restart of the process and its container (GO-032). False
                      means the data directory is read-only or ephemeral.
                    example: true
                  mcpSessions:
                    type: object
                    description: >-
                      Open MCP sessions per transport (GO-021). Absent when the
                      MCP server is disabled — an absent field says "not
                      running" where a zero would say "idle". A count that only
                      grows is how a session leak becomes visible.
                    properties:
                      sse:
                        type: integer
                        description: Sessions on the legacy MCP-over-SSE transport
                        example: 0
                      streamable:
                        type: integer
                        description: Sessions on the Streamable HTTP transport
                        example: 2
        "503":
          description: Service is unhealthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/health:
    get:
      tags:
        - Health
      summary: Health check (versioned)
      description: Alias for /health endpoint
      operationId: getHealthV1
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy
                  mode:
                    type: string
                    enum: [ read, write, wr ]
                    example: wr
                  persistence:
                    $ref: "#/components/schemas/PersistenceStatus"
                  durable:
                    type: boolean
                    description: >-
                      Whether an acknowledged write can be expected to survive a
                      restart of the process and its container (GO-032). False
                      means the data directory is read-only or ephemeral.
                    example: true
                  mcpSessions:
                    type: object
                    description: >-
                      Open MCP sessions per transport (GO-021). Absent when the
                      MCP server is disabled — an absent field says "not
                      running" where a zero would say "idle". A count that only
                      grows is how a session leak becomes visible.
                    properties:
                      sse:
                        type: integer
                        description: Sessions on the legacy MCP-over-SSE transport
                        example: 0
                      streamable:
                        type: integer
                        description: Sessions on the Streamable HTTP transport
                        example: 2
        "503":
          description: Service is unhealthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/stats:
    get:
      tags:
        - Health
      summary: Server statistics
      description: Get detailed server and database statistics
      operationId: getStats
      responses:
        "200":
          description: Statistics retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stats"

  /v1/add:
    post:
      tags:
        - Documents
      summary: Add or update document
      description: |
        Add a new document or update an existing one. If a document with the same collection, key, and language exists, it will be updated and a new revision will be created.
      operationId: addDocument
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddRequest"
      responses:
        "200":
          description: Document added/updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Read-only mode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/add-batch:
    post:
      tags:
        - Documents
      summary: Batch add documents
      description: |
        Add multiple documents to a collection in a single request. Uses the optimized batch processor for high throughput.
        Fires all post-commit hooks (embedding, FTS indexing, webhooks, TTL, automation triggers).
      operationId: addBatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddBatchRequest"
      responses:
        "200":
          description: Batch result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddBatchResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Read-only mode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/bulk-ingest-job:
    post:
      tags:
        - Documents
      summary: Submit async bulk ingest job
      description: |
        Queue a long-running bulk ingest job and return immediately with a
        job identifier. Clients should poll `/v1/bulk-ingest-job/{id}` for
        progress or supply `callbackUrl` to receive a `POST` with the final
        job record on completion.

        Jobs are processed by a single background worker in FIFO order.
        Payloads are kept in memory — if the server restarts mid-job, the
        status record is flipped to `failed` on the next start.
      operationId: submitBulkIngestJob
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkIngestSubmitRequest"
      responses:
        "202":
          description: Job accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkIngestJob"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/bulk-ingest-job/{id}:
    get:
      tags:
        - Documents
      summary: Get bulk ingest job status
      description: Returns the current status record — including counters, timestamps,
        and up to 50 error messages.
      operationId: getBulkIngestJob
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Job identifier returned from submit
      responses:
        "200":
          description: Job status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkIngestJob"
        "404":
          description: Job not found
    delete:
      tags:
        - Documents
      summary: Cancel pending bulk ingest job
      description: Only jobs in `pending` status can be cancelled. In-flight jobs must
        run to completion.
      operationId: cancelBulkIngestJob
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Job cancelled
        "400":
          description: Job already started or completed

  /v1/bulk-ingest-jobs:
    get:
      tags:
        - Documents
      summary: List bulk ingest jobs
      description: Returns all jobs newest-first, optionally filtered by collection.
      operationId: listBulkIngestJobs
      parameters:
        - name: collection
          in: query
          required: false
          schema:
            type: string
          description: Filter by collection name
      responses:
        "200":
          description: Job list
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobs:
                    type: array
                    items:
                      $ref: "#/components/schemas/BulkIngestJob"
                  total:
                    type: integer

  /v1/ingest:
    post:
      tags:
        - Documents
      summary: Bulk ingest documents
      description: |
        Advanced bulk ingest endpoint for scraping pipelines and data import workflows.
        Supports URL key derivation, YAML frontmatter extraction, content deduplication,
        auto-metadata injection, and collection auto-configuration.
      operationId: ingestDocuments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestRequest"
      responses:
        "200":
          description: Ingest result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Read-only mode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/upload:
    post:
      tags:
        - Documents
      summary: Upload files with auto-conversion to Markdown
      description: |
        Upload files via multipart/form-data. Files are auto-converted
        to Markdown and stored as documents. Supports single and batch upload.

        Supported formats: `.md`, `.txt`, `.html`, `.htm`, `.pdf`, `.docx`, `.odt`, `.rtf`, `.yaml`, `.yml`, `.log`, `.lex`, `.tex`, `.latex`.
        Default (md/txt) is stored as-is with frontmatter extraction; others are converted.
        ODT and DOCX are ZIP-based with XML extraction. RTF is parsed to plain text.
        LaTeX/TeX is converted (sections, formatting, environments). YAML/LOG/LEX are wrapped in code blocks.
      operationId: uploadFile
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - collection
                - lang
              properties:
                file:
                  type: string
                  format: binary
                  description: Single file to upload
                "files[]":
                  type: array
                  items:
                    type: string
                    format: binary
                  description: Multiple files to upload
                collection:
                  type: string
                  description: Target collection name
                lang:
                  type: string
                  description: Document language code (e.g. en_US)
                key:
                  type: string
                  description: Document key (derived from filename if empty)
                meta:
                  type: string
                  description: JSON-encoded metadata map
                ttl:
                  type: integer
                  description: Time-to-live in seconds
                maxSize:
                  type: integer
                  description: Per-file size limit in bytes (default 10MB, max 100MB)
      responses:
        "200":
          description: File(s) uploaded and stored
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/UploadResponse"
                  - $ref: "#/components/schemas/UploadBatchResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/get:
    post:
      tags:
        - Documents
      summary: Get document
      description: |
        Retrieve a document by collection, key, and language. Supports template variable substitution using the `env` parameter.
      operationId: getDocument
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GetRequest"
      responses:
        "200":
          description: Document retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Document not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/search:
    post:
      tags:
        - Search
      summary: Search documents
      description: |
        Search documents with metadata filtering, sorting, and pagination.

        **Filtering:** AND logic between different metadata keys, OR logic between values of the same key.

        **Sorting:** Sort by `addedAt`, `updatedAt`, or `key`.
      operationId: searchDocuments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
      responses:
        "200":
          description: Search results
          headers:
            X-Total-Count:
              description: Total number of matching documents (before pagination)
              schema:
                type: integer
                example: 234
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Document"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/delete:
    post:
      tags:
        - Documents
      summary: Delete document
      description: Delete a specific document by collection, key, and language
      operationId: deleteDocument
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteRequest"
      responses:
        "200":
          description: Document deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: boolean
                    example: true
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Read-only mode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/delete-batch:
    post:
      tags:
        - Documents
      summary: Batch delete documents
      description: Delete multiple documents in a single request
      operationId: deleteDocumentsBatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - collection
                - documents
              properties:
                collection:
                  type: string
                  description: Target collection
                  example: blog
                documents:
                  type: array
                  items:
                    type: object
                    properties:
                      key:
                        type: string
                      lang:
                        type: string
                  example:
                    - key: post-1
                      lang: en
                    - key: post-2
                      lang: en
      responses:
        "200":
          description: Batch delete result
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: integer
                    example: 2
                  not_found:
                    type: integer
                    example: 0
                  failed:
                    type: integer
                    example: 0
                  errors:
                    type: array
                    items:
                      type: string
                    nullable: true
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/delete-collection:
    post:
      tags:
        - Documents
      summary: Delete collection
      description: Delete all documents in a collection
      operationId: deleteCollection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteCollectionRequest"
      responses:
        "200":
          description: Collection deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: integer
                    description: Number of documents deleted
                    example: 42
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Read-only mode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/export:
    post:
      tags:
        - Export
      summary: Export documents
      description: |
        Export documents in NDJSON or ZIP format with optional metadata filtering.

        **NDJSON:** Newline-delimited JSON, one document per line.

        **ZIP:** Archive with markdown files named `{key}.{lang}.md`.
      operationId: exportDocuments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportRequest"
      responses:
        "200":
          description: Export file
          content:
            application/x-ndjson:
              schema:
                type: string
                format: binary
            application/zip:
              schema:
                type: string
                format: binary
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/backup:
    get:
      tags:
        - Export
      summary: Create backup
      description: Create a backup of the database file
      operationId: createBackup
      parameters:
        - name: to
          in: query
          required: true
          description: Destination path for backup file
          schema:
            type: string
            example: backup-20250109.db
      responses:
        "200":
          description: Backup created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  backup:
                    type: string
                    example: backup-20250109.db
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/restore:
    post:
      tags:
        - Export
      summary: Restore from backup
      description: Restore database from a backup file
      operationId: restoreBackup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - from
              properties:
                from:
                  type: string
                  description: Path to backup file
                  example: backup-20250109.db
      responses:
        "200":
          description: Database restored successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  restored:
                    type: string
                    example: backup-20250109.db
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Read-only mode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/truncate:
    post:
      tags:
        - Maintenance
      summary: Truncate revision history
      description: |
        Remove old revisions to save disk space. Keeps the latest N revisions per document.

        **Warning:** This operation is irreversible.
      operationId: truncateRevisions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TruncateRequest"
      responses:
        "200":
          description: Revisions truncated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: integer
                    description: Number of revisions deleted
                    example: 150
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Read-only mode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/vector-search:
    post:
      tags:
        - Vector Search
      summary: Semantic vector search
      description: |
        Search documents by semantic similarity using vector embeddings.

        Provide either a `query` string (which will be embedded automatically using the configured provider) or a raw `queryVector` array of floats.

        Results are ranked by cosine similarity score. Use `threshold` to filter out low-relevance results. Use `filterMeta` to narrow results by metadata before ranking.

        Use `algorithm` to select the search strategy: `flat` (exact), `hnsw` (fast approximate), `ivf` (clustered), or one of the quantized indexes `pq`/`opq`/`sq`/`sq4`/`bq` (compressed, smallest first). See [Search Algorithms](SEARCH.md) for details.
      operationId: vectorSearch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VectorSearchRequest"
      responses:
        "200":
          description: Vector search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VectorSearchResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Vector index is still loading
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/mcp/keys:
    post:
      tags:
        - MCP
      summary: Create MCP API key
      description: |
        Creates a named API key for MCP clients. The full key is returned
        **once, in this response only** — the listing exposes a fingerprint
        rather than key material, so it cannot be recovered afterwards.

        Requires admin authentication.
      operationId: createMCPKey
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  description: Label identifying what the key is for.
                  example: claude-desktop
                expiresAt:
                  type: integer
                  format: int64
                  description: Unix timestamp; omit or 0 for a key that never expires.
                  example: 0
      responses:
        "200":
          description: Key created (plaintext returned once)
          content:
            application/json:
              schema:
                type: object
                properties:
                  key:
                    type: string
                    description: The full key — store it now, it is not retrievable later.
                    example: mcp_4f3c2a1b8e7d6c5b4a39281706f5e4d3
                  name:
                    type: string
                    example: claude-desktop
                  createdAt:
                    type: integer
                    format: int64
                  expiresAt:
                    type: integer
                    format: int64
        "400":
          description: Invalid request body or key name
        "403":
          description: Admin permission required
        "503":
          description: MCP API key store not initialized
    get:
      tags:
        - MCP
      summary: List MCP API keys
      description: |
        Lists the registered MCP API keys. No key material is returned: each
        entry carries a `fingerprint` (four bytes of SHA-256, hex) that also
        identifies the key in the server log, while `keyPrefix` holds only the
        `mcp_` scheme marker.

        Requires admin authentication.
      operationId: listMCPKeys
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Key list
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys:
                    type: array
                    items:
                      $ref: "#/components/schemas/MCPAPIKeySummary"
                  total:
                    type: integer
                    example: 2
        "403":
          description: Admin permission required
        "503":
          description: MCP API key store not initialized
    delete:
      tags:
        - MCP
      summary: Delete MCP API key
      description: |
        Permanently removes a key, identified by its full value. The MCP auth
        cache is invalidated, so the key stops working immediately.

        Requires admin authentication.
      operationId: deleteMCPKey
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MCPAPIKeyRef"
      responses:
        "200":
          description: Key deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: deleted
        "400":
          description: Invalid request body
        "403":
          description: Admin permission required
        "404":
          description: No such key
        "503":
          description: MCP API key store not initialized

  /v1/mcp/keys/disable:
    post:
      tags:
        - MCP
      summary: Disable MCP API key
      description: |
        Marks a key disabled without deleting it, so it stops authenticating
        but stays visible in the listing.

        Requires admin authentication.
      operationId: disableMCPKey
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MCPAPIKeyRef"
      responses:
        "200":
          description: Key disabled
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: disabled
        "400":
          description: Invalid request body
        "403":
          description: Admin permission required
        "404":
          description: No such key
        "503":
          description: MCP API key store not initialized


  /v1/vector-projection:
    post:
      tags:
        - Vector Search
      summary: Project embeddings to 2D (PCA)
      description: |
        Server-side PCA projection of a collection's embedding vectors to 2D
        for visual exploration (cluster structure, outliers, query
        diagnostics). Large collections are sampled deterministically; a text
        query or raw vector can be projected alongside the points.
      operationId: vectorProjection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - collection
              properties:
                collection:
                  type: string
                  description: Collection to project
                  example: kb
                sample:
                  type: integer
                  description: Maximum points to project (default 1000, capped at 2000)
                  default: 1000
                  example: 1000
                query:
                  type: string
                  description: Optional text query to embed and overlay on the projection
                queryVector:
                  type: array
                  items:
                    type: number
                    format: float
                  description: Optional pre-computed query vector to overlay
      responses:
        "200":
          description: Projected points
          content:
            application/json:
              schema:
                type: object
                properties:
                  points:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, description: "Index key (docID or docID#N)" }
                        key: { type: string, description: Document key }
                        docId: { type: string }
                        chunkIndex: { type: integer }
                        x: { type: number }
                        y: { type: number }
                  query:
                    type: object
                    nullable: true
                    description: Projected query point (when query/queryVector provided)
                  total: { type: integer, description: Vectors in the collection }
                  sampled: { type: integer, description: Vectors actually projected }
                  dimensions: { type: integer }
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/vector-reindex:
    post:
      tags:
        - Vector Search
      summary: Reindex collection embeddings
      description: |
        Trigger re-embedding of all documents in a collection. This is a write-protected endpoint.

        Use `force: true` to re-embed all documents even if their content has not changed since the last embedding.
      operationId: vectorReindex
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VectorReindexRequest"
      responses:
        "200":
          description: Reindex completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VectorReindexResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Read-only mode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/vector-stats:
    get:
      tags:
        - Vector Search
      summary: Vector search statistics
      description: Get the current status of the vector search subsystem, including
        provider info, index readiness, and per-collection embedding counts.
      operationId: vectorStats
      responses:
        "200":
          description: Vector stats retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VectorStatsResponse"

  /v1/geo-search:
    post:
      tags:
        - Geo Search
      summary: Radius search (R-tree or geohash)
      description: |
        Find documents within `radiusMeters` of a (lat, lng) point. Documents
        must have `geo_lat`+`geo_lng`, `geo_hash`, or a resolvable
        `geo_postcode`+`geo_country` in their metadata. Results are sorted by
        ascending distance and composable with `filterMeta`.
      operationId: geoSearch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ collection, lat, lng, radiusMeters ]
              properties:
                collection: { type: string }
                lat: { type: number, format: double }
                lng: { type: number, format: double }
                radiusMeters: { type: number, format: double }
                topK: { type: integer, default: 10 }
                algorithm: { type: string, enum: [ rtree, geohash ], default: rtree }
                filterMeta:
                  {
                    type: object,
                    additionalProperties: { type: array, items: { type: string } },
                  }
                includeContent: { type: boolean, default: false }
      responses:
        "200": { description: OK }
        "400": { description: Invalid request }
        "503": { description: Index still loading }

  /v1/geo-within:
    post:
      tags:
        - Geo Search
      summary: Bounding-box search
      description: Find documents inside an axis-aligned bbox. Does not cross the
        anti-meridian.
      operationId: geoWithin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ collection, minLat, maxLat, minLng, maxLng ]
              properties:
                collection: { type: string }
                minLat: { type: number }
                maxLat: { type: number }
                minLng: { type: number }
                maxLng: { type: number }
                filterMeta:
                  {
                    type: object,
                    additionalProperties: { type: array, items: { type: string } },
                  }
                includeContent: { type: boolean }
      responses:
        "200": { description: OK }

  /v1/geo-polygon:
    post:
      tags:
        - Geo Search
      summary: Find documents inside a GeoJSON polygon or multi-polygon
      description: |
        Returns every indexed point whose coordinates fall inside the supplied
        GeoJSON Polygon (outer ring + optional holes) or MultiPolygon (union
        of polygons). Exactly one of `polygon` or `multiPolygon` must be set.

        The R-tree's bounding-box query prefilters candidates, so response
        time tracks the shape's bbox rather than the full collection size.
        GeoJSON coordinate order is `[lng, lat]` per RFC 7946. Rings may be
        open (first ≠ last) or closed (first == last); both forms work.

        Does not cross the anti-meridian — split the query into hemispheres
        if you need that.
      operationId: geoPolygon
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeoPolygonRequest"
      responses:
        "200":
          description: Matches (empty array if none)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeoPolygonResponse"
        "400":
          description: Invalid request — missing collection, both/neither shape supplied,
            or malformed geometry
        "503":
          description: Geo index still loading

  /v1/geo-reindex:
    post:
      tags:
        - Geo Search
      summary: Force-rebuild geo indexes
      description: Rebuild both R-tree and geohash indexes from the persisted `geo`
        bucket. Optionally load one or more postcode CSVs first.
      operationId: geoReindex
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                collection: { type: string, description: "Empty = rebuild all collections" }
                loadPostcodes:
                  type: array
                  items:
                    type: object
                    properties:
                      country: { type: string }
                      csvPath: { type: string }
      responses:
        "200": { description: OK }

  /v1/geo-stats:
    get:
      tags:
        - Geo Search
      summary: Geo index statistics
      operationId: geoStats
      responses:
        "200": { description: OK }

  /v1/geo-encode:
    post:
      tags:
        - Geo Search
      summary: Encode (lat, lng) → geohash string
      operationId: geoEncode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ lat, lng ]
              properties:
                lat: { type: number }
                lng: { type: number }
                precision: { type: integer, minimum: 1, maximum: 12, default: 12 }
      responses:
        "200": { description: OK }

  /v1/geo-decode:
    post:
      tags:
        - Geo Search
      summary: Decode geohash → centroid + bbox
      operationId: geoDecode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ geohash ]
              properties:
                geohash: { type: string }
      responses:
        "200": { description: OK }

  /v1/fts:
    post:
      tags:
        - Full-Text Search
      summary: Full-text search
      description: |
        Perform full-text search across documents in a collection. Supports 7 search modes with auto-detection and multi-language stemming (18 languages).

        **Search modes** (`mode` parameter, default `auto`):
        - `simple`: Classic keyword search scored by algorithm (TF-IDF, BM25, BM25F, PMISparse)
        - `boolean`: AND/OR/NOT operators, `+required`, `-excluded` terms
        - `phrase`: Exact word sequence matching using `"quoted phrases"`
        - `wildcard`: Pattern matching with `*` (any chars) and `?` (single char)
        - `proximity`: Terms within N words — `"term1 term2"~5`
        - `auto` (default): Auto-detects mode from query syntax (quotes → phrase, operators → boolean, etc.)

        **Algorithms** (for simple/boolean modes):
        - `tfidf` (default): Classic TF-IDF scoring
        - `bm25`: Okapi BM25 with document length normalization (k1=1.2, b=0.75)
        - `bm25f`: BM25F field-weighted scoring — applies different weights to title, metadata, and content fields
        - `pmisparse`: PMISparse — BM25 + PMI query expansion

        **Range filtering:** Use `rangeMeta` to filter by numeric, date, or string ranges on metadata fields.

        **In-graph filtering:** Use `filterMeta` to narrow results by metadata before scoring, same as vector search.
      operationId: fullTextSearch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FTSSearchRequest"
      responses:
        "200":
          description: Full-text search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FTSSearchResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/fts-reindex:
    post:
      tags:
        - Full-Text Search
      summary: Reindex FTS for a collection
      description: |
        Re-indexes all documents in a collection using their stored `lang` field for language-aware stemming and stop words.
        Use this after enabling multi-language support to update existing documents indexed with the default English pipeline.
      operationId: ftsReindex
      parameters:
        - name: collection
          in: query
          required: true
          schema:
            type: string
          description: Collection name to reindex
      responses:
        "200":
          description: Reindex completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  reindexed:
                    type: integer
                    description: Number of documents reindexed
                  collection:
                    type: string
        "400":
          description: Missing collection parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/autocomplete:
    get:
      tags:
        - Full-Text Search
      summary: Prefix autocomplete
      description: |
        Return up to `topN` terms starting with the given query, ranked by
        document frequency. Uses the existing FTS inverted index — no
        additional indexing is required.

        When `field` is supplied, the BM25F field-scoped index drives the
        scan so callers can autocomplete titles, tags, or body content
        independently. A single call scans at most 10000 index entries to
        keep latency bounded on pathological prefixes like "a".
      operationId: autocomplete
      parameters:
        - name: collection
          in: query
          required: true
          schema:
            type: string
          description: Collection name
        - name: q
          in: query
          required: true
          schema:
            type: string
          description: Prefix query — lowercased and stripped of non-alphanumerics
          example: mar
        - name: field
          in: query
          required: false
          schema:
            type: string
          description: Optional field scope (e.g. `title`, `content`, `meta.tags`); empty
            means global
        - name: topN
          in: query
          required: false
          schema:
            type: integer
            default: 10
          description: Maximum number of suggestions returned
      responses:
        "200":
          description: Suggestions
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        term:
                          type: string
                          example: market
                        field:
                          type: string
                          example: title
                        docCount:
                          type: integer
                          example: 42
                  total:
                    type: integer
                  query:
                    type: string
                  field:
                    type: string

  /v1/fts-languages:
    get:
      tags:
        - Full-Text Search
      summary: List supported FTS languages
      description: Returns all supported languages for multi-language FTS with their
        codes, names, and the configured default language.
      operationId: ftsLanguages
      responses:
        "200":
          description: Supported languages
          content:
            application/json:
              schema:
                type: object
                properties:
                  languages:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          example: en
                        name:
                          type: string
                          example: English
                  defaultLang:
                    type: string
                    example: en

  /v1/hybrid-search:
    post:
      tags:
        - Hybrid Search
      summary: Hybrid sparse+dense search
      description: |
        Combine FTS (keyword) and vector (semantic) search into a single query. Returns results ranked by a fused score.

        **Fusion strategies:**
        - `alpha` (default): Weighted alpha blending — `combined = (1-alpha) * normalizedFTS + alpha * vectorScore`. Alpha=0 is pure keyword, alpha=1 is pure semantic.
        - `rrf`: Reciprocal Rank Fusion — `score = 1/(k + rank_fts) + 1/(k + rank_vector)`. Rank-based, no alpha needed.

        **FTS algorithms:** `bm25` (default), `bm25f` (field-weighted).

        **Vector algorithms:** `flat` (default), `hnsw`, `ivf`, `pq`, `opq`, `sq`, `sq4`, `bq`.

        Use `filterMeta` to pre-filter by metadata before both FTS and vector scoring.
      operationId: hybridSearch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HybridSearchRequest"
      responses:
        "200":
          description: Hybrid search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HybridSearchResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/import-url:
    post:
      tags:
        - Import
      summary: Import document from URL
      description: |
        Fetch content from a URL, parse YAML frontmatter if present, merge metadata, and store the document. This is a write-protected endpoint.

        If `key` is not provided, it is derived from the URL path. YAML frontmatter metadata from the fetched content is merged with the `meta` parameter.
      operationId: importUrl
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportURLRequest"
      responses:
        "200":
          description: Document imported successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Read-only mode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/import-wiki:
    post:
      tags:
        - Import
      summary: Import Wikipedia XML dump
      description: |
        Stream and import MediaWiki XML dumps (`.xml` or `.xml.bz2`) into a collection.
        Automatically converts wikitext to Markdown. Streams the XML — does not load the entire file into memory.
        Supports namespace filtering, redirect skipping, and batch processing with progress logging.
      operationId: importWiki
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
                - collection
                - lang
              properties:
                file:
                  type: string
                  format: binary
                  description: Wikipedia XML dump file (.xml or .xml.bz2)
                collection:
                  type: string
                  description: Target collection name
                lang:
                  type: string
                  description: Language code (e.g. en, de, pl)
                namespaces:
                  type: string
                  description: "Comma-separated namespace IDs (default: 0 = articles only)"
                skipRedirects:
                  type: string
                  enum: [ "true", "false" ]
                  description: Skip redirect pages
                skipFts:
                  type: string
                  enum: [ "true", "false" ]
                  description: Skip FTS indexing for faster bulk import
                maxPages:
                  type: string
                  description: Maximum number of pages to import
                batchSize:
                  type: string
                  description: "Pages per batch commit (default: 500)"
          application/octet-stream:
            schema:
              type: string
              format: binary
          application/x-bzip2:
            schema:
              type: string
              format: binary
      parameters:
        - name: collection
          in: query
          schema:
            type: string
          description: Target collection (for octet-stream/bzip2 uploads)
        - name: lang
          in: query
          schema:
            type: string
          description: Language code (for octet-stream/bzip2 uploads)
        - name: namespaces
          in: query
          schema:
            type: string
          description: "Comma-separated namespace IDs (default: 0)"
        - name: skipRedirects
          in: query
          schema:
            type: string
        - name: skipFts
          in: query
          schema:
            type: string
        - name: maxPages
          in: query
          schema:
            type: integer
        - name: batchSize
          in: query
          schema:
            type: integer
        - name: filename
          in: query
          schema:
            type: string
          description: Filename hint for compression detection (e.g. dump.xml.bz2)
      responses:
        "200":
          description: Import completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WikiImportResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Read-only mode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/set-ttl:
    post:
      tags:
        - TTL
      summary: Set document TTL
      description: |
        Set a time-to-live (TTL) on a document. After the TTL expires, the document will be automatically deleted. This is a write-protected endpoint.

        Set `ttl` to `0` to remove the TTL and make the document permanent again.
      operationId: setTTL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetTTLRequest"
      responses:
        "200":
          description: TTL set successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Read-only mode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/webhooks:
    get:
      tags:
        - Webhooks
      summary: List webhooks
      description: List all registered webhooks.
      operationId: listWebhooks
      responses:
