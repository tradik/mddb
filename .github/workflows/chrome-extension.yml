name: Chrome Extension (mddb-browser)

on:
  push:
    branches: [main]
    paths:
      - 'integrations/chrome-extension/**'
      - '.github/workflows/chrome-extension.yml'
    tags:
      - 'chrome-ext-v*'
  pull_request:
    branches: [main, develop]
    paths:
      - 'integrations/chrome-extension/**'
      - '.github/workflows/chrome-extension.yml'
  workflow_dispatch:

env:
  WORKING_DIR: integrations/chrome-extension
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  test:
    name: Tests + build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24', '26']
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: ${{ env.WORKING_DIR }}/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Jest with coverage (90% threshold)
        run: npm run test:coverage

      - name: Bundle into ./build
        run: npm run build

      - name: Package into dist/*.zip
        run: npm run package

      - name: Upload coverage artifact
        if: matrix.node-version == '24'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: chrome-ext-coverage
          path: ${{ env.WORKING_DIR }}/coverage
          retention-days: 14

      - name: Upload extension zip
        if: matrix.node-version == '24'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: chrome-ext-zip
          path: ${{ env.WORKING_DIR }}/dist/*.zip
          retention-days: 30

  security:
    name: Security audit (npm audit, production deps)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ${{ env.WORKING_DIR }}/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: npm audit (production, high+)
        run: npm run audit

  smoke:
    name: Smoke (validate packaged zip)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Download extension zip
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: chrome-ext-zip
          path: artifact

      - name: Inspect packaged extension
        run: |
          set -euo pipefail
          ls -la artifact/
          ZIP="$(ls artifact/*.zip | head -1)"
          echo "Validating $ZIP"
          unzip -l "$ZIP"
          unzip -p "$ZIP" manifest.json > manifest.json
          node -e "
            const m = JSON.parse(require('fs').readFileSync('manifest.json','utf8'));
            if (m.manifest_version !== 3) { console.error('manifest_version must be 3'); process.exit(1); }
            if (!m.background?.service_worker) { console.error('missing background.service_worker'); process.exit(1); }
            if (!m.action?.default_popup)       { console.error('missing action.default_popup'); process.exit(1); }
            if (!m.options_ui?.page)            { console.error('missing options_ui.page'); process.exit(1); }
            for (const p of ['storage','alarms']) {
              if (!m.permissions?.includes(p)) { console.error('missing permission: '+p); process.exit(1); }
            }
            console.log('manifest OK — version', m.version);
          "

  release:
    name: Cut release for tag
    runs-on: ubuntu-latest
    needs: [test, security, smoke]
    if: startsWith(github.ref, 'refs/tags/chrome-ext-v')
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Derive version from tag
        id: version
        run: |
          TAG="${GITHUB_REF##*/}"
          VERSION="${TAG#chrome-ext-v}"
          MAJOR="${VERSION%%.*}"
          MINOR_RAW="${VERSION#*.}"
          MINOR="${MINOR_RAW%%.*}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "major=chrome-ext-v${MAJOR}" >> "$GITHUB_OUTPUT"
          echo "minor=chrome-ext-v${MAJOR}.${MINOR}" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ${{ env.WORKING_DIR }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.WORKING_DIR }}
        run: npm ci --ignore-scripts

      - name: Verify package.json and manifest versions match tag
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          MANIFEST_VERSION="$(node -p "require('./public/manifest.json').version")"
          echo "package.json version:  $PKG_VERSION"
          echo "manifest.json version: $MANIFEST_VERSION"
          echo "Tag version:           ${{ steps.version.outputs.version }}"
          if [ "$PKG_VERSION" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match git tag (${{ steps.version.outputs.version }})"
            exit 1
          fi
          if [ "$MANIFEST_VERSION" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::manifest.json version ($MANIFEST_VERSION) does not match git tag (${{ steps.version.outputs.version }})"
            exit 1
          fi

      - name: Build and package
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          npm run build
          npm run package

      - name: Move floating major/minor tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -f "${{ steps.version.outputs.major }}" "${{ steps.version.outputs.tag }}"
          git tag -f "${{ steps.version.outputs.minor }}" "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.major }}" --force
          git push origin "${{ steps.version.outputs.minor }}" --force

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: 'MDDB Browser Extension ${{ steps.version.outputs.version }}'
          body: |
            Chrome (Manifest V3) extension release built from `${{ github.sha }}`.

            **Install:** download `mddb-browser-${{ steps.version.outputs.version }}.zip`, unzip, and
            `Load unpacked` it in `chrome://extensions` with developer mode enabled.

            See [integrations/chrome-extension/CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ steps.version.outputs.tag }}/integrations/chrome-extension/CHANGELOG.md)
            for the full changelog.
          files: |
            ${{ env.WORKING_DIR }}/dist/mddb-browser-${{ steps.version.outputs.version }}.zip
          generate_release_notes: false
