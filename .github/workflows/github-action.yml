name: GitHub Action (mddb-sync)

on:
  push:
    branches: [main]
    paths:
      - 'integrations/github-action/**'
      - '.github/workflows/github-action.yml'
    tags:
      - 'gha-v*'
  pull_request:
    branches: [main, develop]
    paths:
      - 'integrations/github-action/**'
      - '.github/workflows/github-action.yml'
  workflow_dispatch:

env:
  WORKING_DIR: integrations/github-action
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  test:
    name: Tests + build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24', '26']
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: ${{ env.WORKING_DIR }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Jest with coverage (90% threshold)
        run: npm run test:coverage

      - name: Bundle dist/
        run: npm run build

      - name: Upload coverage artifact
        if: matrix.node-version == '24'
        uses: actions/upload-artifact@v7
        with:
          name: gha-coverage
          path: ${{ env.WORKING_DIR }}/coverage
          retention-days: 14

  verify-dist:
    name: Verify committed dist/ is up to date
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ${{ env.WORKING_DIR }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Rebuild dist/
        run: npm run build

      - name: Assert no uncommitted changes in dist/
        run: |
          if ! git diff --exit-code -- dist/; then
            echo "::error::Committed dist/ is out of date. Run 'make gha-build' and commit the result."
            git --no-pager diff --stat dist/
            exit 1
          fi

  smoke:
    name: Smoke test (dry-run against own README)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Sync README.md (dry-run)
        uses: ./integrations/github-action
        with:
          mddb-url: https://mddb.tradik.com
          collection: gha-smoke-test
          path: integrations/github-action/README.md
          dry-run: 'true'

  release:
    name: Cut release for tag
    runs-on: ubuntu-latest
    needs: [test, verify-dist, smoke]
    if: startsWith(github.ref, 'refs/tags/gha-v')
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Derive version from tag
        id: version
        run: |
          TAG="${GITHUB_REF##*/}"
          VERSION="${TAG#gha-v}"
          MAJOR="${VERSION%%.*}"
          MINOR_RAW="${VERSION#*.}"
          MINOR="${MINOR_RAW%%.*}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "major=gha-v${MAJOR}" >> "$GITHUB_OUTPUT"
          echo "minor=gha-v${MAJOR}.${MINOR}" >> "$GITHUB_OUTPUT"

      - name: Verify package.json version matches tag
        run: |
          PKG_VERSION="$(node -p "require('./integrations/github-action/package.json').version")"
          echo "package.json version: $PKG_VERSION"
          echo "Tag version:          ${{ steps.version.outputs.version }}"
          if [ "$PKG_VERSION" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match git tag (${{ steps.version.outputs.version }})"
            exit 1
          fi

      - name: Move floating major/minor tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -f "${{ steps.version.outputs.major }}" "${{ steps.version.outputs.tag }}"
          git tag -f "${{ steps.version.outputs.minor }}" "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.major }}" --force
          git push origin "${{ steps.version.outputs.minor }}" --force

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "MDDB Sync Action ${{ steps.version.outputs.version }}"
          body: |
            GitHub Action release built from `${{ github.sha }}`.

            Consumers can pin to:
            - `tradik/mddb/integrations/github-action@${{ steps.version.outputs.tag }}` (exact)
            - `tradik/mddb/integrations/github-action@${{ steps.version.outputs.minor }}` (minor floating)
            - `tradik/mddb/integrations/github-action@${{ steps.version.outputs.major }}` (major floating)

            See [integrations/github-action/CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ steps.version.outputs.tag }}/integrations/github-action/CHANGELOG.md) for details.
          generate_release_notes: false
