name: Grafana Datasource (mddb-datasource)

on:
  push:
    branches: [main]
    paths:
      - 'integrations/grafana-datasource/**'
      - '.github/workflows/grafana-datasource.yml'
    tags:
      - 'grafana-ds-v*'
  pull_request:
    branches: [main, develop]
    paths:
      - 'integrations/grafana-datasource/**'
      - '.github/workflows/grafana-datasource.yml'
  workflow_dispatch:

env:
  WORKING_DIR: integrations/grafana-datasource
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  test:
    name: Tests + build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['24', '26']
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: ${{ env.WORKING_DIR }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Jest with coverage (90% threshold)
        run: npm run test:coverage

      - name: Build plugin (webpack)
        run: npm run build

      - name: Package into dist zip
        if: matrix.node-version == '24'
        run: npm run package

      - name: Upload coverage artifact
        if: matrix.node-version == '24'
        uses: actions/upload-artifact@v7
        with:
          name: grafana-ds-coverage
          path: ${{ env.WORKING_DIR }}/coverage
          retention-days: 14

      - name: Upload plugin zip
        if: matrix.node-version == '24'
        uses: actions/upload-artifact@v7
        with:
          name: grafana-ds-zip
          path: ${{ env.WORKING_DIR }}/tradik-mddb-datasource-*.zip
          retention-days: 30

  security:
    name: Security audit (npm audit, production deps)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ${{ env.WORKING_DIR }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: npm audit (production, high+)
        run: npm audit --omit=dev --audit-level=high

  smoke:
    name: Smoke (validate packaged plugin)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Download plugin zip
        uses: actions/download-artifact@v8
        with:
          name: grafana-ds-zip
          path: artifact

      - name: Inspect packaged plugin.json
        run: |
          set -euo pipefail
          ls -la artifact/
          ZIP="$(ls artifact/*.zip | head -1)"
          echo "Validating $ZIP"
          unzip -l "$ZIP"
          unzip -p "$ZIP" plugin.json > plugin.json
          node -e "
            const p = JSON.parse(require('fs').readFileSync('plugin.json','utf8'));
            if (p.type !== 'datasource')        { console.error('type must be datasource'); process.exit(1); }
            if (p.id !== 'tradik-mddb-datasource') { console.error('unexpected id: '+p.id); process.exit(1); }
            if (!p.info?.version)               { console.error('missing info.version'); process.exit(1); }
            console.log('plugin.json OK — version', p.info.version);
          "

  release:
    name: Cut release for tag
    runs-on: ubuntu-latest
    needs: [test, security, smoke]
    if: startsWith(github.ref, 'refs/tags/grafana-ds-v')
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Derive version from tag
        id: version
        run: |
          TAG="${GITHUB_REF##*/}"
          VERSION="${TAG#grafana-ds-v}"
          MAJOR="${VERSION%%.*}"
          MINOR_RAW="${VERSION#*.}"
          MINOR="${MINOR_RAW%%.*}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "major=grafana-ds-v${MAJOR}" >> "$GITHUB_OUTPUT"
          echo "minor=grafana-ds-v${MAJOR}.${MINOR}" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ${{ env.WORKING_DIR }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.WORKING_DIR }}
        run: npm ci

      - name: Verify package.json and plugin.json versions match tag
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          PLUGIN_VERSION="$(node -p "require('./src/plugin.json').info.version")"
          echo "package.json version:        $PKG_VERSION"
          echo "src/plugin.json info.version: $PLUGIN_VERSION"
          echo "Tag version:                  ${{ steps.version.outputs.version }}"
          if [ "$PKG_VERSION" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match git tag (${{ steps.version.outputs.version }})"
            exit 1
          fi
          if [ "$PLUGIN_VERSION" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::src/plugin.json info.version ($PLUGIN_VERSION) does not match git tag (${{ steps.version.outputs.version }})"
            exit 1
          fi

      - name: Build and package
        working-directory: ${{ env.WORKING_DIR }}
        run: npm run package

      - name: Move floating major/minor tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -f "${{ steps.version.outputs.major }}" "${{ steps.version.outputs.tag }}"
          git tag -f "${{ steps.version.outputs.minor }}" "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.major }}" --force
          git push origin "${{ steps.version.outputs.minor }}" --force

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: 'MDDB Grafana Datasource ${{ steps.version.outputs.version }}'
          body: |
            Grafana datasource plugin (`tradik-mddb-datasource`) built from `${{ github.sha }}`.

            **Install:** download `tradik-mddb-datasource-${{ steps.version.outputs.version }}.zip`,
            unzip into your Grafana `plugins/` directory (the plugin is unsigned — allow it via
            `GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS=tradik-mddb-datasource`), and restart Grafana.

            See [integrations/grafana-datasource/CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ steps.version.outputs.tag }}/integrations/grafana-datasource/CHANGELOG.md)
            for the full changelog.
          files: |
            ${{ env.WORKING_DIR }}/tradik-mddb-datasource-${{ steps.version.outputs.version }}.zip
          generate_release_notes: false
