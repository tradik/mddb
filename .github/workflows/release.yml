name: Release

# OPS-009: least-privilege default — individual jobs elevate to
# contents: write / packages: write / id-token: write where they publish.
permissions:
  contents: read

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v2.0.0)'
        required: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  GO_VERSION: '1.27.0'
  DOCKER_HUB_USERNAME: tradik
  IMAGE_NAME: mddb
  GHCR_REGISTRY: ghcr.io
  # Disable Go workspace mode in CI so each module builds independently.
  # go.work is for local development only — see go.work and README.md.
  GOWORK: "off"

jobs:
  # TEST-003: nothing ships until the new build proves it can still open a
  # database written by an older release.
  #
  # This runs before every build job rather than alongside them: the worst
  # failure a database can hand a user is a file the new version refuses to
  # open, with the old binary already replaced. Every other test writes and
  # reads with the same code, which proves the format is self-consistent —
  # exactly the property that stays true while compatibility breaks.
  upgrade-compat:
    name: Upgrade Compatibility Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: services/mddbd/go.sum

      - name: Open databases written by older releases
        working-directory: services/mddbd
        env:
          GOWORK: "off"
        run: go test -run 'TestOpensFixturesFromOlderReleases|TestFixtureContentIsUnchanged' -v ./

  build-server:
    name: Build MDDB Server
    needs: upgrade-compat
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # Linux AMD64
          - goos: linux
            goarch: amd64
            platform: linux-amd64
            package_formats: deb,rpm
          # Linux ARM64
          - goos: linux
            goarch: arm64
            platform: linux-arm64
            package_formats: deb,rpm
          # FreeBSD AMD64
          - goos: freebsd
            goarch: amd64
            platform: freebsd-amd64
            package_formats: tar.gz
          # macOS AMD64 (Intel)
          - goos: darwin
            goarch: amd64
            platform: darwin-amd64
            package_formats: tar.gz
          # macOS ARM64 (Apple Silicon)
          - goos: darwin
            goarch: arm64
            platform: darwin-arm64
            package_formats: tar.gz

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: services/mddbd/go.sum

      - name: Install dependencies
        working-directory: services/mddbd
        run: |
          go mod download
          go mod verify
          go mod tidy

      - name: Verify proto files
        working-directory: services/mddbd
        run: |
          if [ ! -f proto/mddb.pb.go ]; then
            echo "Error: proto files not found. Please commit generated proto files."
            exit 1
          fi

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Build server binary
        working-directory: services/mddbd
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          go build -ldflags="-s -w -X main.Version=${VERSION}" -o mddbd-${{ matrix.platform }} .

      - name: Create tarball
        working-directory: services/mddbd
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          mkdir -p dist/mddbd-${VERSION}-${{ matrix.platform }}
          cp mddbd-${{ matrix.platform }} dist/mddbd-${VERSION}-${{ matrix.platform }}/mddbd
          cp ../../README.md dist/mddbd-${VERSION}-${{ matrix.platform }}/
          cp ../../LICENSE dist/mddbd-${VERSION}-${{ matrix.platform }}/ || true
          cd dist
          tar czf mddbd-${VERSION}-${{ matrix.platform }}.tar.gz mddbd-${VERSION}-${{ matrix.platform }}

      - name: Install packaging tools
        if: matrix.package_formats == 'deb,rpm'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Create DEB package
        if: contains(matrix.package_formats, 'deb')
        working-directory: services/mddbd
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          VERSION_NUM=${VERSION#v}
          
          # Create package structure
          mkdir -p dist/deb/mddbd-${VERSION_NUM}/DEBIAN
          mkdir -p dist/deb/mddbd-${VERSION_NUM}/usr/bin
          mkdir -p dist/deb/mddbd-${VERSION_NUM}/usr/share/doc/mddbd
          mkdir -p dist/deb/mddbd-${VERSION_NUM}/etc/systemd/system
          
          # Copy binary
          cp mddbd-${{ matrix.platform }} dist/deb/mddbd-${VERSION_NUM}/usr/bin/mddbd
          chmod +x dist/deb/mddbd-${VERSION_NUM}/usr/bin/mddbd
          
          # Copy docs
          cp ../../README.md dist/deb/mddbd-${VERSION_NUM}/usr/share/doc/mddbd/
          cp ../../CHANGELOG.md dist/deb/mddbd-${VERSION_NUM}/usr/share/doc/mddbd/ || true
          
          # Create systemd service
          cat > dist/deb/mddbd-${VERSION_NUM}/etc/systemd/system/mddbd.service << 'EOF'
          [Unit]
          Description=MDDB - Markdown Database Server
          After=network.target

          [Service]
          Type=simple
          User=mddbd
          Group=mddbd
          ExecStart=/usr/bin/mddbd
          Restart=on-failure
          RestartSec=5s
          Environment="MDDB_PATH=/var/lib/mddbd/mddb.db"
          Environment="MDDB_MODE=wr"
          Environment="MDDB_EXTREME=true"

          [Install]
          WantedBy=multi-user.target
          EOF
          
          # Create control file
          cat > dist/deb/mddbd-${VERSION_NUM}/DEBIAN/control << EOF
          Package: mddbd
          Version: ${VERSION_NUM}
          Section: database
          Priority: optional
          Architecture: ${{ matrix.goarch }}
          Maintainer: MDDB Team <team@mddb.io>
          Description: High-performance markdown database server
           MDDB is a specialized database server for storing and managing
           markdown documents with rich metadata, full revision history,
           and dual protocol support (HTTP/JSON + gRPC/Protobuf).
           .
           Full-text, vector and hybrid search, with an MCP server built in.
          Homepage: https://github.com/tradik/mddb
          EOF
          
          # Create postinst script
          cat > dist/deb/mddbd-${VERSION_NUM}/DEBIAN/postinst << 'EOF'
          #!/bin/bash
          set -e
          
          # Create user and group
          if ! getent group mddbd >/dev/null; then
              groupadd --system mddbd
          fi
          
          if ! getent passwd mddbd >/dev/null; then
              useradd --system --gid mddbd --home-dir /var/lib/mddbd --shell /bin/false mddbd
          fi
          
          # Create data directory
          mkdir -p /var/lib/mddbd
          chown mddbd:mddbd /var/lib/mddbd
          chmod 750 /var/lib/mddbd
          
          # Reload systemd
          systemctl daemon-reload || true
          
          echo "MDDB server installed successfully!"
          echo "Start with: sudo systemctl start mddbd"
          echo "Enable on boot: sudo systemctl enable mddbd"
          EOF
          
          chmod +x dist/deb/mddbd-${VERSION_NUM}/DEBIAN/postinst
          
          # Build package
          dpkg-deb --build dist/deb/mddbd-${VERSION_NUM}
          mv dist/deb/mddbd-${VERSION_NUM}.deb dist/mddbd-${VERSION_NUM}-${{ matrix.platform }}.deb

      - name: Create RPM package
        if: contains(matrix.package_formats, 'rpm')
        working-directory: services/mddbd
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          VERSION_NUM=${VERSION#v}
          
          # Create RPM build structure
          mkdir -p dist/rpm/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          
          # Create spec file
          cat > dist/rpm/SPECS/mddbd.spec << EOF
          Name:           mddbd
          Version:        ${VERSION_NUM}
          Release:        1%{?dist}
          Summary:        High-performance markdown database server
          License:        BSD-3-Clause
          URL:            https://github.com/tradik/mddb
          Source0:        mddbd-${VERSION_NUM}.tar.gz

          %description
          MDDB is a specialized database server for storing and managing
          markdown documents with rich metadata, full revision history,
          and dual protocol support (HTTP/JSON + gRPC/Protobuf).
          
          Full-text, vector and hybrid search, with an MCP server built in.

          %prep
          %setup -q

          %install
          mkdir -p %{buildroot}/usr/bin
          mkdir -p %{buildroot}/etc/systemd/system
          mkdir -p %{buildroot}/usr/share/doc/mddbd
          
          install -m 755 mddbd %{buildroot}/usr/bin/mddbd
          install -m 644 README.md %{buildroot}/usr/share/doc/mddbd/
          
          cat > %{buildroot}/etc/systemd/system/mddbd.service << 'SERVICEEOF'
          [Unit]
          Description=MDDB - Markdown Database Server
          After=network.target

          [Service]
          Type=simple
          User=mddbd
          Group=mddbd
          ExecStart=/usr/bin/mddbd
          Restart=on-failure
          RestartSec=5s
          Environment="MDDB_PATH=/var/lib/mddbd/mddb.db"
          Environment="MDDB_MODE=wr"
          Environment="MDDB_EXTREME=true"

          [Install]
          WantedBy=multi-user.target
          SERVICEEOF

          %files
          /usr/bin/mddbd
          /etc/systemd/system/mddbd.service
          /usr/share/doc/mddbd/README.md

          %post
          getent group mddbd >/dev/null || groupadd -r mddbd
          getent passwd mddbd >/dev/null || useradd -r -g mddbd -d /var/lib/mddbd -s /sbin/nologin mddbd
          mkdir -p /var/lib/mddbd
          chown mddbd:mddbd /var/lib/mddbd
          chmod 750 /var/lib/mddbd
          systemctl daemon-reload || true

          %changelog
          * $(date "+%a %b %d %Y") MDDB Team <team@mddb.io> - ${VERSION_NUM}-1
          - Release ${VERSION_NUM}
          EOF
          
          # Create source tarball
          mkdir -p mddbd-${VERSION_NUM}
          cp mddbd-${{ matrix.platform }} mddbd-${VERSION_NUM}/mddbd
          cp ../../README.md mddbd-${VERSION_NUM}/
          tar czf dist/rpm/SOURCES/mddbd-${VERSION_NUM}.tar.gz mddbd-${VERSION_NUM}
          
          # Build RPM
          rpmbuild --define "_topdir $(pwd)/dist/rpm" -bb dist/rpm/SPECS/mddbd.spec
          
          # Copy RPM to dist
          find dist/rpm/RPMS -name "*.rpm" -exec cp {} dist/mddbd-${VERSION_NUM}-${{ matrix.platform }}.rpm \;

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: mddbd-${{ matrix.platform }}
          path: |
            services/mddbd/dist/*.tar.gz
            services/mddbd/dist/*.deb
            services/mddbd/dist/*.rpm

      - name: Upload binary for Docker
        if: matrix.goos == 'linux'
        uses: actions/upload-artifact@v7
        with:
          name: mddbd-binary-${{ matrix.platform }}
          path: services/mddbd/mddbd-${{ matrix.platform }}

  build-client:
    name: Build MDDB CLI Client
    needs: upgrade-compat
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # Linux AMD64
          - goos: linux
            goarch: amd64
            platform: linux-amd64
            package_formats: deb,rpm
          # Linux ARM64
          - goos: linux
            goarch: arm64
            platform: linux-arm64
            package_formats: deb,rpm
          # FreeBSD AMD64
          - goos: freebsd
            goarch: amd64
            platform: freebsd-amd64
            package_formats: tar.gz
          # macOS AMD64 (Intel)
          - goos: darwin
            goarch: amd64
            platform: darwin-amd64
            package_formats: tar.gz
          # macOS ARM64 (Apple Silicon)
          - goos: darwin
            goarch: arm64
            platform: darwin-arm64
            package_formats: tar.gz

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: services/mddb-cli/go.sum

      - name: Install dependencies
        working-directory: services/mddb-cli
        run: |
          # go mod verify is intentionally skipped here: mddb-cli pins the shared
          # client via a local `replace mddb-client => ../../clients/go/mddb`,
          # which has no module-cache ziphash, so verify fails with
          # "missing ziphash". CI (test.yml) builds mddb-cli without verify for
          # the same reason.
          go mod download

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Build client binary
        working-directory: services/mddb-cli
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          go build -ldflags="-s -w -X main.Version=${VERSION}" -o mddb-cli-${{ matrix.platform }} .

      - name: Create tarball
        working-directory: services/mddb-cli
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          mkdir -p dist/mddb-cli-${VERSION}-${{ matrix.platform }}
          cp mddb-cli-${{ matrix.platform }} dist/mddb-cli-${VERSION}-${{ matrix.platform }}/mddb-cli
          cp ../../README.md dist/mddb-cli-${VERSION}-${{ matrix.platform }}/
          cp ../../LICENSE dist/mddb-cli-${VERSION}-${{ matrix.platform }}/ || true
          
          # Add man page if exists
          if [ -f mddb-cli.1 ]; then
            cp mddb-cli.1 dist/mddb-cli-${VERSION}-${{ matrix.platform }}/
          fi
          
          cd dist
          tar czf mddb-cli-${VERSION}-${{ matrix.platform }}.tar.gz mddb-cli-${VERSION}-${{ matrix.platform }}

      - name: Install packaging tools
        if: matrix.package_formats == 'deb,rpm'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Create DEB package
        if: contains(matrix.package_formats, 'deb')
        working-directory: services/mddb-cli
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          VERSION_NUM=${VERSION#v}
          
          # Create package structure
          mkdir -p dist/deb/mddb-cli-${VERSION_NUM}/DEBIAN
          mkdir -p dist/deb/mddb-cli-${VERSION_NUM}/usr/bin
          mkdir -p dist/deb/mddb-cli-${VERSION_NUM}/usr/share/doc/mddb-cli
          mkdir -p dist/deb/mddb-cli-${VERSION_NUM}/usr/share/man/man1
          
          # Copy binary
          cp mddb-cli-${{ matrix.platform }} dist/deb/mddb-cli-${VERSION_NUM}/usr/bin/mddb-cli
          chmod +x dist/deb/mddb-cli-${VERSION_NUM}/usr/bin/mddb-cli
          
          # Copy docs
          cp ../../README.md dist/deb/mddb-cli-${VERSION_NUM}/usr/share/doc/mddb-cli/
          
          # Copy man page if exists
          if [ -f mddb-cli.1 ]; then
            cp mddb-cli.1 dist/deb/mddb-cli-${VERSION_NUM}/usr/share/man/man1/
            gzip dist/deb/mddb-cli-${VERSION_NUM}/usr/share/man/man1/mddb-cli.1
          fi
          
          # Create control file
          cat > dist/deb/mddb-cli-${VERSION_NUM}/DEBIAN/control << EOF
          Package: mddb-cli
          Version: ${VERSION_NUM}
          Section: utils
          Priority: optional
          Architecture: ${{ matrix.goarch }}
          Maintainer: MDDB Team <team@mddb.io>
          Description: Command-line client for MDDB
           Full-featured CLI client for MDDB (Markdown Database).
           Provides commands for document management, search, export,
           backup, and statistics.
          Homepage: https://github.com/tradik/mddb
          EOF
          
          # Build package
          dpkg-deb --build dist/deb/mddb-cli-${VERSION_NUM}
          mv dist/deb/mddb-cli-${VERSION_NUM}.deb dist/mddb-cli-${VERSION_NUM}-${{ matrix.platform }}.deb

      - name: Create RPM package
        if: contains(matrix.package_formats, 'rpm')
        working-directory: services/mddb-cli
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          VERSION_NUM=${VERSION#v}
          
          # Create RPM build structure
          mkdir -p dist/rpm/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          
          # Create spec file
          cat > dist/rpm/SPECS/mddb-cli.spec << EOF
          Name:           mddb-cli
          Version:        ${VERSION_NUM}
          Release:        1%{?dist}
          Summary:        Command-line client for MDDB
          License:        BSD-3-Clause
          URL:            https://github.com/tradik/mddb
          Source0:        mddb-cli-${VERSION_NUM}.tar.gz

          %description
          Full-featured CLI client for MDDB (Markdown Database).
          Provides commands for document management, search, export,
          backup, and statistics.

          %prep
          %setup -q

          %install
          mkdir -p %{buildroot}/usr/bin
          mkdir -p %{buildroot}/usr/share/doc/mddb-cli
          mkdir -p %{buildroot}/usr/share/man/man1
          
          install -m 755 mddb-cli %{buildroot}/usr/bin/mddb-cli
          install -m 644 README.md %{buildroot}/usr/share/doc/mddb-cli/
          
          # Install man page if exists
          [ -f mddb-cli.1 ] && install -m 644 mddb-cli.1 %{buildroot}/usr/share/man/man1/ && gzip %{buildroot}/usr/share/man/man1/mddb-cli.1 || true

          %files
          /usr/bin/mddb-cli
          /usr/share/doc/mddb-cli/README.md
          %{_mandir}/man1/mddb-cli.1.gz

          %changelog
          * $(date "+%a %b %d %Y") MDDB Team <team@mddb.io> - ${VERSION_NUM}-1
          - Release ${VERSION_NUM}
          EOF
          
          # Create source tarball
          mkdir -p mddb-cli-${VERSION_NUM}
          cp mddb-cli-${{ matrix.platform }} mddb-cli-${VERSION_NUM}/mddb-cli
          cp ../../README.md mddb-cli-${VERSION_NUM}/
          
          # Create man page if it doesn't exist
          if [ ! -f mddb-cli.1 ]; then
            cat > mddb-cli-${VERSION_NUM}/mddb-cli.1 << 'MANEOF'
          .TH MDDB-CLI 1 "$(date +%Y-%m-%d)" "MDDB ${VERSION_NUM}" "User Commands"
          .SH NAME
          mddb-cli \- Command-line client for MDDB
          .SH SYNOPSIS
          .B mddb-cli
          [\fIOPTIONS\fR] \fICOMMAND\fR [\fIARGS\fR]
          .SH DESCRIPTION
          Full-featured CLI client for MDDB (Markdown Database).
          .SH SEE ALSO
          Full documentation at: https://github.com/tradik/mddb
          MANEOF
          else
            cp mddb-cli.1 mddb-cli-${VERSION_NUM}/
          fi
          
          tar czf dist/rpm/SOURCES/mddb-cli-${VERSION_NUM}.tar.gz mddb-cli-${VERSION_NUM}
          
          # Build RPM
          rpmbuild --define "_topdir $(pwd)/dist/rpm" -bb dist/rpm/SPECS/mddb-cli.spec
          
          # Copy RPM to dist
          find dist/rpm/RPMS -name "*.rpm" -exec cp {} dist/mddb-cli-${VERSION_NUM}-${{ matrix.platform }}.rpm \;

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: mddb-cli-${{ matrix.platform }}
          path: |
            services/mddb-cli/dist/*.tar.gz
            services/mddb-cli/dist/*.deb
            services/mddb-cli/dist/*.rpm

  create-release:
    name: Create GitHub Release
    needs: [build-server, build-client]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts
          pattern: md*

      # OPS-011: notes come from CHANGELOG.md, so they describe the release
      # they are attached to. The previous step published the same hand-written
      # text for every tag, carrying benchmark figures from one historical
      # measurement.
      - name: Create release notes
        run: |
          python3 scripts/release-notes.py "${{ steps.version.outputs.VERSION }}" > release-notes.md
          echo "--- release notes ---"
          head -40 release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: MDDB ${{ steps.version.outputs.VERSION }}
          body_path: release-notes.md
          draft: false
          prerelease: false
          files: |
            release-artifacts/**/*.tar.gz
            release-artifacts/**/*.deb
            release-artifacts/**/*.rpm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-homebrew-tap:
    name: Update Homebrew Tap
    needs: [create-release]
    runs-on: ubuntu-latest

    steps:
      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "VERSION_NUM=${VERSION#v}" >> $GITHUB_OUTPUT

      - name: Wait for release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          for i in $(seq 1 30); do
            count=$(gh release view "$VERSION" -R tradik/mddb --json assets --jq '[.assets[].name | select(test("(mddbd|mddb-cli)-.*-(darwin|linux)-(amd64|arm64)\\.tar\\.gz$"))] | length')
            if [ "$count" = "8" ]; then echo "All 8 tarballs present"; exit 0; fi
            echo "Waiting for assets ($count/8)..."
            sleep 10
          done
          echo "Timed out waiting for release assets"; exit 1

      - name: Download tarballs and compute sha256
        id: sha
        run: |
          V="${{ steps.version.outputs.VERSION }}"
          mkdir -p dl && cd dl
          for bin in mddbd mddb-cli; do
            for plat in darwin-arm64 darwin-amd64 linux-arm64 linux-amd64; do
              f="${bin}-${V}-${plat}.tar.gz"
              curl -sfL --proto '=https' --proto-redir '=https' -o "$f" "https://github.com/tradik/mddb/releases/download/${V}/${f}"
              sha=$(sha256sum "$f" | awk '{print $1}')
              key=$(echo "${bin}_${plat}" | tr 'a-z-' 'A-Z_')
              echo "${key}=${sha}" >> $GITHUB_OUTPUT
            done
          done

      - name: Checkout homebrew-tap
        uses: actions/checkout@v7
        with:
          repository: tradik/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Render formulas
        run: |
          V="${{ steps.version.outputs.VERSION }}"
          VN="${{ steps.version.outputs.VERSION_NUM }}"

          cat > homebrew-tap/Formula/mddb.rb << EOF
          # Homebrew formula for MDDB - Markdown Database Server
          # Install: brew install tradik/tap/mddb
          # Or: brew tap tradik/tap && brew install mddb

          class Mddb < Formula
            desc "Embedded Markdown database server with REST, gRPC, GraphQL and vector search"
            homepage "https://github.com/tradik/mddb"
            version "${VN}"
            license "BSD-3-Clause"

            on_macos do
              on_arm do
                url "https://github.com/tradik/mddb/releases/download/${V}/mddbd-${V}-darwin-arm64.tar.gz"
                sha256 "${{ steps.sha.outputs.MDDBD_DARWIN_ARM64 }}"
              end
              on_intel do
                url "https://github.com/tradik/mddb/releases/download/${V}/mddbd-${V}-darwin-amd64.tar.gz"
                sha256 "${{ steps.sha.outputs.MDDBD_DARWIN_AMD64 }}"
              end
            end

            on_linux do
              on_arm do
                url "https://github.com/tradik/mddb/releases/download/${V}/mddbd-${V}-linux-arm64.tar.gz"
                sha256 "${{ steps.sha.outputs.MDDBD_LINUX_ARM64 }}"
              end
              on_intel do
                url "https://github.com/tradik/mddb/releases/download/${V}/mddbd-${V}-linux-amd64.tar.gz"
                sha256 "${{ steps.sha.outputs.MDDBD_LINUX_AMD64 }}"
              end
            end

            def install
              bin.install "mddbd"
            end

            service do
              run [opt_bin/"mddbd"]
              keep_alive true
              log_path var/"log/mddbd.log"
              error_log_path var/"log/mddbd.log"
              working_dir var/"mddb"
            end

            def post_install
              (var/"mddb").mkpath
            end

            test do
              system "#{bin}/mddbd", "--version"
            end
          end
          EOF

          cat > homebrew-tap/Formula/mddb-cli.rb << EOF
          # Homebrew formula for MDDB CLI
          # Install: brew install tradik/tap/mddb-cli
          # Or: brew tap tradik/tap && brew install mddb-cli

          class MddbCli < Formula
            desc "Command-line interface for MDDB Markdown Database"
            homepage "https://github.com/tradik/mddb"
            version "${VN}"
            license "BSD-3-Clause"

            on_macos do
              on_arm do
                url "https://github.com/tradik/mddb/releases/download/${V}/mddb-cli-${V}-darwin-arm64.tar.gz"
                sha256 "${{ steps.sha.outputs.MDDB_CLI_DARWIN_ARM64 }}"
              end
              on_intel do
                url "https://github.com/tradik/mddb/releases/download/${V}/mddb-cli-${V}-darwin-amd64.tar.gz"
                sha256 "${{ steps.sha.outputs.MDDB_CLI_DARWIN_AMD64 }}"
              end
            end

            on_linux do
              on_arm do
                url "https://github.com/tradik/mddb/releases/download/${V}/mddb-cli-${V}-linux-arm64.tar.gz"
                sha256 "${{ steps.sha.outputs.MDDB_CLI_LINUX_ARM64 }}"
              end
              on_intel do
                url "https://github.com/tradik/mddb/releases/download/${V}/mddb-cli-${V}-linux-amd64.tar.gz"
                sha256 "${{ steps.sha.outputs.MDDB_CLI_LINUX_AMD64 }}"
              end
            end

            def install
              bin.install "mddb-cli"
              man1.install "mddb-cli.1" if File.exist?("mddb-cli.1")
            end

            test do
              system "#{bin}/mddb-cli", "--help"
            end
          end
          EOF

      - name: Commit and push tap update
        run: |
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet Formula/; then
            echo "No formula changes — skipping."
            exit 0
          fi
          git add Formula/mddb.rb Formula/mddb-cli.rb
          git commit -m "chore: bump mddb and mddb-cli to ${{ steps.version.outputs.VERSION_NUM }}"
          git push origin main

      - name: Upload Homebrew formulas as artifact
        uses: actions/upload-artifact@v7
        with:
          name: homebrew-formulas
          path: homebrew-tap/Formula/*.rb

  # Snap publish jobs use `snapcore/action-build@v1` to build natively on
  # the runner via LXD (no Launchpad OAuth handshake, which was timing out
  # in the previous `snapcraft remote-build` approach after 900s). Each
  # architecture gets its own matrix entry on the matching native runner:
  #   amd64 → ubuntu-latest
  #   arm64 → ubuntu-24.04-arm (GitHub-hosted native ARM runner)
  # Only `SNAPCRAFT_STORE_CREDENTIALS` is required — no Launchpad creds.
  publish-snap-mddbd:
    name: Publish mddbd Snap (${{ matrix.arch }})
    needs: [create-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build snap
        id: build
        uses: snapcore/action-build@v1
        with:
          path: services/mddbd

      - name: Publish snap
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: stable

  publish-snap-mddb-cli:
    name: Publish mddb-cli Snap (${{ matrix.arch }})
    needs: [create-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: services/mddb-cli/go.sum

      - name: Vendor dependencies (self-contained snap build)
        working-directory: services/mddb-cli
        env:
          GOWORK: "off"
        run: |
          # GO-015: mddb-cli pins the shared client via a local
          # `replace mddb-client => ../../clients/go/mddb`, which is NOT visible
          # inside the snapcraft build sandbox (source: . copies only this dir),
          # so the sandbox `go build` failed with "replacement directory
          # ../../clients/go/mddb does not exist". Vendor here in the full
          # checkout (where the shared module exists) so the snap builds
          # self-contained — `go build` then uses vendor/ with no path resolution.
          go mod vendor

      - name: Build snap
        id: build
        uses: snapcore/action-build@v1
        with:
          path: services/mddb-cli

      - name: Publish snap
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: stable

  publish-snap-mddb-panel:
    name: Publish mddb-panel Snap (${{ matrix.arch }})
    needs: [create-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # The panel's src/components/MCPConfigPanel.jsx does
      #   import mddbModelPyRaw from '@scripts/mddb_model.py?raw'
      # and vite.config.js resolves `@scripts` from `services/mddb-panel/scripts/`
      # (Docker layout) or `../../scripts/` (local dev). snapcraft's build
      # context is the single services/mddb-panel/ directory, so stage the
      # file into the Docker-style location before the build.
      - name: Stage scripts/mddb_model.py for vite alias
        run: |
          mkdir -p services/mddb-panel/scripts
          cp scripts/mddb_model.py services/mddb-panel/scripts/mddb_model.py

      - name: Build snap
        id: build
        uses: snapcore/action-build@v1
        with:
          path: services/mddb-panel

      - name: Publish snap
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: stable

  docker-server:
    name: Build Server Docker Image
    needs: [build-server]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Get version
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION=${{ github.event.inputs.version }}
          else
            VERSION=${GITHUB_REF#refs/tags/}
          fi
          VERSION_NUM=${VERSION#v}
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "VERSION_NUM=${VERSION_NUM}" >> $GITHUB_OUTPUT
          echo "BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT
          echo "COMMIT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Download server binary (linux-amd64)
        uses: actions/download-artifact@v8
        with:
          name: mddbd-binary-linux-amd64
          path: docker-ctx

      - name: Download server binary (linux-arm64)
        uses: actions/download-artifact@v8
        with:
          name: mddbd-binary-linux-arm64
          path: docker-ctx

      - name: Prepare Docker context
        run: |
          cp services/mddbd/Dockerfile.release docker-ctx/Dockerfile
          ls -la docker-ctx/

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ env.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push server image
        id: build-server
        uses: docker/build-push-action@v7
        with:
          context: docker-ctx
          file: docker-ctx/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.DOCKER_HUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.VERSION_NUM }}
            ${{ env.DOCKER_HUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.GHCR_REGISTRY }}/${{ github.repository }}:${{ steps.meta.outputs.VERSION_NUM }}
            ${{ env.GHCR_REGISTRY }}/${{ github.repository }}:latest
          labels: |
            org.opencontainers.image.title=MDDB Server
            org.opencontainers.image.description=High-performance markdown database server with gRPC and HTTP/3 support
            org.opencontainers.image.version=${{ steps.meta.outputs.VERSION_NUM }}
            org.opencontainers.image.created=${{ steps.meta.outputs.BUILD_DATE }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.COMMIT_SHA }}
            org.opencontainers.image.source=https://github.com/tradik/mddb
            org.opencontainers.image.url=https://github.com/tradik/mddb
            org.opencontainers.image.documentation=https://github.com/tradik/mddb/blob/main/README.md
            org.opencontainers.image.licenses=BSD-3-Clause
            org.opencontainers.image.vendor=MDDB Team

      - name: Generate artifact attestation for server
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.GHCR_REGISTRY }}/${{ github.repository }}
          subject-digest: ${{ steps.build-server.outputs.digest }}
          push-to-registry: true

  docker-panel:
    name: Build Panel Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Get version
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION=${{ github.event.inputs.version }}
          else
            VERSION=${GITHUB_REF#refs/tags/}
          fi
          VERSION_NUM=${VERSION#v}
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "VERSION_NUM=${VERSION_NUM}" >> $GITHUB_OUTPUT
          echo "BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT
          echo "COMMIT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ env.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push panel image
        id: build-panel
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./services/mddb-panel/Dockerfile
          target: production
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.DOCKER_HUB_USERNAME }}/${{ env.IMAGE_NAME }}:panel-${{ steps.meta.outputs.VERSION_NUM }}
            ${{ env.DOCKER_HUB_USERNAME }}/${{ env.IMAGE_NAME }}:panel
            ${{ env.DOCKER_HUB_USERNAME }}/${{ env.IMAGE_NAME }}:panel-latest
            ${{ env.GHCR_REGISTRY }}/${{ github.repository }}:panel-${{ steps.meta.outputs.VERSION_NUM }}
            ${{ env.GHCR_REGISTRY }}/${{ github.repository }}:panel
            ${{ env.GHCR_REGISTRY }}/${{ github.repository }}:panel-latest
          labels: |
            org.opencontainers.image.title=MDDB Panel
            org.opencontainers.image.description=Web-based administration panel for MDDB
            org.opencontainers.image.version=${{ steps.meta.outputs.VERSION_NUM }}
            org.opencontainers.image.created=${{ steps.meta.outputs.BUILD_DATE }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.COMMIT_SHA }}
            org.opencontainers.image.source=https://github.com/tradik/mddb
            org.opencontainers.image.url=https://github.com/tradik/mddb
            org.opencontainers.image.documentation=https://github.com/tradik/mddb/blob/main/services/mddb-panel/README.md
            org.opencontainers.image.licenses=BSD-3-Clause
            org.opencontainers.image.vendor=MDDB Team
          cache-from: type=gha,scope=panel
          cache-to: type=gha,mode=max,scope=panel

      - name: Generate artifact attestation for panel
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.GHCR_REGISTRY }}/${{ github.repository }}
          subject-digest: ${{ steps.build-panel.outputs.digest }}
          push-to-registry: true

  release-summary:
    name: Release Summary
    needs: [create-release, docker-server, docker-panel, publish-snap-mddbd, publish-snap-mddb-cli, publish-snap-mddb-panel]
    runs-on: ubuntu-latest
    steps:
      - name: Get version
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION=${{ github.event.inputs.version }}
          else
            VERSION=${GITHUB_REF#refs/tags/}
          fi
          VERSION_NUM=${VERSION#v}
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "VERSION_NUM=${VERSION_NUM}" >> $GITHUB_OUTPUT

      - name: Create release summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY << 'EOF'
          ## Release Summary

          ### Native Packages
          - GitHub Release: https://github.com/tradik/mddb/releases/tag/${{ steps.meta.outputs.VERSION }}

          ### Snap Store
          - `snap install mddbd`
          - `snap install mddb-cli`
          - `snap install mddb-panel`

          ### Docker Images

          **MDDB Server:**
          - `${{ env.DOCKER_HUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.VERSION_NUM }}`
          - `${{ env.DOCKER_HUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest`
          - `${{ env.GHCR_REGISTRY }}/tradik/mddb:${{ steps.meta.outputs.VERSION_NUM }}`

          **MDDB Panel:**
          - `${{ env.DOCKER_HUB_USERNAME }}/${{ env.IMAGE_NAME }}:panel-${{ steps.meta.outputs.VERSION_NUM }}`
          - `${{ env.DOCKER_HUB_USERNAME }}/${{ env.IMAGE_NAME }}:panel`

          > MCP is built into the server image. Use `MDDB_MCP_STDIO=true` for stdio mode.

          ### Platforms
          - Native: linux/amd64, linux/arm64, darwin/amd64, darwin/arm64, freebsd/amd64
          - Docker: linux/amd64, linux/arm64

          ### Quick Start
          ```bash
          docker pull ${{ env.DOCKER_HUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.VERSION_NUM }}
          docker run -d -p 11023:11023 -v mddb-data:/data ${{ env.DOCKER_HUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.VERSION_NUM }}
          ```
          EOF
