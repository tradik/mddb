name: WordPress Plugin (mddb-sync)

on:
  push:
    branches: [main]
    paths:
      - 'integrations/wordpress-plugin/**'
      - '.github/workflows/wordpress-plugin.yml'
    tags:
      - 'wp-v*'
  pull_request:
    branches: [main, develop]
    paths:
      - 'integrations/wordpress-plugin/**'
      - '.github/workflows/wordpress-plugin.yml'
  workflow_dispatch:

env:
  WORKING_DIR: integrations/wordpress-plugin
  # Pin JS-based actions to Node 24 to keep parity with the rest of the workflows.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  test:
    name: Lint + tests (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.3', '8.4', '8.5']
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: xdebug
          tools: composer:v2

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php${{ matrix.php-version }}-composer-${{ hashFiles('integrations/wordpress-plugin/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php${{ matrix.php-version }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Security audit
        run: composer audit --abandoned=report

      - name: PHPCS (WordPress security ruleset)
        run: composer lint

      - name: PHPStan (level 5, WordPress-aware)
        run: composer stan

      - name: PHPUnit with coverage
        env:
          XDEBUG_MODE: coverage
        run: composer test:coverage

      - name: Enforce 90% line coverage
        if: matrix.php-version == '8.3'
        run: |
          php -r '
            $xml = simplexml_load_file("coverage.xml");
            $metrics = $xml->project->metrics;
            $covered = (int) $metrics["coveredstatements"];
            $total   = (int) $metrics["statements"];
            $pct     = $total > 0 ? ($covered / $total) * 100 : 0;
            printf("Line coverage: %.2f%% (%d/%d)\n", $pct, $covered, $total);
            if ($pct < 90.0) { fwrite(STDERR, "Coverage below 90%\n"); exit(1); }
          '

      - name: Upload coverage artifact
        if: matrix.php-version == '8.3'
        uses: actions/upload-artifact@v7
        with:
          name: wordpress-plugin-coverage
          path: integrations/wordpress-plugin/coverage.xml
          retention-days: 14

  build:
    name: Build release zip
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/wp-v')
    permissions:
      contents: write
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Derive version from tag
        id: version
        run: |
          TAG="${GITHUB_REF##*/}"
          VERSION="${TAG#wp-v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Verify plugin header version matches tag
        run: |
          HEADER_VERSION="$(grep -E '^[[:space:]]*\*[[:space:]]*Version:' mddb-sync.php | head -n1 | sed -E 's/.*Version:[[:space:]]*//')"
          echo "Plugin header version: $HEADER_VERSION"
          echo "Tag version:           ${{ steps.version.outputs.version }}"
          if [ "$HEADER_VERSION" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::Plugin header Version ($HEADER_VERSION) does not match git tag (${{ steps.version.outputs.version }})"
            exit 1
          fi

      - name: Install runtime dependencies only
        run: composer install --no-dev --prefer-dist --no-progress --optimize-autoloader

      - name: Stage release tree
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/mddb-sync"
          mkdir -p "$STAGE"
          rsync -a \
            --exclude '.git*' \
            --exclude 'tests' \
            --exclude 'phpunit.xml.dist' \
            --exclude 'phpcs.xml' \
            --exclude 'phpstan.neon.dist' \
            --exclude 'composer.lock' \
            --exclude '.phpunit.cache' \
            --exclude 'coverage.xml' \
            --exclude 'clover.xml' \
            --exclude 'Makefile' \
            --exclude 'CHANGELOG.md' \
            --exclude 'README.md' \
            ./ "$STAGE/"
          echo "::group::Staged files"
          find "$STAGE" -type f | head -50
          echo "::endgroup::"

      - name: Pack release zip
        run: |
          ZIP_NAME="mddb-sync-${{ steps.version.outputs.version }}.zip"
          (cd "$RUNNER_TEMP" && zip -r "$ZIP_NAME" mddb-sync) > /dev/null
          mv "$RUNNER_TEMP/$ZIP_NAME" .
          ls -la "$ZIP_NAME"
        working-directory: ${{ env.WORKING_DIR }}

      - name: Upload zip as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: mddb-sync-${{ steps.version.outputs.version }}
          path: integrations/wordpress-plugin/mddb-sync-${{ steps.version.outputs.version }}.zip
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "MDDB Sync ${{ steps.version.outputs.version }}"
          body: |
            WordPress plugin release built from `${{ github.sha }}`.

            See [integrations/wordpress-plugin/CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ steps.version.outputs.tag }}/integrations/wordpress-plugin/CHANGELOG.md) for details.

            Install in WordPress via **Plugins → Add New → Upload Plugin** using the attached zip.
          files: integrations/wordpress-plugin/mddb-sync-${{ steps.version.outputs.version }}.zip
          fail_on_unmatched_files: true
