name: Deploy Docs to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'blog/**'
      - 'services/ssg-template/**'
      - 'scripts/check-docs-links.py'
      - '.ssg.yaml'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: "docs"
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  WRANGLER_VERSION: '4.80.0'
  CLOUDFLARE_PROJECT: mddb-docs

jobs:
  deploy:
    name: Build & Deploy Docs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'

      # FE-002 / FE-007: gate the deploy on the SSG-template security regression
      # tests (XSS sanitization, ?doc validation, CDN SRI pins). A regression
      # here must block publishing the docs site, not ship silently.
      - name: Test SSG templates
        run: node --test services/ssg-template/*.test.mjs

      - name: Prepare metadata
        run: echo '{"categories":[],"media":[],"users":[]}' > docs/metadata.json

      - name: Generate site with SSG
        uses: spagu/ssg@739101baa3407dce488d7f746b156780eb32059c # v1.8.47
        with:
          # Pinned: the build depends on output validation from 1.8.18
          # (check_links/images/meta/orphans), static_sources from 1.8.19 and
          # declared feeds (feeds:, RSS) from 1.8.20. The pin is also what made
          # the last mismatch obvious rather than intermittent.
          #
          # Both pins move together. Dependabot only sees the `uses:` ref, so a
          # bare dependabot bump leaves `version:` behind and the action then
          # fetches a binary older than itself — check both when bumping.
          version: 'v1.8.47'
          source: '.'
          template: 'ssg-template'
          domain: 'mddb.tradik.com'
          content-dir: 'docs'
          templates-dir: 'services'
          output-dir: 'dist'
          webp: 'true'
          webp-quality: '80'
          # og:image is an absolute URL, which SSG deliberately leaves alone;
          # replace mode would delete the PNG it points at.
          webp-keep-original: 'true'
          # Minification collapses whitespace inside Mermaid code blocks, which
          # breaks diagram parsing (xychart "y-axis 0 --> 55", subgraph layouts,
          # etc.). Mermaid source is whitespace-significant, so keep it verbatim.
          minify: 'false'
          clean: 'true'

      # SEO-001: a link that 404s on mddb.tradik.com must block the deploy, not
      # surface weeks later in a crawl report. Offline check — external hosts
      # are never fetched.
      - name: Check for broken internal links
        run: python3 scripts/check-docs-links.py dist

      - name: Create Cloudflare Pages project (if not exists)
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@${{ env.WRANGLER_VERSION }} pages project create ${{ env.CLOUDFLARE_PROJECT }} --production-branch=main

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@${{ env.WRANGLER_VERSION }} pages deploy dist --project-name=${{ env.CLOUDFLARE_PROJECT }} --commit-dirty=true
