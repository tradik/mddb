name: Secret Scan (gitleaks)

# SEC-007: fail CI if a secret is committed. The allowlist for legitimate
# example/test/vendored values lives in .gitleaks.toml.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  GITLEAKS_VERSION: '8.30.1'

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          chmod +x gitleaks
          ./gitleaks version

      # Scan the working tree (current files). A non-zero exit fails the job.
      - name: Scan working tree
        run: ./gitleaks dir . --config .gitleaks.toml --no-banner --redact --verbose --exit-code 1

      # On PRs also scan the commits introduced by the PR, so a secret added
      # and "removed" in a later commit of the same PR is still caught.
      - name: Scan PR commit range
        if: github.event_name == 'pull_request'
        run: |
          ./gitleaks git . \
            --config .gitleaks.toml --no-banner --redact --verbose --exit-code 1 \
            --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
