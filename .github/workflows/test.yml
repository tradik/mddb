name: Tests

# OPS-009: least privilege — tests/lint/build publish nothing.
permissions:
  contents: read

on:
  push:
    branches: [main, develop]
    paths:
      - 'services/mddbd/**'
      - 'services/mddb-cli/**'
      - 'clients/go/mddb/**'
      - 'proto/**'
      - 'buf.yaml'
      - 'buf.gen.yaml'
      - 'go.work'
      - 'tools/bench/**'
      - 'test/**'
      - 'test/upgrade-fixtures/**'
      - 'scripts/check-go-version.sh'
      - 'scripts/check-proto-plugins.sh'
      - 'scripts/check-coverage-areas.sh'
      - 'scripts/go-test-shard.py'
      - 'scripts/merge-coverprofiles.sh'
      - 'scripts/sonar-*.py'
      - 'scripts/check-sonar-exclusions.py'
      - 'scripts/tests/test-sonar.sh'
      - 'buf.gen.yaml'
      - '.github/workflows/test.yml'
      # These jobs exist in this workflow and were unreachable: the filter
      # listed only Go paths, so a change to the panel, the widget, mddb-chat
      # or a client ran none of the jobs written to cover it. Dependency
      # updates were the visible symptom — a lockfile bump arrived with two
      # green checks (Sonar and gitleaks) and nothing that built or tested
      # what it changed.
      - 'services/mddb-panel/**'
      - 'services/mddb-chat/**'
      - 'services/mddb-chat-widget/**'
      - 'integrations/langchain-mddb/**'
      - 'clients/python/**'
      - 'clients/nodejs/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'services/mddbd/**'
      - 'services/mddb-cli/**'
      - 'clients/go/mddb/**'
      - 'proto/**'
      - 'buf.yaml'
      - 'buf.gen.yaml'
      - 'go.work'
      - 'tools/bench/**'
      - 'test/**'
      - 'test/upgrade-fixtures/**'
      - 'scripts/check-go-version.sh'
      - 'scripts/check-proto-plugins.sh'
      - 'scripts/check-coverage-areas.sh'
      - 'scripts/go-test-shard.py'
      - 'scripts/merge-coverprofiles.sh'
      - 'scripts/sonar-*.py'
      - 'scripts/check-sonar-exclusions.py'
      - 'scripts/tests/test-sonar.sh'
      - 'buf.gen.yaml'
      - '.github/workflows/test.yml'
      # These jobs exist in this workflow and were unreachable: the filter
      # listed only Go paths, so a change to the panel, the widget, mddb-chat
      # or a client ran none of the jobs written to cover it. Dependency
      # updates were the visible symptom — a lockfile bump arrived with two
      # green checks (Sonar and gitleaks) and nothing that built or tested
      # what it changed.
      - 'services/mddb-panel/**'
      - 'services/mddb-chat/**'
      - 'services/mddb-chat-widget/**'
      - 'integrations/langchain-mddb/**'
      - 'clients/python/**'
      - 'clients/nodejs/**'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  GO_VERSION: "1.27.3"
  # Disable Go workspace mode in CI so each module builds/tests in isolation.
  # This catches missing `require` entries that go.work would hide by
  # transparently resolving sibling modules. Developers get the workspace
  # benefits locally (cross-module refactoring, unified `go build`);
  # CI keeps modules strictly independent.
  GOWORK: "off"

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: services/mddbd/go.sum

      - name: Install dependencies
        working-directory: services/mddbd
        run: |
          go mod download
          go mod verify
          go mod tidy

      # The root package holds most of the suite (over 3,000 tests) and runs
      # in the test-core shards below. Here: every other package.
      - name: Run tests (packages other than the root)
        working-directory: services/mddbd
        run: go test -v -race -coverprofile=coverage-packages.out $(go list ./... | grep -vx mddb)

      # #336: again with one file per collection, so the two storage layouts
      # cannot drift apart.
      - name: Run tests (packages other than the root, per-collection storage layout)
        working-directory: services/mddbd
        env:
          MDDB_STORAGE_LAYOUT: per-collection
        run: go test -race $(go list ./... | grep -vx mddb)

      - name: Keep the package coverage for the merge
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-packages
          path: services/mddbd/coverage-packages.out
          retention-days: 1

      # GO-015: the shared Go client SDK (used by mddb-cli) and the CLI itself
      # build/test standalone under GOWORK=off, catching API drift against the
      # server's HTTP contract.
      - name: Test shared Go client
        working-directory: clients/go/mddb
        run: go test -race -coverprofile=coverage.out ./...

      # #333: bbolt is vendored with a patch (third_party/bbolt/MDDB-PATCH.md).
      # Its own module, so the server's ./... does not reach it.
      - name: Test patched bbolt
        working-directory: services/mddbd/third_party/bbolt
        env:
          GOWORK: "off"
        run: go test -race -run 'Deferred|TestDB_|TestTx_' .

      # TEST-001: the CLI had one test file covering four helpers (0.9% of the
      # module) because every command was an anonymous closure inside a
      # 1447-line main(). The commands are now testable, and the floor keeps
      # them tested — raise it when you improve the area, never lower it.
      - name: Build & test mddb-cli
        working-directory: services/mddb-cli
        run: |
          go mod tidy
          go build ./...
          go test -race -coverprofile=coverage.out ./...
          pct=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub("%","",$3); print $3}')
          echo "mddb-cli coverage: ${pct}%"
          awk -v p="$pct" 'BEGIN { if (p+0 < 88) { print "coverage " p "% is below the 88% floor"; exit 1 } }'

      # For the SonarCloud scan at the end of this workflow (OPS-021). The
      # sonar- prefix keeps these out of the coverage job's coverage-* merge:
      # they are other modules, and the merge refuses mixed profiles.
      - name: Keep the CLI and client coverage for the scan
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sonar-go-modules
          path: |
            services/mddb-cli/coverage.out
            clients/go/mddb/coverage.out
          retention-days: 1

      # TEST-003: every saved crasher is replayed on every run — that is what
      # `go test` does with testdata/fuzz corpora, so a bug found once can
      # never come back silently. The short fuzz budget below looks for new
      # ones; it is deliberately small so a PR is not held up by luck.
      # TEST-003: a database written by an older release must still open.
      # Runs here as well as in the release workflow, because a compatibility
      # break should surface in the pull request that causes it rather than
      # weeks later when someone tries to tag.
      - name: Upgrade compatibility (older release fixtures)
        working-directory: services/mddbd
        run: go test -run 'TestOpensFixturesFromOlderReleases|TestFixtureContentIsUnchanged' ./

      - name: Run fuzz corpus (regressions)
        working-directory: services/mddbd
        run: go test -run 'Fuzz' ./...

      - name: Fuzz (short budget, new inputs)
        working-directory: services/mddbd
        run: |
          set -e
          # One target per package, 20s each. Nightly runs the long budgets.
          go test -run='^$' -fuzz='^FuzzParseQueryExpression$'    -fuzztime=20s ./internal/fts/
          go test -run='^$' -fuzz='^FuzzUnmarshalEmbeddingRecord$' -fuzztime=20s ./internal/vector/
          go test -run='^$' -fuzz='^FuzzUnmarshalBinlogEntry$'     -fuzztime=20s ./internal/binlog/
          go test -run='^$' -fuzz='^FuzzDecompressDoc$'            -fuzztime=20s ./internal/compression/
          go test -run='^$' -fuzz='^FuzzLoadDoc$'                  -fuzztime=20s ./
          go test -run='^$' -fuzz='^FuzzPersistenceRoundTrip$'   -fuzztime=20s ./

      - name: Run test-shard and coverage-merge guard test suite
        run: bash scripts/tests/test-test-shards.sh

      # OPS-021: the scan's helpers — the exclusion lists of the two Sonar
      # configurations, the report path rewrite, and which workflow scans.
      - name: Run SonarCloud configuration guard test suite
        run: bash scripts/tests/test-sonar.sh

      # OPS-018: a tag is a mutable pointer. tj-actions/changed-files had every
      # one of its tags repointed at a secret-dumping commit in March 2025, and
      # thousands of repositories picked it up within hours. A SHA cannot be
      # repointed.
      - name: Every action is pinned to a commit SHA
        run: bash scripts/check-action-pins.sh

      - name: Run action-pin guard test suite
        run: bash scripts/tests/test-action-pins.sh

      # DOC-013: check-docs-links.py checks the built site, so nothing checked
      # README.md — which is what most people read first, and which linked six
      # pages that never existed. 33 dead links across the tree on the first
      # run.
      - name: Relative Markdown links resolve
        run: bash scripts/check-repo-links.sh

      - name: Run repo-link guard test suite
        run: bash scripts/tests/test-repo-links.sh

      - name: Run govulncheck gate test suite
        run: bash scripts/tests/test-govulncheck-gate.sh

      # WIN-004: PowerShell's `>` and Out-File write UTF-16 LE with a BOM by
      # default, and Go answers a file like that with "illegal UTF-8 encoding".
      # .gitattributes normalises line endings and says nothing about encoding,
      # so a file committed from a Windows machine could break the build with
      # an error that names no cause.
      - name: Source files are plain UTF-8
        run: bash scripts/check-source-encoding.sh

      - name: Run source-encoding guard test suite
        run: bash scripts/tests/test-source-encoding.sh


  # The root package of services/mddbd, split three ways and run in both
  # storage layouts. One job took 8 minutes on Linux and over 10 on Windows;
  # a failure now names its shard, and re-running that shard alone takes a
  # third of the time. scripts/go-test-shard.py picks the tests by name prefix
  # and keeps the shards even as tests are added.
  test-core:
    name: Core tests (${{ matrix.layout }}, ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
        layout: [single, per-collection]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: services/mddbd/go.sum

      - name: Run shard
        working-directory: services/mddbd
        env:
          MDDB_STORAGE_LAYOUT: ${{ matrix.layout }}
        run: |
          cov=()
          if [[ "${{ matrix.layout }}" == single ]]; then
            cov=(-coverprofile="coverage-core-${{ matrix.shard }}.out")
          fi
          # The same flags for -list and the run, so the test binary is built once.
          pattern="$(go test -race "${cov[@]}" -list '.*' . | python3 ../../scripts/go-test-shard.py 3 ${{ matrix.shard }})"
          go test -v -race -timeout 25m "${cov[@]}" -run "${pattern}" .

      - name: Keep the shard's coverage for the merge
        if: matrix.layout == 'single'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-core-${{ matrix.shard }}
          path: services/mddbd/coverage-core-${{ matrix.shard }}.out
          retention-days: 1

  # One profile from the shards and the other packages, then the per-area
  # floors and the upload: both need the whole suite's coverage.
  coverage:
    name: Coverage floors
    runs-on: ubuntu-latest
    needs: [test, test-core]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Fetch the profiles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: coverage-*
          path: profiles
          merge-multiple: true

      - name: Merge
        run: bash scripts/merge-coverprofiles.sh services/mddbd/coverage.out profiles/*.out

      # TEST-002: one number for a package of 150 files looked healthy while
      # the surfaces handling uploads, 80 MCP tools and automation triggers sat
      # at 22% between them. The floors are ratchets — raise one when you
      # improve an area, never lower one to make a build pass.
      - name: Per-area coverage floors
        run: bash scripts/check-coverage-areas.sh

      # Here, not in the test job: its --print case reads the real profile,
      # which exists only after the merge above.
      - name: Run coverage-floor guard test suite
        run: bash scripts/tests/test-coverage-areas.sh

      - name: Upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: ./services/mddbd/coverage.out
          flags: unittests
          name: codecov-umbrella

      - name: Keep the merged profile for the scan
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sonar-go-mddbd
          path: services/mddbd/coverage.out
          retention-days: 1

  # WIN-004: the gate for the native Windows port. Until this job existed,
  # everything known about MDDB on Windows came from `GOOS=windows go vet` on a
  # Linux machine — that the code compiles and type-checks, and nothing about
  # whether GetDiskFreeSpaceEx returns what the code assumes or whether a rename
  # lands where it should.
  #
  # Deliberately narrower than the Linux job: no lint, no gosec, no coverage
  # upload, no fuzzing. Those are platform-independent and running them twice
  # buys nothing but minutes. What only this job can answer is whether the tests
  # pass on Windows.
  #
  # amd64 only; windows/arm64 is not a target.
  test-windows:
    name: Run Tests (windows, ${{ matrix.shard }}/3)
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          # Without this the module cache is not restored and every run
          # re-downloads the dependency graph.
          cache-dependency-path: services/mddbd/go.sum

      - name: Build server
        working-directory: services/mddbd
        run: go build ./...

      - name: Build CLI
        working-directory: services/mddb-cli
        run: go build ./...

      # No -race here. It needs cgo and a C toolchain, and the Linux job already
      # runs the whole suite under the race detector — the detector finds data
      # races, which are a property of the code rather than of the operating
      # system. What this job is for is the platform behaviour underneath:
      # file replacement semantics, the syscalls behind diskSpace and
      # processCPUTime, and path handling.
      #
      # The root package runs in three shards (scripts/go-test-shard.py): as
      # one job it passed Go's 10-minute package limit in 2.18.9. The other
      # packages, the client and the CLI run with the first shard.
      - name: Run tests (root package, shard ${{ matrix.shard }}/3)
        working-directory: services/mddbd
        shell: bash
        run: |
          pattern="$(go test -list '.*' . | python3 ../../scripts/go-test-shard.py 3 ${{ matrix.shard }})"
          go test -timeout 25m -run "${pattern}" .

      - name: Run tests (packages other than the root)
        if: matrix.shard == 1
        working-directory: services/mddbd
        shell: bash
        run: go test $(go list ./... | grep -vx mddb)

      - name: Test shared Go client
        if: matrix.shard == 1
        working-directory: clients/go/mddb
        run: go test ./...

      - name: Test mddb-cli
        if: matrix.shard == 1
        working-directory: services/mddb-cli
        run: go test ./...

  lint:
    name: Lint Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: services/mddbd/go.sum

      # GO-012: gofmt gate. Files that aren't `gofmt -s` formatted produce diff
      # noise and merge conflicts and signal the standard toolchain isn't
      # enforced. Fails listing the offenders; `make fmt` fixes them locally.
      - name: Check gofmt formatting
        run: |
          UNFORMATTED=$(gofmt -s -l services/ tools/ test/ clients/go/)
          if [ -n "$UNFORMATTED" ]; then
            echo "::error::Files not gofmt-formatted (run 'make fmt'):"
            echo "$UNFORMATTED"
            exit 1
          fi
          echo "All Go files are gofmt-formatted."

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: latest
          working-directory: services/mddbd
          # The server package grew in 2.18.2 (per-collection storage); on a
          # cold runner loading it alone took past five minutes.
          args: --timeout=10m

      - name: Run golangci-lint (shared Go client)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: latest
          working-directory: clients/go/mddb
          args: --timeout=5m

      # OPS-008: these two were linted by nobody. mddb-cli was a single
      # untestable main() until TEST-001 and tools/bench had three helpers
      # under test; both now carry real code, and gosec runs inside
      # golangci-lint as well as in the SAST workflow.
      - name: Run golangci-lint (mddb-cli)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: latest
          working-directory: services/mddb-cli
          args: --timeout=5m

      - name: Run golangci-lint (tools/bench)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: latest
          working-directory: tools/bench
          args: --timeout=5m

  proto:
    name: Proto Lint & Breaking Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # buf breaking needs the full history of the target branch to
          # compare against.
          fetch-depth: 0

      - name: Set up buf
        # buf-action replaces the archived buf-setup-action, which targeted
        # Node.js 20; setup_only installs buf and runs nothing else.
        uses: bufbuild/buf-action@85aebf73123b5c15fd5528aaecbf9129cddf7fa7 # v1.6.0
        with:
          version: "1.72.0"
          setup_only: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # The protocolbuffers/go plugin in buf.gen.yaml generates the code that
      # links against google.golang.org/protobuf in go.mod. The two drifted
      # once already (plugin v1.36.11, runtime v1.36.12) because a dependency
      # bump touched go.mod alone — a mismatch that surfaces as an
      # unmarshalling bug rather than a build error.
      - name: Verify protobuf plugin and runtime agree
        run: bash scripts/check-proto-plugins.sh --print

      - name: Run proto plugin guard test suite
        run: bash scripts/tests/test-proto-plugins.sh

      - name: Lint proto files
        run: buf lint

      - name: Detect breaking proto changes
        # Only run on PRs — on push to main, this would compare against
        # itself and always pass.
        #
        # Skip when the base branch has no buf.yaml yet (expected only
        # for the initial buf-migration PR, where main still has the
        # pre-migration layout — legacy duplicate `services/mddbd/proto/
        # mddb.proto` alongside `proto/mddb.proto`, which buf cannot
        # build as a single image because they define the same symbols).
        # Once this PR merges, main gains buf.yaml and subsequent PRs
        # run the check normally.
        if: github.event_name == 'pull_request'
        run: |
          if git fetch origin "${{ github.base_ref }}" --depth=1 && \
             git show "origin/${{ github.base_ref }}:buf.yaml" >/dev/null 2>&1; then
            buf breaking --against "https://github.com/${{ github.repository }}.git#branch=${{ github.base_ref }}"
          else
            echo "::warning::Base branch '${{ github.base_ref }}' has no buf.yaml — skipping breaking check (expected for initial buf-migration PR)."
          fi

      - name: Verify generated code is up to date
        # Regenerates everything with pinned plugin versions from buf.gen.yaml,
        # then syncs the source .proto file to the Node.js client directory
        # (required at runtime by @grpc/proto-loader). If any committed file
        # drifts from what this produces, the git diff fails the job.
        # Developers must run `./proto/generate.sh` locally and commit.
        run: |
          buf generate
          cp proto/mddb.proto clients/nodejs/proto/mddb.proto
          if ! git diff --exit-code services/mddbd/proto/ clients/python/mddb_client/ clients/nodejs/proto/ services/php-extension/proto/ 2>&1; then
            echo ""
            echo "❌ Generated proto code is out of date."
            echo "   Run './proto/generate.sh' locally and commit the result."
            exit 1
          fi

  go-version:
    name: Go Toolchain Consistency
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Guards against Go toolchain version drift (DOC-003): every pinned
      # `toolchain goX.Y.Z` (go.work + each go.mod), every `GO_VERSION:`
      # workflow env, and every `golang:X.Y.Z` Docker base image must match.
      # A security bump that misses one place — e.g. go.work lagging at an
      # unpatched toolchain — fails here instead of silently shipping.
      - name: Verify Go version pins are consistent
        run: bash scripts/check-go-version.sh --print

      - name: Run guard test suite
        run: bash scripts/tests/test-go-version.sh

      # DOC-014: the CHANGELOG grew a second [Unreleased] section mid-history,
      # so recent work sat between 2025 releases and anything reading "the
      # Unreleased section" could pick the wrong one.
      - name: Verify CHANGELOG structure
        run: bash scripts/check-changelog.sh

      - name: Run CHANGELOG guard test suite
        run: bash scripts/tests/test-changelog.sh

      # DOC-011: the release version is written in eight places by hand and has
      # drifted before — the CHANGELOG once described a version the binary did
      # not report and no tag existed for.
      - name: Verify the release version is consistent
        run: bash scripts/check-version.sh --print

      - name: Run release-version guard test suite
        run: bash scripts/tests/test-version.sh

      # INT-018: the per-tool instruction files are generated from AGENTS.md.
      # Editing a copy instead of the source is how four of them drift apart.
      - name: Verify agent instructions are generated from their source
        run: python3 scripts/gen-agent-instructions.py --check

  clients-nodejs:
    name: Node client (lockfile + audit)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: clients/nodejs/package-lock.json

      # INT-016: the client shipped without a lockfile, so its builds were not
      # reproducible and `npm audit` refused to run at all. `npm ci` fails if
      # the lockfile is missing or out of sync with package.json, which keeps
      # both properties true from here on.
      - name: Install from lockfile
        working-directory: clients/nodejs
        # --ignore-scripts: `npm ci` runs lifecycle scripts from every
        # transitive dependency, which is arbitrary code execution on a
        # runner holding repository credentials. Nothing here needs one.
        run: npm ci --ignore-scripts

      - name: npm audit (production, high+)
        working-directory: clients/nodejs
        run: npm audit --omit=dev --audit-level=high

      # TEST-001: the package had no tests and no importable client — `main`
      # pointed at example.js, so requiring it ran a demo against localhost.
      # These start a gRPC server in-process; no MDDB instance is needed.
      # test:coverage is `npm test` plus an lcov report; no threshold.
      - name: Run client tests
        working-directory: clients/nodejs
        run: npm run test:coverage

      - name: Keep the coverage for the scan
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sonar-lcov-nodejs
          path: clients/nodejs/lcov.info
          retention-days: 1

  clients-python:
    name: Python client
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'

      # The generated stubs are gitignored, so a fresh checkout does not have
      # them and `from mddb_client import mddb_pb2` cannot resolve. This job
      # was added in this release and had never passed for exactly that
      # reason — it tested an import of a module the checkout did not contain.
      - name: Set up buf
        # buf-action replaces the archived buf-setup-action, which targeted
        # Node.js 20; setup_only installs buf and runs nothing else.
        uses: bufbuild/buf-action@85aebf73123b5c15fd5528aaecbf9129cddf7fa7 # v1.6.0
        with:
          version: "1.72.0"
          setup_only: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # generate.sh, not `buf generate`: the Python gRPC plugin emits an
      # absolute `import mddb_pb2`, and the rewrite to a relative import lives
      # in that script. Calling buf directly here would regenerate the very
      # bug TEST-001 fixed.
      - name: Generate the client stubs
        run: ./proto/generate.sh

      # TEST-001: `import mddb_client` raised ModuleNotFoundError, because the
      # generated stub used an absolute `import mddb_pb2` that only resolves
      # when the files sit on sys.path directly. The package had never been
      # importable, and nothing noticed because nothing imported it.
      # uv sync --locked, not pip install: every version comes from the
      # committed uv.lock and the run fails if the lock and pyproject.toml
      # disagree. A CI job that resolves dependencies afresh on every run is
      # a job whose result depends on what PyPI published this morning.
      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.4"

      - name: Install the client and its test extra
        working-directory: clients/python
        run: uv sync --locked --extra test

      - name: The package imports at all
        working-directory: clients/python
        run: uv run --no-sync python -c "from mddb_client import MddbClient, mddb_pb2; print(MddbClient)"

      # --cov reports and enforces nothing (no --cov-fail-under).
      - name: Run client tests
        working-directory: clients/python
        run: uv run --no-sync pytest -q --cov=mddb_client --cov-report=xml:coverage.xml

      - name: Keep the coverage for the scan
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sonar-cobertura-python
          path: clients/python/coverage.xml
          retention-days: 1

  panel:
    name: Panel (build + tests)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: services/mddb-panel/package-lock.json

      - name: Install from lockfile
        working-directory: services/mddb-panel
        # --ignore-scripts: `npm ci` runs lifecycle scripts from every
        # transitive dependency, which is arbitrary code execution on a
        # runner holding repository credentials. Nothing here needs one.
        run: npm ci --ignore-scripts

      - name: Lint
        working-directory: services/mddb-panel
        run: npm run lint

      # vitest.config.js writes coverage/lcov.info next to its 97% per-file
      # floors.
      - name: Test
        working-directory: services/mddb-panel
        run: npm test

      - name: Keep the coverage for the scan
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sonar-lcov-panel
          path: services/mddb-panel/coverage/lcov.info
          retention-days: 1

      # A panel that does not build is a release with no UI, and nothing was
      # checking it.
      - name: Build
        working-directory: services/mddb-panel
        run: npm run build

  langchain-adapter:
    name: LangChain adapter
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'

      # INT-017: the adapter is a mapping between two interfaces, and what
      # breaks it is a field named differently on the two sides. The suite runs
      # against a fake client, so no MDDB instance is needed — but the fake has
      # to match the real signatures, which is why one of its tests exists.
      # Same reasoning as the Python client job: versions come from the
      # committed uv.lock rather than from whatever resolves today.
      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.4"

      - name: Install
        working-directory: integrations/langchain-mddb
        run: uv sync --locked --extra test

      - name: Run tests
        working-directory: integrations/langchain-mddb
        run: uv run --no-sync pytest -q --cov=langchain_mddb --cov-report=xml:coverage.xml

      - name: Keep the coverage for the scan
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sonar-cobertura-langchain
          path: integrations/langchain-mddb/coverage.xml
          retention-days: 1

  es-compat:
    name: Elasticsearch client compatibility
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: services/mddbd/go.sum

      # INT-019: the official elasticsearch-py, unmodified, against the /es
      # subset of a real server. One build and eight requests-level tests: it
      # exists to catch a broken product check or version negotiation, which
      # no Go test can see from the client's side.
      - name: Build server
        working-directory: services/mddbd
        run: go build -o "$RUNNER_TEMP/mddbd" .

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.4"

      - name: Install
        working-directory: test/es-compat
        run: uv sync --locked

      - name: Run tests
        working-directory: test/es-compat
        env:
          MDDB_BIN: ${{ runner.temp }}/mddbd
        run: uv run --no-sync pytest -q

  chat:
    name: mddb-chat (Rust)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup component add clippy rustfmt

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            services/mddb-chat/target
          key: cargo-${{ runner.os }}-${{ hashFiles('services/mddb-chat/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      # TEST-001: the crate had 10 tests in 3 of 27 files. Writing the rest
      # surfaced a queue that double-booked every admission, a CORS setting
      # that was ignored, and a turn limit that capped nothing.
      # mddb-chat's build script runs prost-build, which shells out to protoc.
      # The runner does not ship one, so this job could never get as far as a
      # test — it failed in the build script every time.
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Run tests
        working-directory: services/mddb-chat
        run: cargo test --all-targets

      - name: Check formatting
        working-directory: services/mddb-chat
        run: cargo fmt --check

      - name: Clippy
        working-directory: services/mddb-chat
        run: cargo clippy --all-targets

  build:
    name: Build Binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, freebsd]
        goarch: [amd64, arm64]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            services/mddbd/go.sum
            services/mddb-cli/go.sum

      - name: Build server
        working-directory: services/mddbd
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: go build -o mddbd-${{ matrix.goos }}-${{ matrix.goarch }} .

      - name: Build client
        working-directory: services/mddb-cli
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: go build -o mddb-cli-${{ matrix.goos }}-${{ matrix.goarch }} .

  bench:
    name: Benchmark Module Build & Vet
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: test/go.sum

      # GO-011: the cross-database benchmark binaries (test/) used to be excluded
      # from CI because the files all sat in one package with duplicate `main`
      # symbols. They are now split one-`package main`-per-directory, so build +
      # vet keep them honest against server/proto API drift. GOWORK=off (workflow
      # env) builds the module standalone via its own `replace mddb => ...`.
      - name: Build benchmark binaries
        working-directory: test
        run: go build ./...

      - name: Vet benchmark binaries
        working-directory: test
        run: go vet ./...

      # TEST-001: tools/bench had one test file covering three arithmetic
      # helpers. The numbers this tool prints are the ones people quote, so a
      # division that yields +Inf is a wrong answer stated with authority.
      - name: Build & test tools/bench
        working-directory: tools/bench
        run: |
          go build ./...
          go vet ./...
          go test -race -coverprofile=coverage.out ./...
          pct=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub("%","",$3); print $3}')
          echo "tools/bench coverage: ${pct}%"
          # The guard used to be an awk one-liner with an unterminated quote,
          # so the step exited 2 on every run whatever the coverage was — it
          # printed the number and then failed regardless of it.
          awk -v p="$pct" 'BEGIN {
            if (p + 0 < 68) {
              printf "::error::tools/bench coverage %s%% is below the 68%% floor\n", p
              exit 1
            }
          }'

  # OPS-021: SonarCloud, through the scanner, with the coverage of every suite
  # above. It runs here rather than in its own workflow because the reports
  # exist only here; .github/workflows/sonarcloud.yml scans the changes this
  # workflow's path filter does not start for, and stands down for the rest
  # (scripts/sonar-scan-owner.py), so a push is scanned once.
  #
  # It waits for the jobs that write coverage. If one of them fails the scan
  # is skipped: the pull request is red already, and a scan with a report
  # missing would post a coverage figure that is wrong.
  #
  # Without SONAR_TOKEN (pull requests from forks) every step is skipped.
  sonarcloud:
    name: SonarCloud scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [test, coverage, clients-nodejs, clients-python, panel, langchain-adapter]
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pull-requests: read
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Without SONAR_TOKEN there is nothing to scan
        if: env.SONAR_TOKEN == ''
        run: echo "SONAR_TOKEN is not set (a pull request from a fork); skipping the scan (OPS-021)."

      - name: Checkout code
        if: env.SONAR_TOKEN != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # blame data for new-code detection

      - name: The two Sonar configurations exclude the same files
        if: env.SONAR_TOKEN != ''
        run: python3 scripts/check-sonar-exclusions.py --print

      - name: Fetch the coverage reports
        if: env.SONAR_TOKEN != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: sonar-*
          path: ${{ runner.temp }}/sonar-in

      # Every file path made absolute in this checkout — see the script for
      # what each tool writes. A missing report fails the step.
      - name: Point the reports at this checkout
        if: env.SONAR_TOKEN != ''
        run: |
          # The script accepts paths inside the checkout or the working
          # directory (scripts/safepath.py): it runs from RUNNER_TEMP, where
          # the reports are, with the checkout as its root.
          repo="$PWD"
          cd "${RUNNER_TEMP}"
          in="sonar-in"
          REPORTS="sonar-reports"
          fix="python3 ${repo}/scripts/sonar-coverage-paths.py"
          mkdir -p "${REPORTS}"
          $fix go "$repo" "${in}/sonar-go-mddbd/coverage.out" "${REPORTS}/go-mddbd.out"
          $fix go "$repo" "${in}/sonar-go-modules/services/mddb-cli/coverage.out" "${REPORTS}/go-cli.out"
          $fix go "$repo" "${in}/sonar-go-modules/clients/go/mddb/coverage.out" "${REPORTS}/go-client.out"
          $fix lcov "$repo" "${in}/sonar-lcov-panel/lcov.info" "${REPORTS}/panel.lcov" services/mddb-panel
          $fix lcov "$repo" "${in}/sonar-lcov-nodejs/lcov.info" "${REPORTS}/nodejs.lcov" clients/nodejs
          $fix cobertura "$repo" "${in}/sonar-cobertura-python/coverage.xml" "${REPORTS}/python.xml" clients/python
          $fix cobertura "$repo" "${in}/sonar-cobertura-langchain/coverage.xml" "${REPORTS}/langchain.xml" integrations/langchain-mddb

      - name: Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        with:
          args: >
            -Dsonar.go.coverage.reportPaths=${{ runner.temp }}/sonar-reports/go-mddbd.out,${{ runner.temp }}/sonar-reports/go-cli.out,${{ runner.temp }}/sonar-reports/go-client.out
            -Dsonar.javascript.lcov.reportPaths=${{ runner.temp }}/sonar-reports/panel.lcov,${{ runner.temp }}/sonar-reports/nodejs.lcov
            -Dsonar.python.coverage.reportPaths=${{ runner.temp }}/sonar-reports/python.xml,${{ runner.temp }}/sonar-reports/langchain.xml
