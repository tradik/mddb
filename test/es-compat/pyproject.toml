# INT-019: the official Elasticsearch Python client against MDDB's /es
# subset, unmodified. Not a package — a locked test environment, so CI runs
# the client version committed in uv.lock, not whatever resolves that day.
[project]
name = "mddb-es-compat-test"
version = "0.0.0"  # never published; not swept by bump-version.sh
description = "elasticsearch-py compatibility test for MDDB's Elasticsearch-compatible subset (INT-019)."
requires-python = ">=3.10"
dependencies = [
    "elasticsearch>=9.5.1",
    "pytest>=9.2.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["."]
