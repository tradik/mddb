# SonarQube Cloud (SonarCloud) analysis configuration, read by the
# sonar-scanner (OPS-021, switched on 2026-10-30). The scan runs as the last
# job of .github/workflows/test.yml, where the coverage reports are, or in
# .github/workflows/sonarcloud.yml for a change the Tests workflow does not
# run for (scripts/sonar-scan-owner.py decides). .sonarcloud.properties is
# read only by Automatic Analysis, which is off; it matters again only if
# Automatic Analysis is turned back on. Both files carry the same exclusion
# lists — scripts/check-sonar-exclusions.py fails the scan if they differ.
sonar.organization=tradik
sonar.projectKey=tradik_mddb

# --- Python: analyze precisely for the versions we actually support ---------
# python-extension requires >=3.9; the Airbyte connector CI tests 3.12 & 3.13.
sonar.python.version=3.9, 3.10, 3.11, 3.12, 3.13

# --- Exclude third-party / generated / build artifacts (not our source) -----
# Analyzing vendored deps (phpstan.phar, node_modules), protobuf-generated Go,
# minified bundles and build output produces noise, not actionable findings.
# gqlgen output (graphql/generated.go, models_gen.go) is rewritten on every
# `go generate`, so its function names cannot be changed (go:S100). The
# WordPress test stubs must carry WordPress's exact function names
# (apply_filters, rest_ensure_response), which the naming rule (php:S100)
# flags. .sonarcloud.properties excludes the same files for Auto Analysis.
#
# .github/workflows/** — CI configuration. The rules that fire here
# (githubactions:S8541, seven on the first scanner run) want `--no-build` /
# `--only-binary :all:` and command-line version pins on the Python steps. The
# actual mitigation is in place and is stronger: both Python projects carry a
# committed uv.lock and CI installs with `uv sync --locked`, so every version
# comes from the lock and the run fails if the lock and pyproject.toml
# disagree. `--only-binary` cannot apply at all — the package being installed
# is this repository's own source, and an editable install has to run a build
# backend. Analysing workflow YAML for these rules produces findings with no
# available fix.
#
# tools/bench/** — a benchmark harness, already excluded from coverage. It
# fills a synthetic corpus with math/rand, and a cryptographic source would
# make the generator the thing being measured; its long table-driven report
# functions raised three go:S3776 findings on the first scanner run.
#
# **/testdata/** — test inputs, not code: converter fixtures (GO-046), image
# fixtures (RAG-010) and fuzz corpora. They are deliberately odd — an HTML page
# without a lang attribute, mail with CRLF line ends — and the reliability
# rules that fire on them (Web:S5254 on sample.html failed the 2.18.9 gate)
# describe the fixture, not a defect.
#
# The Airbyte connector's Python is not excluded here, unlike in
# .sonarcloud.properties: the scanner suppresses only the naming rules on it
# (see the per-rule exceptions below) and keeps every other rule running.
sonar.exclusions=\
  **/vendor/**,\
  services/mddbd/third_party/**,\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/coverage/**,\
  **/*.min.js,\
  **/*.pb.go,\
  services/mddbd/graphql/generated.go,\
  services/mddbd/graphql/models_gen.go,\
  integrations/wordpress-plugin/tests/stubs/**,\
  proto/**,\
  services/mddbd/proto/**,\
  services/mddb-chat/target/**,\
  **/*.phar,\
  .github/workflows/**,\
  tools/bench/**,\
  **/testdata/**

# --- Coverage ----------------------------------------------------------------
# The scan job in .github/workflows/test.yml hands the scanner the coverage of
# every suite that runs in that workflow (sonar.*.reportPaths are passed on
# its command line, because the reports exist only in CI):
#   Go      services/mddbd (merged shards), services/mddb-cli, clients/go/mddb
#   JS      services/mddb-panel (vitest, lcov), clients/nodejs (node --test)
#   Python  clients/python, integrations/langchain-mddb (pytest-cov)
#
# Tests, stubs, benchmarks and scripts are not measured. The rest of this list
# is code tested in its own workflow, with its own coverage floor; bringing
# those reports in would mean waiting on another workflow's run for the same
# commit, so the floor is enforced where the tests run instead:
#   integrations/wordpress-plugin    wordpress-plugin.yml   (PHPUnit, 90%)
#   integrations/chrome-extension    chrome-extension.yml   (Jest, 90%)
#   integrations/grafana-datasource  grafana-datasource.yml (Jest, 90%)
#   integrations/github-action       github-action.yml      (Jest, 90%)
#   integrations/airbyte-destination airbyte-destination.yml (pytest, 90%)
#   services/ssg-template            deploy-docs.yml        (node --test)
# and code with tests but no coverage tool in CI:
#   services/mddb-chat         Rust; `cargo test` in test.yml. A coverage
#                              build (cargo-llvm-cov) would compile the crate
#                              a second time on every run.
#   services/mddb-chat-widget  `node --test` suite, not yet run in CI.
#   services/php-extension, services/python-extension — thin example
#                              wrappers with a test file each, run by no job.
sonar.coverage.exclusions=\
  **/*_test.go,\
  **/__tests__/**,\
  **/tests/**,\
  **/stubs/**,\
  **/*.test.*,\
  **/*test*.php,\
  test/**,\
  tools/bench/**,\
  scripts/**,\
  integrations/wordpress-plugin/**,\
  integrations/chrome-extension/**,\
  integrations/grafana-datasource/**,\
  integrations/github-action/**,\
  integrations/airbyte-destination/**,\
  services/ssg-template/**,\
  services/mddb-chat/**,\
  services/mddb-chat-widget/**,\
  services/php-extension/**,\
  services/python-extension/**

# --- Duplication: the per-integration CI workflows are declarative YAML and
#     intentionally parallel (each pipeline stands alone for clarity), so they
#     should not count as copy-paste duplication.
#
#     services/mddbd/mcp_builtin_tools.go is a declarative registry: 81 MCP
#     tool schemas, no control flow. Every entry has the same shape because
#     that is what a schema table is, and with the gate at 3% duplicated new
#     lines a two-line edit to a tool description would fail the build. Only
#     copy-paste detection is off; every other rule runs on the file.
#
#     The same list is in .sonarcloud.properties (for Automatic Analysis, if
#     it is ever turned back on); scripts/check-sonar-exclusions.py keeps the
#     two equal. ---------------------------------------------------------------
sonar.cpd.exclusions=\
  .github/workflows/**,\
  **/*_test.go,\
  **/__tests__/**,\
  services/mddbd/mcp_builtin_tools.go

# --- Tests are lower-stakes: don't raise production-grade issues on them.
#     Test code legitimately uses patterns flagged as hotspots — `new Function`
#     to exercise a function under test, `http://` / `javascript:` strings to
#     assert they're REJECTED, reflection to reach privates, etc. Suppress
#     issue-raising on test files (coverage is still measured on production
#     code; real production findings are unaffected). ------------------------
# --- Per-rule exceptions ----------------------------------------------------
# sonar.issue.ignore.* is honoured by the scanner and NOT by Automatic
# Analysis; they apply since the scanner was switched on (OPS-021, 2026-10-30).
# ---------------------------------------------------------------------------
sonar.issue.ignore.multicriteria=tgo,tjs,tnode,tjsx,tphp,tpyt,tpy,ttests,tstubs,tbench,cpfile,ab100,ab116,ab117,ab1542
sonar.issue.ignore.multicriteria.tgo.ruleKey=*
sonar.issue.ignore.multicriteria.tgo.resourceKey=**/*_test.go

# copyFile() in util.go opens paths derived from request input, but EVERY caller
# first runs them through safeBackupPath() (rejects traversal, restricts dir) AND
# requires PermAdmin, and copyFile itself filepath.Clean's them. SonarCloud's taint
# analysis does not recognize safeBackupPath() as a sanitizer, so it raises a
# false-positive path-injection (gosecurity:S2083). Suppress that ONE rule for
# util.go only (the file's other helpers do no path I/O).
sonar.issue.ignore.multicriteria.cpfile.ruleKey=gosecurity:S2083
sonar.issue.ignore.multicriteria.cpfile.resourceKey=**/util.go
sonar.issue.ignore.multicriteria.tjs.ruleKey=*
sonar.issue.ignore.multicriteria.tjs.resourceKey=**/*.test.*
sonar.issue.ignore.multicriteria.tnode.ruleKey=*
sonar.issue.ignore.multicriteria.tnode.resourceKey=**/*.spec.*
sonar.issue.ignore.multicriteria.tjsx.ruleKey=*
sonar.issue.ignore.multicriteria.tjsx.resourceKey=**/__tests__/**
sonar.issue.ignore.multicriteria.tphp.ruleKey=*
sonar.issue.ignore.multicriteria.tphp.resourceKey=**/*Test.php
sonar.issue.ignore.multicriteria.tpyt.ruleKey=*
sonar.issue.ignore.multicriteria.tpyt.resourceKey=**/test_*.py
sonar.issue.ignore.multicriteria.tpy.ruleKey=*
sonar.issue.ignore.multicriteria.tpy.resourceKey=**/*_test.py
sonar.issue.ignore.multicriteria.ttests.ruleKey=*
sonar.issue.ignore.multicriteria.ttests.resourceKey=**/tests/**
sonar.issue.ignore.multicriteria.tstubs.ruleKey=*
sonar.issue.ignore.multicriteria.tstubs.resourceKey=**/stubs/**
sonar.issue.ignore.multicriteria.tbench.ruleKey=*
sonar.issue.ignore.multicriteria.tbench.resourceKey=test/**

# The Airbyte connector follows the project's camelCase standard (CLAUDE.md);
# SonarCloud's default Python profile enforces PEP 8 snake_case through these
# four naming rules. The connector is tested by airbyte-destination.yml
# (pytest, 90% floor). .sonarcloud.properties excludes the whole directory,
# because Automatic Analysis has no per-rule lever; here only naming is off.
sonar.issue.ignore.multicriteria.ab100.ruleKey=python:S100
sonar.issue.ignore.multicriteria.ab100.resourceKey=integrations/airbyte-destination/**/*.py
sonar.issue.ignore.multicriteria.ab116.ruleKey=python:S116
sonar.issue.ignore.multicriteria.ab116.resourceKey=integrations/airbyte-destination/**/*.py
sonar.issue.ignore.multicriteria.ab117.ruleKey=python:S117
sonar.issue.ignore.multicriteria.ab117.resourceKey=integrations/airbyte-destination/**/*.py
sonar.issue.ignore.multicriteria.ab1542.ruleKey=python:S1542
sonar.issue.ignore.multicriteria.ab1542.resourceKey=integrations/airbyte-destination/**/*.py
