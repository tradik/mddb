# SonarQube Cloud (SonarCloud) analysis configuration, read by the
# sonar-scanner job in .github/workflows/sonarcloud.yml (OPS-021). While the
# project still uses Automatic Analysis, .sonarcloud.properties applies instead.
sonar.organization=tradik
sonar.projectKey=tradik_mddb

# --- Python: analyze precisely for the versions we actually support ---------
# python-extension requires >=3.9; the Airbyte connector CI tests 3.12 & 3.13.
sonar.python.version=3.9, 3.10, 3.11, 3.12, 3.13

# --- Exclude third-party / generated / build artifacts (not our source) -----
# Analyzing vendored deps (phpstan.phar, node_modules), protobuf-generated Go,
# minified bundles and build output produces noise, not actionable findings.
# gqlgen output (graphql/generated.go, models_gen.go) is rewritten on every
# `go generate`, so its function names cannot be changed (go:S100). The
# WordPress test stubs must carry WordPress's exact function names
# (apply_filters, rest_ensure_response), which the naming rule (php:S100)
# flags. .sonarcloud.properties excludes the same files for Auto Analysis.
sonar.exclusions=\
  **/vendor/**,\
  services/mddbd/third_party/**,\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/coverage/**,\
  **/*.min.js,\
  **/*.pb.go,\
  services/mddbd/graphql/generated.go,\
  services/mddbd/graphql/models_gen.go,\
  integrations/wordpress-plugin/tests/stubs/**,\
  proto/**,\
  services/mddbd/proto/**,\
  services/mddb-chat/target/**,\
  **/*.phar

# --- Coverage: don't measure coverage on tests, stubs, and benchmarks -------
sonar.coverage.exclusions=\
  **/*_test.go,\
  **/__tests__/**,\
  **/tests/**,\
  **/stubs/**,\
  **/*.test.*,\
  **/*test*.php,\
  test/**,\
  tools/bench/**,\
  scripts/**

# --- Duplication: the per-integration CI workflows are declarative YAML and
#     intentionally parallel (each pipeline stands alone for clarity), so they
#     should not count as copy-paste duplication.
#
#     Applied by the scanner job; under Automatic Analysis the list in
#     .sonarcloud.properties applies instead. Keep the two in step until the
#     scanner is switched on (OPS-021). ------------------------------------
sonar.cpd.exclusions=\
  .github/workflows/**,\
  **/*_test.go,\
  **/__tests__/**

# --- Tests are lower-stakes: don't raise production-grade issues on them.
#     Test code legitimately uses patterns flagged as hotspots — `new Function`
#     to exercise a function under test, `http://` / `javascript:` strings to
#     assert they're REJECTED, reflection to reach privates, etc. Suppress
#     issue-raising on test files (coverage is still measured on production
#     code; real production findings are unaffected). ------------------------
# --- Per-rule exceptions ----------------------------------------------------
# sonar.issue.ignore.* is honoured by the sonar-scanner job
# (.github/workflows/sonarcloud.yml) and NOT by Automatic Analysis. They take
# effect once the owner adds SONAR_TOKEN and turns Automatic Analysis off
# (OPS-021); the gosecurity:S2083 finding in util.go disappearing is the sign.
# ---------------------------------------------------------------------------
sonar.issue.ignore.multicriteria=tgo,tjs,tnode,tjsx,tphp,tpyt,tpy,ttests,tstubs,tbench,cpfile
sonar.issue.ignore.multicriteria.tgo.ruleKey=*
sonar.issue.ignore.multicriteria.tgo.resourceKey=**/*_test.go

# copyFile() in util.go opens paths derived from request input, but EVERY caller
# first runs them through safeBackupPath() (rejects traversal, restricts dir) AND
# requires PermAdmin, and copyFile itself filepath.Clean's them. SonarCloud's taint
# analysis does not recognize safeBackupPath() as a sanitizer, so it raises a
# false-positive path-injection (gosecurity:S2083). Suppress that ONE rule for
# util.go only (the file's other helpers do no path I/O).
sonar.issue.ignore.multicriteria.cpfile.ruleKey=gosecurity:S2083
sonar.issue.ignore.multicriteria.cpfile.resourceKey=**/util.go
sonar.issue.ignore.multicriteria.tjs.ruleKey=*
sonar.issue.ignore.multicriteria.tjs.resourceKey=**/*.test.*
sonar.issue.ignore.multicriteria.tnode.ruleKey=*
sonar.issue.ignore.multicriteria.tnode.resourceKey=**/*.spec.*
sonar.issue.ignore.multicriteria.tjsx.ruleKey=*
sonar.issue.ignore.multicriteria.tjsx.resourceKey=**/__tests__/**
sonar.issue.ignore.multicriteria.tphp.ruleKey=*
sonar.issue.ignore.multicriteria.tphp.resourceKey=**/*Test.php
sonar.issue.ignore.multicriteria.tpyt.ruleKey=*
sonar.issue.ignore.multicriteria.tpyt.resourceKey=**/test_*.py
sonar.issue.ignore.multicriteria.tpy.ruleKey=*
sonar.issue.ignore.multicriteria.tpy.resourceKey=**/*_test.py
sonar.issue.ignore.multicriteria.ttests.ruleKey=*
sonar.issue.ignore.multicriteria.ttests.resourceKey=**/tests/**
sonar.issue.ignore.multicriteria.tstubs.ruleKey=*
sonar.issue.ignore.multicriteria.tstubs.resourceKey=**/stubs/**
sonar.issue.ignore.multicriteria.tbench.ruleKey=*
sonar.issue.ignore.multicriteria.tbench.resourceKey=test/**



