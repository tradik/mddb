syntax = "proto3";

package mddb;

option go_package = "mddb/proto";

// MDDB Service - gRPC API for Markdown Database
service MDDB {
  // Add or update a document
  rpc Add(AddRequest) returns (Document);
  
  // Add or update multiple documents in a single transaction (batch)
  rpc AddBatch(AddBatchRequest) returns (AddBatchResponse);
  
  // Delete multiple documents in a single transaction (batch)
  rpc DeleteBatch(DeleteBatchRequest) returns (DeleteBatchResponse);
  
  // Update multiple documents in a single transaction (batch)
  rpc UpdateBatch(UpdateBatchRequest) returns (UpdateBatchResponse);
  
  // Get a document by key and language
  rpc Get(GetRequest) returns (Document);
  
  // Search documents with filters
  rpc Search(SearchRequest) returns (SearchResponse);
  
  // Export documents (streaming)
  rpc Export(ExportRequest) returns (stream ExportChunk);
  
  // Create database backup
  rpc Backup(BackupRequest) returns (BackupResponse);
  
  // Restore database from backup
  rpc Restore(RestoreRequest) returns (RestoreResponse);
  
  // Truncate revision history
  rpc Truncate(TruncateRequest) returns (TruncateResponse);
  
  // Get server statistics
  rpc Stats(StatsRequest) returns (StatsResponse);

  // Vector/semantic search using embeddings
  rpc VectorSearch(VectorSearchRequest) returns (VectorSearchResponse);

  // Reindex embeddings for a collection
  rpc VectorReindex(VectorReindexRequest) returns (VectorReindexResponse);

  // Get vector/embedding statistics
  rpc VectorStats(VectorStatsRequest) returns (VectorStatsResponse);

  // Geo search: documents within N meters of a (lat, lng) point
  rpc GeoSearch(GeoSearchRequest) returns (GeoSearchResponse);

  // Geo within: documents inside an axis-aligned bounding box
  rpc GeoWithin(GeoWithinRequest) returns (GeoWithinResponse);

  // Force-rebuild the in-memory geo R-tree from BoltDB
  rpc GeoReindex(GeoReindexRequest) returns (GeoReindexResponse);

  // Geo index statistics
  rpc GeoStats(GeoStatsRequest) returns (GeoStatsResponse);

  // Encode a (lat, lng) pair into a geohash string
  rpc GeoEncode(GeoEncodeRequest) returns (GeoEncodeResponse);

  // Decode a geohash back to (lat, lng) centroid + bbox
  rpc GeoDecode(GeoDecodeRequest) returns (GeoDecodeResponse);

  // Import document from URL
  rpc ImportURL(ImportURLRequest) returns (Document);

  // Set TTL on a document
  rpc SetTTL(SetTTLRequest) returns (Document);

  // Full-text search
  rpc FTS(FTSRequest) returns (FTSResponse);

  // Reindex FTS for a collection (re-applies language-aware stemming)
  rpc FTSReindex(FTSReindexRequest) returns (FTSReindexResponse);

  // List supported FTS languages
  rpc FTSLanguages(FTSLanguagesRequest) returns (FTSLanguagesResponse);

  // Hybrid search (combines FTS + vector search)
  rpc HybridSearch(HybridSearchRequest) returns (HybridSearchResponse);

  // Register a webhook
  rpc RegisterWebhook(RegisterWebhookRequest) returns (WebhookProto);

  // List webhooks
  rpc ListWebhooks(ListWebhooksRequest) returns (ListWebhooksResponse);

  // Delete a webhook
  rpc DeleteWebhook(DeleteWebhookRequest) returns (DeleteWebhookResponse);

  // Set JSON Schema for a collection's metadata validation
  rpc SetSchema(SetSchemaRequest) returns (SetSchemaResponse);

  // Get JSON Schema for a collection
  rpc GetSchema(GetSchemaRequest) returns (GetSchemaResponse);

  // Delete JSON Schema for a collection (disables validation)
  rpc DeleteSchema(DeleteSchemaRequest) returns (DeleteSchemaResponse);

  // List all collection schemas
  rpc ListSchemas(ListSchemasRequest) returns (ListSchemasResponse);

  // Validate document metadata against collection schema
  rpc ValidateDocument(ValidateDocumentRequest) returns (ValidateDocumentResponse);

  // Partial document update (meta and/or content independently)
  rpc UpdateDocument(UpdateDocumentRequest) returns (Document);

  // Get document metadata only (without content)
  rpc GetDocumentMeta(GetDocumentMetaRequest) returns (GetDocumentMetaResponse);

  // Zero-shot document classification using embedding similarity
  rpc Classify(ClassifyRequest) returns (ClassifyResponse);

  // Delete a single document
  rpc DeleteDocument(DeleteDocumentRequest) returns (DeleteDocumentResponse);

  // Delete an entire collection
  rpc DeleteCollection(DeleteCollectionRequest) returns (DeleteCollectionResponse);

  // List synonyms for a collection
  rpc ListSynonyms(ListSynonymsRequest) returns (ListSynonymsResponse);

  // Add a synonym mapping
  rpc AddSynonym(AddSynonymRequest) returns (AddSynonymResponse);

  // Delete a synonym mapping
  rpc DeleteSynonym(DeleteSynonymRequest) returns (DeleteSynonymResponse);

  // List stop words for a collection
  rpc ListStopwords(ListStopwordsRequest) returns (ListStopwordsResponse);

  // Add custom stop words
  rpc AddStopwords(AddStopwordsRequest) returns (AddStopwordsResponse);

  // Delete custom stop words
  rpc DeleteStopwords(DeleteStopwordsRequest) returns (DeleteStopwordsResponse);

  // Get all unique metadata keys and values for a collection
  rpc GetMetaKeys(GetMetaKeysRequest) returns (GetMetaKeysResponse);

  // Get collection checksum (integrity hash)
  rpc GetChecksum(GetChecksumRequest) returns (GetChecksumResponse);

  // List automation rules
  rpc ListAutomation(ListAutomationRequest) returns (ListAutomationResponse);

  // Create an automation rule
  rpc CreateAutomation(CreateAutomationRequest) returns (AutomationRuleProto);

  // Get an automation rule by ID
  rpc GetAutomation(GetAutomationRequest) returns (AutomationRuleProto);

  // Update an automation rule
  rpc UpdateAutomation(UpdateAutomationRequest) returns (AutomationRuleProto);

  // Delete an automation rule
  rpc DeleteAutomation(DeleteAutomationRequest) returns (DeleteAutomationResponse);

  // Test an automation trigger (dry run)
  rpc TestAutomation(TestAutomationRequest) returns (TestAutomationResponse);

  // Get automation execution logs
  rpc GetAutomationLogs(GetAutomationLogsRequest) returns (GetAutomationLogsResponse);

  // Get collection configuration
  rpc GetCollectionConfig(GetCollectionConfigRequest) returns (GetCollectionConfigResponse);

  // Set collection configuration
  rpc SetCollectionConfig(SetCollectionConfigRequest) returns (SetCollectionConfigResponse);

  // List all collection configurations
  rpc ListCollectionConfigs(ListCollectionConfigsRequest) returns (ListCollectionConfigsResponse);

  // Cross-collection vector search
  rpc CrossSearch(CrossSearchRequest) returns (CrossSearchResponse);

  // Find duplicate documents in a collection
  rpc FindDuplicates(FindDuplicatesRequest) returns (FindDuplicatesResponse);

  // Bulk ingest documents with URL key derivation, frontmatter extraction, and deduplication
  rpc Ingest(IngestRequest) returns (IngestResponse);

  // List revision history for a document
  rpc ListRevisions(ListRevisionsRequest) returns (ListRevisionsResponse);

  // Restore a document from a specific revision
  rpc RestoreRevision(RestoreRevisionRequest) returns (Document);

  // Query temporal events for a specific document
  rpc TemporalQuery(TemporalQueryRequest) returns (TemporalQueryResponse);

  // Get hot (most accessed) documents in a collection
  rpc TemporalHot(TemporalHotRequest) returns (TemporalHotResponse);

  // Get spell correction suggestions for a text string
  rpc SpellSuggest(SpellSuggestRequest) returns (SpellSuggestResponse);

  // Apply best spell corrections to a text string
  rpc SpellCleanup(SpellCleanupRequest) returns (SpellCleanupResponse);

  // (v2.9.14+) Curation: list rules scoped to a collection (or all)
  rpc ListCurationRules(ListCurationRulesRequest) returns (ListCurationRulesResponse);

  // (v2.9.14+) Curation: create a new rule
  rpc CreateCurationRule(CreateCurationRuleRequest) returns (CurationRuleProto);

  // (v2.9.14+) Curation: replace an existing rule by id
  rpc UpdateCurationRule(UpdateCurationRuleRequest) returns (CurationRuleProto);

  // (v2.9.14+) Curation: remove a rule by id
  rpc DeleteCurationRule(DeleteCurationRuleRequest) returns (DeleteCurationRuleResponse);
}

// Document represents a markdown document
message Document {
  string id = 1;
  string key = 2;
  string lang = 3;
  map<string, MetaValues> meta = 4;
  string content_md = 5;
  int64 added_at = 6;
  int64 updated_at = 7;
  int64 expires_at = 8;
}

// MetaValues holds multiple values for a metadata key
message MetaValues {
  repeated string values = 1;
}

// Add/Update document request
message AddRequest {
  string collection = 1;
  string key = 2;
  string lang = 3;
  map<string, MetaValues> meta = 4;
  string content_md = 5;
  bool save_revision = 6;  // Optional: save revision history (default: false)
  int64 ttl = 7;           // Optional: time-to-live in seconds (0 = no expiry)
}

// Batch add request
message AddBatchRequest {
  string collection = 1;
  repeated BatchDocument documents = 2;
}

// Document for batch operations
message BatchDocument {
  string key = 1;
  string lang = 2;
  map<string, MetaValues> meta = 3;
  string content_md = 4;
  bool save_revision = 5;  // Optional: save revision history (default: false)
}

// Batch add response
message AddBatchResponse {
  int32 added = 1;
  int32 updated = 2;
  int32 failed = 3;
  repeated string errors = 4; // Error messages for failed documents
}

// Get document request
message GetRequest {
  string collection = 1;
  string key = 2;
  string lang = 3;
  map<string, string> env = 4; // Template variables
}

// Search request
message SearchRequest {
  string collection = 1;
  map<string, MetaValues> filter_meta = 2;
  string sort = 3; // addedAt, updatedAt, key
  bool asc = 4;
  int32 limit = 5;
  int32 offset = 6;
}

// Search response
message SearchResponse {
  repeated Document documents = 1;
  int32 total = 2;
}

// Export request
message ExportRequest {
  string collection = 1;
  map<string, MetaValues> filter_meta = 2;
  string format = 3; // ndjson, zip
}

// Export chunk (streaming)
message ExportChunk {
  bytes data = 1;
  bool is_last = 2;
}

// Backup request
message BackupRequest {
  string to = 1; // Backup filename
}

// Backup response
message BackupResponse {
  string backup = 1;
}

// Restore request
message RestoreRequest {
  string from = 1; // Backup filename
}

// Restore response
message RestoreResponse {
  string restored = 1;
}

// Truncate request
message TruncateRequest {
  string collection = 1;
  int32 keep_revs = 2;
  bool drop_cache = 3;
}

// Truncate response
message TruncateResponse {
  string status = 1;
}

// Stats request
message StatsRequest {
  // Empty - no parameters needed
}

// Stats response
message StatsResponse {
  string database_path = 1;
  int64 database_size = 2;
  string mode = 3;
  repeated CollectionStats collections = 4;
  int32 total_documents = 5;
  int32 total_revisions = 6;
  int32 total_meta_indices = 7;
}

// Collection statistics
message CollectionStats {
  string name = 1;
  int32 document_count = 2;
  int32 revision_count = 3;
  int32 meta_index_count = 4;
}

// Delete batch request
message DeleteBatchRequest {
  string collection = 1;
  repeated DeleteDocument documents = 2;
}

// Document to delete
message DeleteDocument {
  string key = 1;
  string lang = 2;
}

// Delete batch response
message DeleteBatchResponse {
  int32 deleted = 1;
  int32 not_found = 2;
  int32 failed = 3;
  repeated string errors = 4;
}

// Update batch request
message UpdateBatchRequest {
  string collection = 1;
  repeated UpdateDocument documents = 2;
}

// Document to update
message UpdateDocument {
  string key = 1;
  string lang = 2;
  map<string, MetaValues> meta = 3;
  string content_md = 4;
  bool save_revision = 5;
}

// Update batch response
message UpdateBatchResponse {
  int32 updated = 1;
  int32 not_found = 2;
  int32 failed = 3;
  repeated string errors = 4;
}

// --- Vector search messages ---

// Vector search request
message VectorSearchRequest {
  string collection = 1;
  string query = 2;                              // text query (will be embedded server-side)
  repeated float query_vector = 3;               // OR pre-computed vector
  int32 top_k = 4;                               // number of results (default: 5)
  double threshold = 5;                          // minimum similarity 0-1 (default: 0.0)
  map<string, MetaValues> filter_meta = 6;       // optional metadata pre-filter
  bool include_content = 7;                      // include full content_md in results
  string algorithm = 8;                          // "flat" (default), "hnsw", "ivf", "pq", "opq", "sq", "bq"
}

// Vector search result
message VectorSearchResult {
  Document document = 1;
  float score = 2;
  int32 rank = 3;
}

// Vector search response
message VectorSearchResponse {
  repeated VectorSearchResult results = 1;
  int32 total = 2;
  string model = 3;
  int32 dimensions = 4;
  string algorithm = 5;                          // algorithm used for this search
}

// Vector reindex request
message VectorReindexRequest {
  string collection = 1;
  bool force = 2;  // re-embed even if content hash matches
}

// Vector reindex response
message VectorReindexResponse {
  int32 embedded = 1;
  int32 skipped = 2;
  int32 failed = 3;
  repeated string errors = 4;
}

// Vector stats request
message VectorStatsRequest {}

// Vector stats response
message VectorStatsResponse {
  string provider = 1;
  string model = 2;
  int32 dimensions = 3;
  bool enabled = 4;
  map<string, VectorCollectionStats> collections = 5;
}

// Vector collection stats
message VectorCollectionStats {
  int32 total_documents = 1;
  int32 embedded_documents = 2;
  int32 stale_embeddings = 3;
}

// --- Import URL ---

message ImportURLRequest {
  string collection = 1;
  string url = 2;
  string key = 3;           // optional: derived from URL if empty
  string lang = 4;
  map<string, MetaValues> meta = 5;
  int64 ttl = 6;
}

// --- TTL ---

message SetTTLRequest {
  string collection = 1;
  string key = 2;
  string lang = 3;
  int64 ttl = 4;  // seconds; 0 = remove TTL
}

// --- Full-text search ---

message FTSRequest {
  string collection = 1;
  string query = 2;
  int32 limit = 3;
  string algorithm = 4;                          // "tfidf" (default) or "bm25"
  int32 fuzzy = 5;                               // typo tolerance: 0 (off), 1 (1 edit), 2 (2 edits)
  map<string, MetaValues> filter_meta = 6;       // optional metadata pre-filter
  string lang = 7;                               // language for stemming/stop words (default: server default)
  map<string, double> boost = 8;                 // per-query boost: "metaKey:metaValue" → multiplier (positive boosts, negative demotes)
  repeated string facet_by = 9;                  // (v2.9.14+) meta keys to aggregate into response.facets
  int32 facet_max_values = 10;                   // (v2.9.14+) cap per-key bucket count (0 = unlimited)
}

message FTSResult {
  Document document = 1;
  double score = 2;
  repeated string matched_terms = 3;
  bool pinned = 4;                               // (v2.9.14+) this row was injected by a curation rule
}

// FacetBucketProto is one value bucket inside a facet — reused by
// FTS, HybridSearch and Aggregate.
message FacetBucketProto {
  string value = 1;
  int32 count = 2;
}

message FacetBucketList {
  repeated FacetBucketProto buckets = 1;
}

message FTSResponse {
  repeated FTSResult results = 1;
  int32 total = 2;
  string algorithm = 3;                          // algorithm used for this search
  int32 fuzzy = 4;                               // typo tolerance level used
  string lang = 5;                               // language used for tokenization
  map<string, FacetBucketList> facets = 6;       // (v2.9.14+) per-key facet counts
}

// --- FTS reindex ---

message FTSReindexRequest {
  string collection = 1;                         // collection to reindex
}

message FTSReindexResponse {
  string status = 1;                             // "ok"
  int32 reindexed = 2;                           // number of documents reindexed
  int32 skipped = 3;                             // number of documents skipped
}

// --- FTS languages ---

message FTSLanguagesRequest {}

message FTSLanguageInfo {
  string code = 1;                               // language code, e.g. "en", "pl"
  string name = 2;                               // language name, e.g. "English", "Polish"
}

message FTSLanguagesResponse {
  repeated FTSLanguageInfo languages = 1;
  string default_lang = 2;                       // server's default language
}

// --- Hybrid search ---

// Hybrid search request - combines FTS and vector search
message HybridSearchRequest {
  string collection = 1;
  string query = 2;
  int32 top_k = 3;
  string algorithm = 4;                          // FTS algorithm: "bm25" (default), "bm25f"
  string vector_algorithm = 5;                   // vector algorithm: "flat" (default), "hnsw", "ivf", "pq", "opq", "sq", "bq"
  double alpha = 6;                              // weight for alpha blending: 0=keyword only, 1=semantic only
  string strategy = 7;                           // "alpha" (default) or "rrf"
  int32 rrf_k = 8;                               // RRF parameter k (default 60)
  int32 fuzzy = 9;
  double threshold = 10;
  map<string, MetaValues> filter_meta = 11;
  bool include_content = 12;
  map<string, double> field_weights = 13;
  string lang = 14;                              // language for FTS stemming/stop words
  map<string, double> boost = 15;                // per-query boost: "metaKey:metaValue" → multiplier (positive boosts, negative demotes)
  string sort = 16;                              // result ordering: "" or "combined" (default, by fused score), or "distance" (by distanceMeters asc — requires geo filter)
  repeated string facet_by = 17;                 // (v2.9.14+) meta keys to aggregate
  int32 facet_max_values = 18;                   // (v2.9.14+) cap per-key bucket count (0 = unlimited)
}

message HybridSearchResult {
  Document document = 1;
  double combined_score = 2;
  double fts_score = 3;
  double vector_score = 4;
  repeated string matched_terms = 5;
  int32 rank = 6;
  bool pinned = 7;                               // (v2.9.14+) injected by a curation rule
}

message HybridSearchResponse {
  repeated HybridSearchResult results = 1;
  int32 total = 2;
  string strategy = 3;
  string fts_algorithm = 4;
  string vector_algorithm = 5;
  map<string, FacetBucketList> facets = 6;       // (v2.9.14+)
}

// --- Webhooks ---

message WebhookProto {
  string id = 1;
  string url = 2;
  repeated string events = 3;
  string collection = 4;
  int64 created_at = 5;
}

message RegisterWebhookRequest {
  string url = 1;
  repeated string events = 2;
  string collection = 3;
}

message ListWebhooksRequest {}

message ListWebhooksResponse {
  repeated WebhookProto webhooks = 1;
}

message DeleteWebhookRequest {
  string id = 1;
}

message DeleteWebhookResponse {
  string status = 1;
  string id = 2;
}

// --- Schema Validation ---

message SetSchemaRequest {
  string collection = 1;
  string schema = 2;  // JSON Schema string
}

message SetSchemaResponse {
  string status = 1;
}

message GetSchemaRequest {
  string collection = 1;
}

message GetSchemaResponse {
  string collection = 1;
  string schema = 2;
  bool enabled = 3;
}

message DeleteSchemaRequest {
  string collection = 1;
}

message DeleteSchemaResponse {
  string status = 1;
}

message ListSchemasRequest {}

message ListSchemasResponse {
  repeated SchemaInfo schemas = 1;
}

message SchemaInfo {
  string collection = 1;
  string schema = 2;
}

message ValidateDocumentRequest {
  string collection = 1;
  map<string, MetaValues> meta = 2;
}

message ValidateDocumentResponse {
  bool valid = 1;
  repeated string errors = 2;
  // Advisory findings that do not fail validation (DOC-012). Today: metadata
  // values that look like a structure lost on the way in — Go's `%v` rendering
  // of a map or a list of maps. A warning, never an error: rejecting the value
  // would break every caller legitimately storing text that looks like this.
  repeated string warnings = 3;
}

// --- Partial Update ---

message UpdateDocumentRequest {
  string collection = 1;
  string key = 2;
  string lang = 3;
  map<string, MetaValues> meta = 4;
  string content_md = 5;
  int64 ttl = 6;
  bool update_meta = 7;     // explicit flag: should meta be updated?
  bool update_content = 8;  // explicit flag: should content be updated?
  bool update_ttl = 9;      // explicit flag: should TTL be updated?
}

message GetDocumentMetaRequest {
  string collection = 1;
  string key = 2;
  string lang = 3;
}

message GetDocumentMetaResponse {
  string key = 1;
  string lang = 2;
  map<string, MetaValues> meta = 3;
  int64 added_at = 4;
  int64 updated_at = 5;
  int64 expires_at = 6;
}

// --- Zero-shot Classification ---

message ClassifyRequest {
  string collection = 1;          // Collection name (for doc reference)
  string key = 2;                 // Document key (for doc reference)
  string lang = 3;                // Language code (for doc reference)
  string text = 4;                // Raw text to classify (alternative to doc reference)
  repeated string labels = 5;     // Candidate labels (required)
  int32 top_k = 6;                // Return top K labels (0 = all)
  bool multi = 7;                 // If true, return all labels above threshold
  double threshold = 8;           // Minimum similarity score (default: 0.0)
}

message ClassifyLabelScore {
  string label = 1;
  double score = 2;
}

message ClassifyResponse {
  repeated ClassifyLabelScore results = 1;
  string model = 2;               // Embedding model used
  int32 dimensions = 3;           // Embedding dimensions
}

// --- Delete Document ---

message DeleteDocumentRequest {
  string collection = 1;
  string key = 2;
  string lang = 3;
}

message DeleteDocumentResponse {
  string status = 1;
  string collection = 2;
  string key = 3;
  string lang = 4;
}

// --- Delete Collection ---

message DeleteCollectionRequest {
  string collection = 1;
}

message DeleteCollectionResponse {
  string status = 1;
  string collection = 2;
  int32 deleted_count = 3;
}

// --- Synonyms ---

message SynonymEntry {
  string term = 1;
  repeated string synonyms = 2;
}

message ListSynonymsRequest {
  string collection = 1;
}

message ListSynonymsResponse {
  string collection = 1;
  repeated SynonymEntry entries = 2;
  int32 total = 3;
}

message AddSynonymRequest {
  string collection = 1;
  string term = 2;
  repeated string synonyms = 3;
}

message AddSynonymResponse {
  string status = 1;
}

message DeleteSynonymRequest {
  string collection = 1;
  string term = 2;
}

message DeleteSynonymResponse {
  string status = 1;
}

// --- Stopwords ---

message StopwordEntry {
  string word = 1;
  bool is_default = 2;
}

message ListStopwordsRequest {
  string collection = 1;
}

message ListStopwordsResponse {
  string collection = 1;
  repeated StopwordEntry entries = 2;
  int32 total = 3;
  int32 defaults = 4;
  int32 custom = 5;
}

message AddStopwordsRequest {
  string collection = 1;
  repeated string words = 2;
}

message AddStopwordsResponse {
  string status = 1;
  int32 added = 2;
}

message DeleteStopwordsRequest {
  string collection = 1;
  repeated string words = 2;
}

message DeleteStopwordsResponse {
  string status = 1;
  int32 deleted = 2;
  repeated string errors = 3;
}

// --- Meta Keys ---

message GetMetaKeysRequest {
  string collection = 1;
}

message GetMetaKeysResponse {
  map<string, MetaValues> meta = 1;
}

// --- Checksum ---

message GetChecksumRequest {
  string collection = 1;
}

message GetChecksumResponse {
  string collection = 1;
  string checksum = 2;
  int32 document_count = 3;
}

// --- Automation ---

message AutomationRuleProto {
  string id = 1;
  string type = 2;            // "webhook", "trigger", "cron"
  string name = 3;
  bool enabled = 4;
  int64 created_at = 5;
  int64 updated_at = 6;
  // Webhook fields
  string url = 7;
  string method = 8;
  map<string, string> headers = 9;
  // Trigger fields
  string collection = 10;
  string search_type = 11;     // "fts", "vector", "hybrid"
  string query = 12;
  double threshold = 13;
  string webhook_id = 14;
  string search_params_json = 15; // JSON-encoded extra params
  repeated string events = 16;
  bool sentiment_enabled = 17;
  double sentiment_min = 18;
  double sentiment_max = 19;
  string condition_logic = 20; // "and", "or"
  // Cron fields
  string schedule = 21;
  string trigger_id = 22;
  int64 last_run = 23;
  int64 next_run = 24;
}

message ListAutomationRequest {
  string type = 1; // optional filter: "trigger", "cron", "webhook"
}

message ListAutomationResponse {
  repeated AutomationRuleProto rules = 1;
  int32 total = 2;
}

message CreateAutomationRequest {
  AutomationRuleProto rule = 1;
}

message GetAutomationRequest {
  string id = 1;
}

message UpdateAutomationRequest {
  string id = 1;
  AutomationRuleProto rule = 2;
}

message DeleteAutomationResponse {
  string status = 1;
  string id = 2;
}

message DeleteAutomationRequest {
  string id = 1;
}

message TestAutomationRequest {
  string id = 1;
}

message TestAutomationResponse {
  AutomationRuleProto trigger = 1;
  repeated Document matches = 2;
  int32 total = 3;
}

message AutomationLogEntryProto {
  string id = 1;
  int64 timestamp = 2;
  string rule_id = 3;
  string rule_name = 4;
  string rule_type = 5;
  string webhook_id = 6;
  string webhook_url = 7;
  string status = 8;
  int32 http_status = 9;
  int64 duration_ms = 10;
  string error = 11;
  int32 attempt = 12;
}

message GetAutomationLogsRequest {
  int32 limit = 1;
  string cursor = 2;
  string rule_id = 3;
  string status = 4;
}

message GetAutomationLogsResponse {
  repeated AutomationLogEntryProto logs = 1;
  int32 total = 2;
  string next_cursor = 3;
  bool has_more = 4;
}

// --- Collection Config ---

// RetrievalProfileProto is a collection's retrieval defaults (RAG-001).
//
// Every field is optional and an unset field means "not configured", so the
// caller's request parameter or MDDB's global default applies. Precedence is
// fixed: request parameter > collection profile > global default.
message RetrievalProfileProto {
  string default_search_type = 1;   // fts|vector|hybrid
  int32 top_k = 2;
  string retrieval_mode = 3;        // parent|chunk|window
  string hybrid_strategy = 4;       // alpha|rrf
  double hybrid_alpha = 5;          // 0.0-1.0; see hybrid_alpha_set
  // hybrid_alpha 0.0 is a meaningful weight (pure keyword), so it cannot
  // double as "unset" — this says whether the value above was configured.
  bool hybrid_alpha_set = 6;
  int32 context_token_budget = 7;   // cap on total returned context, in tokens
}

// NOTE (RAG-001): this message knows only 6 of CollectionConfig's ~15 fields.
// storage_backend, storage_config, quantization, disk_only_vectors, encrypted,
// track_access, track_hot, spell_correct, spell_lang and wordpress exist over
// REST and are invisible over gRPC — a gRPC client cannot read or write them.
// Tracked separately; retrieval is added here because RAG-001 needs it.
message CollectionConfigProto {
  string type = 1;
  string description = 2;
  string icon = 3;
  string color = 4;
  map<string, string> custom_meta = 5;
  int32 max_revisions = 6;                       // (v2.9.14+) per-collection revision cap; 0 = unlimited
  RetrievalProfileProto retrieval = 7;           // (v2.12.0+) per-collection retrieval defaults
  string response_prompt = 8;                    // (v2.12.0+) how to format answers from this collection (RAG-002); max 4 KiB
}

message GetCollectionConfigRequest {
  string collection = 1;
}

message GetCollectionConfigResponse {
  string collection = 1;
  CollectionConfigProto config = 2;
  bool configured = 3;
}

message SetCollectionConfigRequest {
  string collection = 1;
  string type = 2;
  string description = 3;
  string icon = 4;
  string color = 5;
  map<string, string> custom_meta = 6;
  int32 max_revisions = 7;                       // (v2.9.14+) per-collection revision cap; 0 = unlimited
  RetrievalProfileProto retrieval = 8;           // (v2.12.0+) per-collection retrieval defaults
  string response_prompt = 9;                    // (v2.12.0+) how to format answers from this collection (RAG-002)
}

message SetCollectionConfigResponse {
  string status = 1;
  string collection = 2;
}

message ListCollectionConfigsRequest {}

message CollectionConfigEntry {
  string collection = 1;
  CollectionConfigProto config = 2;
}

message ListCollectionConfigsResponse {
  repeated CollectionConfigEntry configs = 1;
  int32 total = 2;
}

// --- Cross Search ---

message CrossSearchRequest {
  string source_collection = 1;
  string source_doc_id = 2;
  string query = 3;
  repeated float query_vector = 4;
  repeated string target_collections = 5;
  int32 top_k = 6;
  double threshold = 7;
  string algorithm = 8;
  string distance_metric = 9;
  map<string, MetaValues> filter_meta = 10;
  bool include_content = 11;
}

message CrossSearchResultItem {
  string collection = 1;
  Document document = 2;
  float score = 3;
  int32 rank = 4;
}

message CrossSearchResponse {
  repeated CrossSearchResultItem results = 1;
  int32 total = 2;
  string source_collection = 3;
  string source_doc_id = 4;
  repeated string target_collections = 5;
  string algorithm = 6;
  string distance_metric = 7;
}

// --- Find Duplicates ---

message FindDuplicatesRequest {
  string collection = 1;
  string mode = 2;              // "exact", "similar", "both" (default)
  double threshold = 3;         // 0.9 default
  int32 max_docs = 4;           // 5000 default
  string distance_metric = 5;   // "cosine" default
  bool include_content = 6;
}

message DuplicateDocInfoProto {
  string doc_id = 1;
  string key = 2;
  string content_hash = 3;
  string content_md = 4;
  float score = 5;
}

message DuplicateGroupProto {
  int32 group_id = 1;
  string type = 2;              // "exact" or "similar"
  repeated DuplicateDocInfoProto documents = 3;
  float score = 4;
}

message FindDuplicatesResponse {
  string collection = 1;
  string mode = 2;
  double threshold = 3;
  string distance_metric = 4;
  int32 total_documents = 5;
  int32 total_embedded = 6;
  repeated DuplicateGroupProto exact_groups = 7;
  repeated DuplicateGroupProto similar_groups = 8;
  int32 exact_duplicates = 9;
  int32 similar_pairs = 10;
}

// --- Bulk Ingest ---

message IngestDocument {
  string url = 1;                          // Source URL (key derived if key is empty)
  string key = 2;                          // Explicit key (overrides URL derivation)
  string lang = 3;
  string content_md = 4;
  map<string, MetaValues> meta = 5;
  bool extract_frontmatter = 6;           // Parse YAML frontmatter from content_md
  int64 scraped_at = 7;                   // Unix timestamp of when content was collected
  string scraper = 8;                     // Source identifier (e.g. scraper name)
  int64 ttl = 9;                          // Optional TTL in seconds
}

message IngestOptions {
  bool skip_duplicates = 1;               // Skip documents whose content hash matches existing
  bool skip_embeddings = 2;               // Skip async embedding generation
  bool skip_fts = 3;                      // Skip FTS indexing
  bool skip_webhooks = 4;                 // Skip webhook firing
  bool auto_configure_collection = 5;     // Auto-set collection config to type="scraping"
  bool save_revision = 6;                 // Save revision for all documents
}

message IngestRequest {
  string collection = 1;
  repeated IngestDocument documents = 2;
  IngestOptions options = 3;
}

message IngestResponse {
  int32 added = 1;
  int32 updated = 2;
  int32 skipped = 3;                      // Documents skipped due to deduplication
  int32 failed = 4;
  repeated string errors = 5;
  string collection = 6;
  int64 duration_ms = 7;
}

// --- Revisions ---

message ListRevisionsRequest {
  string collection = 1;
  string key = 2;
  string lang = 3;
}

message RevisionEntryProto {
  int64 timestamp = 1;
  int64 updated_at = 2;
  string content_md = 3;
  map<string, MetaValues> meta = 4;
}

message ListRevisionsResponse {
  string collection = 1;
  string key = 2;
  string lang = 3;
  repeated RevisionEntryProto revisions = 4;
  int32 total = 5;
}

message RestoreRevisionRequest {
  string collection = 1;
  string key = 2;
  string lang = 3;
  int64 timestamp = 4;
}

// ---- Replication Service ----

service MDDBReplication {
  // RequestSnapshot streams a full database snapshot to a follower
  rpc RequestSnapshot(SnapshotRequest) returns (stream SnapshotChunk);

  // StreamBinlog streams binlog entries from a given LSN (long-lived server-stream)
  rpc StreamBinlog(StreamBinlogRequest) returns (stream BinlogEntryProto);

  // ReplicationStatus returns the current replication state of this node
  rpc ReplicationStatus(ReplicationStatusRequest) returns (ReplicationStatusResponse);

  // AcknowledgeLSN allows a follower to confirm it has applied up to a given LSN
  rpc AcknowledgeLSN(AcknowledgeLSNRequest) returns (AcknowledgeLSNResponse);
}

message SnapshotRequest {
  string follower_id = 1;
  uint64 current_lsn = 2;
}

message SnapshotChunk {
  bytes data = 1;
  uint64 offset = 2;
  uint64 total_size = 3;
  bool is_last = 4;
  uint64 snapshot_lsn = 5;
}

message StreamBinlogRequest {
  string follower_id = 1;
  uint64 from_lsn = 2;
}

message BinlogEntryProto {
  uint64 lsn = 1;
  uint32 type = 2;
  int64 timestamp = 3;
  string bucket_name = 4;
  bytes key = 5;
  bytes value = 6;
  uint32 checksum = 7;
}

message ReplicationStatusRequest {}

message ReplicationStatusResponse {
  string node_id = 1;
  string role = 2;
  uint64 current_lsn = 3;
  string leader_addr = 4;
  int64 last_applied_at = 5;
  repeated FollowerInfo followers = 6;
  int64 replication_lag_ms = 7;
  uint64 binlog_oldest_lsn = 8;
  int64 binlog_size_bytes = 9;
}

message FollowerInfo {
  string follower_id = 1;
  uint64 confirmed_lsn = 2;
  int64 last_seen_at = 3;
  string address = 4;
  int64 lag_ms = 5;
}

message AcknowledgeLSNRequest {
  string follower_id = 1;
  uint64 confirmed_lsn = 2;
}

message AcknowledgeLSNResponse {
  bool ok = 1;
  uint64 leader_lsn = 2;
}

// --- Temporal tracking ---

message TemporalQueryRequest {
  string collection = 1;
  string key = 2;
  string lang = 3;
  string event_type = 4;  // "create", "update", "access", or "" for all
  int64 from = 5;
  int64 to = 6;
  int32 limit = 7;
}

message TemporalEventProto {
  string doc_id = 1;
  string event_type = 2;
  int64 timestamp = 3;
  string actor = 4;
}

message TemporalQueryResponse {
  string collection = 1;
  string doc_id = 2;
  repeated TemporalEventProto events = 3;
  int32 total = 4;
}

message TemporalHotRequest {
  string collection = 1;
  int32 top_n = 2;
  int64 since = 3;
}

message TemporalHotEntry {
  Document document = 1;
  string doc_id = 2;
  uint64 access_count = 3;
  int64 last_access_at = 4;
}

message TemporalHotResponse {
  string collection = 1;
  repeated TemporalHotEntry entries = 2;
}

// --- Spell correction ---

message SpellSuggestRequest {
  string collection = 1;
  string text = 2;
  string lang = 3;
  int32 max_suggestions = 4;
}

message SpellSuggestionProto {
  string original = 1;
  string corrected = 2;
  double confidence = 3;
}

message SpellSuggestResponse {
  string original_text = 1;
  string suggested_text = 2;
  repeated SpellSuggestionProto token_suggestions = 3;
}

message SpellCleanupRequest {
  string collection = 1;
  string text = 2;
  string lang = 3;
}

message SpellCleanupResponse {
  string original = 1;
  string cleaned = 2;
  int32 corrections_applied = 3;
}

// --- Geo search ---

// GeoSearchRequest: find docs within radius_meters of (lat, lng).
message GeoSearchRequest {
  string collection = 1;
  double lat = 2;
  double lng = 3;
  double radius_meters = 4;
  int32 top_k = 5;
  map<string, MetaValues> filter_meta = 6;
  bool include_content = 7;
}

// GeoSearchResultItem: one result, ordered by ascending distance.
message GeoSearchResultItem {
  Document document = 1;
  double distance_meters = 2;
  int32 rank = 3;
}

message GeoSearchResponse {
  repeated GeoSearchResultItem results = 1;
  int32 total = 2;
  double radius_meters = 3;
  string algorithm = 4;
}

// GeoWithinRequest: find docs inside the axis-aligned bbox
// [min_lat, max_lat] × [min_lng, max_lng].
message GeoWithinRequest {
  string collection = 1;
  double min_lat = 2;
  double max_lat = 3;
  double min_lng = 4;
  double max_lng = 5;
  map<string, MetaValues> filter_meta = 6;
  bool include_content = 7;
}

message GeoWithinResponse {
  repeated GeoSearchResultItem results = 1;
  int32 total = 2;
  string algorithm = 3;
}

// GeoPostcodeLoadProto instructs GeoReindex to load an optional postcode CSV.
message GeoPostcodeLoadProto {
  string country = 1;
  string csv_path = 2;
}

// GeoReindexRequest: force-rebuild the in-memory R-tree and optionally load
// postcode lookup CSVs. An empty collection means "rebuild all".
message GeoReindexRequest {
  string collection = 1;
  repeated GeoPostcodeLoadProto load_postcodes = 2;
}

message GeoReindexResponse {
  int32 points = 1;
  string collection = 2;
  map<string, int32> postcodes_loaded = 3;
  int64 duration_ms = 4;
}

// GeoStatsRequest is an empty request for the stats RPC.
message GeoStatsRequest {}

// GeoCollectionStatProto mirrors GeoCollectionStat on the HTTP side.
message GeoCollectionStatProto {
  int32 points = 1;
  int64 last_rebuild_unix = 2;
}

message GeoStatsResponse {
  map<string, GeoCollectionStatProto> collections = 1;
  map<string, int32> postcode_datasets = 2;
  bool ready = 3;
}

// GeoEncodeRequest: convert (lat, lng) → geohash string.
message GeoEncodeRequest {
  double lat = 1;
  double lng = 2;
  int32 precision = 3;
}

message GeoEncodeResponse {
  string geohash = 1;
  int32 precision = 2;
}

// GeoDecodeRequest: convert geohash → centroid + bbox.
message GeoDecodeRequest {
  string geohash = 1;
}

message GeoDecodeResponse {
  double lat = 1;
  double lng = 2;
  double min_lat = 3;
  double max_lat = 4;
  double min_lng = 5;
  double max_lng = 6;
}

// --- Curation (v2.9.14+) ---
// Curation rules let editors pin specific documents to fixed positions and
// hide others for a given query, overriding organic ranking. Inspired by
// Typesense curation; persisted in the `curation` bucket and applied in the
// FTS and HybridSearch post-processing stages.

message PinnedDocProto {
  string key = 1;
  string lang = 2;
  int32 position = 3;            // 1-based; <=0 means "append after organic results"
}

message CurationRuleProto {
  string id = 1;
  string collection = 2;
  string query = 3;
  string match_mode = 4;         // "exact" (default) or "contains"
  repeated PinnedDocProto pins = 5;
  repeated string hides = 6;     // document keys to drop
  bool enabled = 7;
  int64 created_at = 8;
  int64 updated_at = 9;
}

message ListCurationRulesRequest {
  string collection = 1;         // optional; "" = list all
}

message ListCurationRulesResponse {
  repeated CurationRuleProto rules = 1;
  int32 total = 2;
  string collection = 3;
}

message CreateCurationRuleRequest {
  CurationRuleProto rule = 1;
}

message UpdateCurationRuleRequest {
  CurationRuleProto rule = 1;
}

message DeleteCurationRuleRequest {
  string id = 1;
}

message DeleteCurationRuleResponse {
  string status = 1;
  string id = 2;
}
