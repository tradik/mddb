// --- Automation ---

message AutomationRuleProto {
  string id = 1;
  string type = 2;            // "webhook", "trigger", "cron"
  string name = 3;
  bool enabled = 4;
  int64 created_at = 5;
  int64 updated_at = 6;
  // Webhook fields
  string url = 7;
  string method = 8;
  map<string, string> headers = 9;
  // Trigger fields
  string collection = 10;
  string search_type = 11;     // "fts", "vector", "hybrid"
  string query = 12;
  double threshold = 13;
  string webhook_id = 14;
  string search_params_json = 15; // JSON-encoded extra params
  repeated string events = 16;
  bool sentiment_enabled = 17;
  double sentiment_min = 18;
  double sentiment_max = 19;
  string condition_logic = 20; // "and", "or"
  // Cron fields
  string schedule = 21;
  string trigger_id = 22;
  int64 last_run = 23;
  int64 next_run = 24;
  // (OPS-023) A cron rule's other action: a backup instead of webhook_id.
  // Unset on an update keeps the stored backup unless webhook_id is set.
  BackupActionProto backup = 25;
  // (INT-022) A cron rule's third action: keep a collection in step with a
  // sitemap, a list of URLs or an S3 prefix. Unset on an update that names
  // no action keeps the stored one.
  SyncActionProto sync = 26;
  // (v2.18.11+) What the latest run of a cron rule's sync or backup did,
  // from the automation log; set on listings, never stored (#377).
  AutomationRunResultProto last_result = 27;
}

// AutomationRunResultProto is the latest run of a cron rule's action.
message AutomationRunResultProto {
  int64 at = 1;              // unix seconds the run started
  string status = 2;         // "success", "error" or "skipped"
  int64 duration_ms = 3;
  string error = 4;
  int32 added = 5;           // sync counts
  int32 updated = 6;
  int32 unchanged = 7;
  int32 deleted = 8;
  int32 failed = 9;
}

// SyncActionProto is what a cron rule with a sync does on each run
// (INT-022). Its storage_config (s3) follows BackupActionProto's: the secret
// is write-only and an update without one keeps the stored one.
message SyncActionProto {
  string source = 1;                     // "sitemap", "urls" or "s3"
  string collection = 2;
  string lang = 3;
  string url = 4;                        // sitemap: the sitemap or sitemap index
  repeated string urls = 5;              // urls: the pages
  string bucket = 6;                     // s3: empty takes storage_config.bucket
  string prefix = 7;                     // s3: empty takes storage_config.prefix
  StorageConfigProto storage_config = 8; // s3 endpoint, region, credentials, TLS
  bool prune = 9;                        // delete documents whose source is gone
  int32 max_documents = 10;              // sources per run; 0 = 1000, at most 50000
  int64 max_bytes = 11;                  // bytes per document; 0 = 10 MiB, at most 100 MiB
}

// BackupActionProto is what a cron rule with a backup does on each run
// (OPS-023). Its storage_config reuses StorageConfigProto: the S3 secret is
// write-only, reads set secret_key_set instead, and an update without a
// secret keeps the stored one.
message BackupActionProto {
  string target = 1;                             // "local" (default) or "s3"
  string path = 2;                               // local: directory inside MDDB_BACKUP_DIR; empty = the directory itself
  string bucket = 3;                             // s3: empty takes storage_config.bucket
  string prefix = 4;                             // name/key prefix; empty takes storage_config.prefix, then "mddb-"
  int32 keep = 5;                                // backups kept on the target; 0 keeps all
  repeated string collections = 6;               // ["*"] (default) or the collections to back up
  StorageConfigProto storage_config = 7;         // s3 endpoint, region, credentials, TLS
}

message ListAutomationRequest {
  string type = 1; // optional filter: "trigger", "cron", "webhook"
  // (v2.18.11+) Optional: only the rules acting on this collection — the
  // triggers watching it and the syncs writing to it (#377).
  string collection = 2;
}

message ListAutomationResponse {
  repeated AutomationRuleProto rules = 1;
