// --- Collection Config ---

// RetrievalProfileProto is a collection's retrieval defaults (RAG-001).
//
// Every field is optional and an unset field means "not configured", so the
// caller's request parameter or MDDB's global default applies. Precedence is
// fixed: request parameter > collection profile > global default.
message RetrievalProfileProto {
  string default_search_type = 1;   // fts|vector|hybrid
  int32 top_k = 2;
  string retrieval_mode = 3;        // parent|chunk|window
  string hybrid_strategy = 4;       // alpha|rrf
  double hybrid_alpha = 5;          // 0.0-1.0; see hybrid_alpha_set
  // hybrid_alpha 0.0 is a meaningful weight (pure keyword), so it cannot
  // double as "unset" — this says whether the value above was configured.
  bool hybrid_alpha_set = 6;
  int32 context_token_budget = 7;   // cap on total returned context, in tokens
  double oversample = 8;            // (SRCH-005) candidates per result before dedup/merge/rescore; 1.0-10.0
  string group_by_key = 9;          // (SRCH-016) default groupBy key: a metadata key, "document" or "collection"; empty = none
  int32 group_by_per_group = 10;    // (SRCH-016) results kept per group; 0 = 1
  string format = 11;               // (AGT-002) default result format: "results" or "passages"; empty = results
  optional double bm25_k1 = 12;     // (SRCH-018) BM25 term-frequency saturation, 0-3; unset = 1.2
  optional double bm25_b = 13;      // (SRCH-018) BM25 length normalisation, 0-1; unset = 0.75
  string vector_algorithm = 14;     // (SRCH-013) default vector index; "auto" = the query planner chooses
  string summary_mode = 15;         // (RAG-009) client-written summaries on a search: off (default), blend, expand
  optional double summary_weight = 16; // (RAG-009) BM25F weight of meta.summary when summary_mode is not off, 0-10; unset = 2.0
  int32 max_top_k = 17;             // (v2.18.10, #368) most results one search returns; lowers MDDB_SEARCH_MAX_LIMIT, never raises it; 0 = unset
}

// NOTE (RAG-001): this message knows only 6 of CollectionConfig's ~15 fields.
// storage_backend, storage_config, quantization, disk_only_vectors, encrypted,
// track_access, track_hot, spell_correct, spell_lang and wordpress exist over
// REST and are invisible over gRPC — a gRPC client cannot read or write them.
// Tracked separately; retrieval is added here because RAG-001 needs it.
// StorageConfigProto is the backend-specific half of a collection's storage
// settings (GO-035). `secret_key` is never populated on read — see
// `secret_key_set`.
message StorageConfigProto {
  string endpoint = 1;
  string bucket = 2;
  string region = 3;
  string access_key = 4;
  string secret_key = 5;                         // write-only; reads return empty, see secret_key_set
  string prefix = 6;
  bool use_tls = 7;
  bool secret_key_set = 8;                       // read-only: a secret is stored, its value is withheld
}

// WordPressTargetProto is the outbound publishing target (GO-035). `api_key`
// is never populated on read — see `api_key_set`.
message WordPressTargetProto {
  string url = 1;
  string api_key = 2;                            // write-only; reads return empty, see api_key_set
  bool api_key_set = 3;                          // read-only: a key is stored, its value is withheld
}

// CodeConfigProto mirrors CodeConfigDef (#319): settings for collections of
// source code.
message CodeConfigProto {
  // Collection-relative directories that angle-bracket includes resolve
  // against, as a compiler's -I does: ["src"] makes <net/conn.h> src/net/conn.h.
  repeated string include_paths = 1;
  // (AGT-003) "" for the project's own code, "reference" for code kept to
  // learn from; cross-search target "role:reference" selects them all.
  string role = 2;
}

// CollectionFTSProto mirrors CollectionFTSDef (#335).
message CollectionFTSProto {
  optional bool enabled = 1;                     // unset = on
  // (v2.18.10+, #367) Meta keys kept out of full-text search: no meta.<key>
  // field postings, so changing them costs no FTS work. filterMeta and facets
  // still work on them. Takes effect for documents written afterwards; run
  // FTSReindex to apply it to the ones already indexed.
  repeated string exclude_meta_keys = 2;
}

// EmbeddingChunkingProto mirrors EmbeddingChunkingDef (#325): a collection's
// own chunk size and mode for embeddings.
message EmbeddingChunkingProto {
  int32 chunk_size = 1;                          // characters, 100-100000; 0 = MDDB_EMBEDDING_CHUNK_SIZE
  string chunk_mode = 2;                         // "code", "prose", or "" for each document's kind
}

message CollectionConfigProto {
  string type = 1;
  string description = 2;
  string icon = 3;
  string color = 4;
  map<string, string> custom_meta = 5;
  int32 max_revisions = 6;                       // (v2.9.14+) per-collection revision cap; 0 = unlimited
  RetrievalProfileProto retrieval = 7;           // (v2.12.0+) per-collection retrieval defaults
  string response_prompt = 8;                    // (v2.12.0+) how to format answers from this collection (RAG-002); max 4 KiB
  // (v2.12.0+, GO-035) The rest of CollectionConfig. Until these existed a
  // gRPC client saw a partially configured collection and could not tell that
  // from a partially configured one.
  string storage_backend = 9;                    // "boltdb" (default), "memory", "s3"
  StorageConfigProto storage_config = 10;        // backend-specific settings (required for s3)
  string quantization = 11;                      // "float32" (default), "int8", "int4"
  bool disk_only_vectors = 12;                   // RAM holds only quantized vectors; full vectors stay on disk
  bool encrypted = 13;                           // AES-256-GCM at rest
  bool track_access = 14;                        // record per-read access events
  bool track_hot = 15;                           // maintain hot-docs leaderboard
  bool spell_correct = 16;                       // auto-correct FTS queries
  string spell_lang = 17;                        // override language for spell correction
  WordPressTargetProto wordpress = 18;           // outbound publishing target (mddb-sync plugin)
  CodeConfigProto code = 19;                     // (v2.18.0+) source-code settings (#319)
  EmbeddingChunkingProto embedding = 20;         // (v2.18.1+) chunking for embeddings (#325)
  CollectionFTSProto fts = 21;                   // (v2.18.2+) full-text indexing on or off (#335)
  CollectionQuotaProto quota = 22;               // (v2.18.9+) limits (GO-043); unset = unlimited
  // (v2.18.10+, AGT-005) Output only: set when the collection was installed
  // from a corpus pack. Every write to a read-only collection is refused with
  // PERMISSION_DENIED; a SetCollectionConfig keeps both fields as stored.
  bool read_only = 23;
  CorpusInfoProto corpus = 24;
}

// CorpusInfoProto mirrors CorpusInfo (AGT-005): the pack a read-only
// collection was installed from.
message CorpusInfoProto {
  string name = 1;
  string version = 2;
  string license = 3;
  string mddb_version = 4;                       // the server version that built the pack
  int64 doc_count = 5;
  string sha256 = 6;                             // of the .mddbpack archive
  int64 installed_at = 7;                        // unix seconds
  bool vectors_disabled = 8;                     // the pack's model differs from the server's: hybrid answers from full text
  string embedding_provider = 9;
  string embedding_model = 10;
  int32 embedding_dims = 11;
}

// CollectionQuotaProto mirrors CollectionQuota (GO-043). 0 = no limit.
message CollectionQuotaProto {
  int64 max_documents = 1;                       // documents the collection may hold
  int64 max_bytes = 2;                           // stored bytes of its documents
  int64 max_vectors = 3;                         // chunk vectors it may hold
  int64 embedding_calls_per_day = 4;             // embedding provider calls per UTC day
  int64 embedding_tokens_per_day = 5;            // estimated tokens (chars/4) embedded per UTC day
}

message GetCollectionConfigRequest {
  string collection = 1;
}

// CollectionQuotaUsageProto is what a collection uses of its quota
// (GO-043, v2.18.10). Compare each field with the CollectionQuotaProto limit.
message CollectionQuotaUsageProto {
  int64 documents = 1;                           // documents the collection holds
  int64 bytes = 2;                               // stored bytes of its documents
  int64 vectors = 3;                             // chunk vectors it holds
  int64 embedding_calls = 4;                     // embedding provider calls today (UTC); counted only under an embedding budget
  int64 embedding_tokens = 5;                    // estimated tokens embedded today (UTC); counted only under an embedding budget
}

message GetCollectionConfigResponse {
  string collection = 1;
  CollectionConfigProto config = 2;
  bool configured = 3;
  CollectionQuotaUsageProto usage = 4;           // (v2.18.10) set only when the collection has a quota
}

message SetCollectionConfigRequest {
  string collection = 1;
  string type = 2;
  string description = 3;
  string icon = 4;
  string color = 5;
  map<string, string> custom_meta = 6;
  int32 max_revisions = 7;                       // (v2.9.14+) per-collection revision cap; 0 = unlimited
  RetrievalProfileProto retrieval = 8;           // (v2.12.0+) per-collection retrieval defaults
  string response_prompt = 9;                    // (v2.12.0+) how to format answers from this collection (RAG-002)
  // (v2.12.0+, GO-035) The remaining CollectionConfig fields.
  //
  // The booleans are `optional` deliberately. A plain proto3 bool cannot tell
  // "the client did not mention encryption" from "the client wants encryption
  // off", and this handler merges into the stored config — so an unset bool
  // would arrive as false and turn off encryption on a collection whose owner
  // only wanted to change the icon. That exact shape was the RAG-001 data-loss
  // bug; presence keeps it from coming back through a different door.
  string storage_backend = 10;                   // "" leaves the stored backend alone
  StorageConfigProto storage_config = 11;        // nil leaves the stored settings alone
  string quantization = 12;                      // "" leaves the stored setting alone
  optional bool disk_only_vectors = 13;
  optional bool encrypted = 14;
  optional bool track_access = 15;
  optional bool track_hot = 16;
  optional bool spell_correct = 17;
  string spell_lang = 18;                        // "" leaves the stored setting alone
  WordPressTargetProto wordpress = 19;           // nil leaves the stored target alone
  CodeConfigProto code = 20;                     // (v2.18.0+) nil leaves the stored settings alone
  EmbeddingChunkingProto embedding = 21;         // (v2.18.1+) nil leaves the stored chunking alone (#325)
  CollectionFTSProto fts = 22;                   // (v2.18.2+) nil leaves the stored setting alone (#335)
  // (v2.18.9+, GO-043) nil leaves the stored quota alone; an all-zero quota
  // removes it. Changing it needs a global admin when auth is on.
  CollectionQuotaProto quota = 23;
}

message SetCollectionConfigResponse {
  string status = 1;
  string collection = 2;
}

message ListCollectionConfigsRequest {}

message CollectionConfigEntry {
  string collection = 1;
  CollectionConfigProto config = 2;
}

message ListCollectionConfigsResponse {
  repeated CollectionConfigEntry configs = 1;
  int32 total = 2;
}

// --- Cross Search ---

message CrossSearchRequest {
  string source_collection = 1;
  string source_doc_id = 2;
  string query = 3;
  repeated float query_vector = 4;
  repeated string target_collections = 5;
  int32 top_k = 6;
  double threshold = 7;
  string algorithm = 8;
  string distance_metric = 9;
  map<string, MetaValues> filter_meta = 10;
  bool include_content = 11;
  map<string, MetaCondition> filter = 12;        // (v2.18.8) operator filter, ANDed with filter_meta
  GroupBy group_by = 13;                         // (v2.18.8) key may be "collection"
  string format = 14;                            // (v2.18.8) "passages"
  int32 passage_lines = 15;                      // (v2.18.8)
  string search_type = 16;                       // (v2.18.8) "vector" (default), "fts" or "hybrid"; targets may be "role:reference"
  int32 wait_for_index_ms = 17;                  // (v2.18.8) wait up to this long (max 30000) for queued embeddings
  repeated string wait_for_keys = 18;             // (v2.18.8) wait only for these keys
  string read_level = 19;                         // (v2.18.8) "indexedPlusPending" adds documents whose embedding is queued
  bool explain = 20;                             // (v2.18.9, SRCH-013) return the plan per target collection
  int32 latency_target_ms = 21;                  // (v2.18.9, SRCH-013) optional goal for algorithm "auto"
  repeated FeedbackExample positive = 22;        // (v2.18.9, SRCH-015) keys resolve in source_collection, then the targets
  repeated FeedbackExample negative = 23;
  string feedback_mode = 24;
  double feedback_weight = 25;
  RocchioWeights rocchio = 26;
  bool include_images = 27;                      // (v2.18.9, RAG-010) attach each hit's images, from its own collection
}

message CrossSearchResultItem {
  string collection = 1;
  Document document = 2;
  float score = 3;
  int32 rank = 4;
  string group = 5;                              // (v2.18.8)
  int32 group_rank = 6;
  repeated ImageRef images = 7;                  // (v2.18.9, RAG-010) with include_images
}

message CrossSearchResponse {
  repeated CrossSearchResultItem results = 1;
  int32 total = 2;
  string source_collection = 3;
  string source_doc_id = 4;
  repeated string target_collections = 5;
  string algorithm = 6;
  string distance_metric = 7;
  repeated Passage passages = 8;                 // (v2.18.8)
  IndexWaitResult indexing = 9;                  // (v2.18.8)
  SearchPlan plan = 10;                          // (v2.18.9, SRCH-013) set when the request had explain
  bool limit_capped = 11;                        // (v2.18.10, #368) the requested limit was above the server's cap
  int32 limit = 12;                              // (v2.18.10, #368) the limit used, set when limit_capped
}

// --- Find Duplicates ---

message FindDuplicatesRequest {
  string collection = 1;
  string mode = 2;              // "exact", "similar", "both" (default)
  double threshold = 3;         // 0.9 default
  int32 max_docs = 4;           // 5000 default
  string distance_metric = 5;   // "cosine" default
  bool include_content = 6;
}

message DuplicateDocInfoProto {
  string doc_id = 1;
  string key = 2;
  string content_hash = 3;
  string content_md = 4;
  float score = 5;
}

message DuplicateGroupProto {
  int32 group_id = 1;
  string type = 2;              // "exact" or "similar"
  repeated DuplicateDocInfoProto documents = 3;
  float score = 4;
}

message FindDuplicatesResponse {
  string collection = 1;
  string mode = 2;
  double threshold = 3;
  string distance_metric = 4;
  int32 total_documents = 5;
  int32 total_embedded = 6;
  repeated DuplicateGroupProto exact_groups = 7;
  repeated DuplicateGroupProto similar_groups = 8;
  int32 exact_duplicates = 9;
  int32 similar_pairs = 10;
}

// --- Bulk Ingest ---

message IngestDocument {
  string url = 1;                          // Source URL (key derived if key is empty)
  string key = 2;                          // Explicit key (overrides URL derivation)
  string lang = 3;
  string content_md = 4;
  map<string, MetaValues> meta = 5;
  bool extract_frontmatter = 6;           // Parse YAML frontmatter from content_md
  int64 scraped_at = 7;                   // Unix timestamp of when content was collected
  string scraper = 8;                     // Source identifier (e.g. scraper name)
  int64 ttl = 9;                          // Optional TTL in seconds
  // A file for the server to convert to Markdown (AGT-001), through the same
  // converters /v1/upload uses. Without content, content_md is the file.
  string format = 10;                     // pdf, docx, html, ...; empty: the key's extension
  bytes content = 11;                     // The file's bytes
  // (v2.18.9, RAG-010) files a Markdown document's image links name by
  // relative path; read with options.extract_images.
  repeated IngestImage images = 12;
}

// A file an image link names: its path as the link writes it, and its bytes.
message IngestImage {
  string path = 1;
  bytes content = 2;
}

message IngestOptions {
  bool skip_duplicates = 1;               // Skip documents whose content hash matches existing
  bool skip_embeddings = 2;               // Skip async embedding generation
  bool skip_fts = 3;                      // Skip FTS indexing
  bool skip_webhooks = 4;                 // Skip webhook firing
  bool auto_configure_collection = 5;     // Auto-set collection config to type="scraping"
  bool save_revision = 6;                 // Save revision for all documents
  bool extract_images = 7;                // (v2.18.9, RAG-010) Markdown and PDF images become image documents
  bool fetch_remote_images = 8;           // (v2.18.9, RAG-010) fetch http(s) image links, through the SSRF guard
}

message IngestRequest {
  string collection = 1;
  repeated IngestDocument documents = 2;
  IngestOptions options = 3;
}

message IngestResponse {
  int32 added = 1;
  int32 updated = 2;
  int32 skipped = 3;                      // Documents skipped due to deduplication
  int32 failed = 4;
  repeated string errors = 5;
  string collection = 6;
  int64 duration_ms = 7;
  repeated IngestConversion conversions = 8; // Documents converted from files, scored (GO-046)
}

// IngestConversion says how well one document converted from its file.
message IngestConversion {
  string key = 1;
  string format = 2;                      // The format it was converted from
  double conversion_confidence = 3;       // 0-1, heuristic: 0 for a scan without a text layer
  repeated string conversion_warnings = 4;
}

// --- Revisions ---

message ListRevisionsRequest {
  string collection = 1;
  string key = 2;
  string lang = 3;
}

message RevisionEntryProto {
  int64 timestamp = 1;
  int64 updated_at = 2;
  string content_md = 3;
  map<string, MetaValues> meta = 4;
}

message ListRevisionsResponse {
  string collection = 1;
  string key = 2;
  string lang = 3;
  repeated RevisionEntryProto revisions = 4;
  int32 total = 5;
}

message RestoreRevisionRequest {
  string collection = 1;
  string key = 2;
  string lang = 3;
  int64 timestamp = 4;
}

// ---- Replication Service ----

service MDDBReplication {
  // RequestSnapshot streams a full database snapshot to a follower
  rpc RequestSnapshot(SnapshotRequest) returns (stream SnapshotChunk);

  // StreamBinlog streams binlog entries from a given LSN (long-lived server-stream)
  rpc StreamBinlog(StreamBinlogRequest) returns (stream BinlogEntryProto);

  // ReplicationStatus returns the current replication state of this node
  rpc ReplicationStatus(ReplicationStatusRequest) returns (ReplicationStatusResponse);

  // AcknowledgeLSN allows a follower to confirm it has applied up to a given LSN
  rpc AcknowledgeLSN(AcknowledgeLSNRequest) returns (AcknowledgeLSNResponse);
}

message SnapshotRequest {
  string follower_id = 1;
  uint64 current_lsn = 2;
}

message SnapshotChunk {
  bytes data = 1;
  uint64 offset = 2;
  uint64 total_size = 3;
  bool is_last = 4;
  uint64 snapshot_lsn = 5;
}

message StreamBinlogRequest {
  string follower_id = 1;
  uint64 from_lsn = 2;
}

message BinlogEntryProto {
  uint64 lsn = 1;
  uint32 type = 2;
  int64 timestamp = 3;
  string bucket_name = 4;
  bytes key = 5;
  bytes value = 6;
  uint32 checksum = 7;
}

message ReplicationStatusRequest {}

message ReplicationStatusResponse {
  string node_id = 1;
  string role = 2;
  uint64 current_lsn = 3;
  string leader_addr = 4;
  int64 last_applied_at = 5;
  repeated FollowerInfo followers = 6;
  int64 replication_lag_ms = 7;
  uint64 binlog_oldest_lsn = 8;
  int64 binlog_size_bytes = 9;
}

message FollowerInfo {
  string follower_id = 1;
  uint64 confirmed_lsn = 2;
  int64 last_seen_at = 3;
  string address = 4;
  int64 lag_ms = 5;
}

message AcknowledgeLSNRequest {
  string follower_id = 1;
  uint64 confirmed_lsn = 2;
}

message AcknowledgeLSNResponse {
  bool ok = 1;
  uint64 leader_lsn = 2;
}

// --- Temporal tracking ---

message TemporalQueryRequest {
  string collection = 1;
  string key = 2;
  string lang = 3;
  string event_type = 4;  // "create", "update", "access", or "" for all
  int64 from = 5;
  int64 to = 6;
  int32 limit = 7;
}

message TemporalEventProto {
  string doc_id = 1;
  string event_type = 2;
  int64 timestamp = 3;
  string actor = 4;
}

message TemporalQueryResponse {
  string collection = 1;
  string doc_id = 2;
  repeated TemporalEventProto events = 3;
  int32 total = 4;
}

message TemporalHotRequest {
  string collection = 1;
  int32 top_n = 2;
  int64 since = 3;
}

message TemporalHotEntry {
  Document document = 1;
  string doc_id = 2;
  uint64 access_count = 3;
  int64 last_access_at = 4;
}

message TemporalHotResponse {
  string collection = 1;
  repeated TemporalHotEntry entries = 2;
}

// --- Spell correction ---

message SpellSuggestRequest {
  string collection = 1;
  string text = 2;
  string lang = 3;
  int32 max_suggestions = 4;
}

message SpellSuggestionProto {
  string original = 1;
  string corrected = 2;
  double confidence = 3;
}

message SpellSuggestResponse {
  string original_text = 1;
  string suggested_text = 2;
  repeated SpellSuggestionProto token_suggestions = 3;
}

message SpellCleanupRequest {
  string collection = 1;
  string text = 2;
  string lang = 3;
}

message SpellCleanupResponse {
  string original = 1;
  string cleaned = 2;
  int32 corrections_applied = 3;
}

// --- Geo search ---

// GeoSearchRequest: find docs within radius_meters of (lat, lng).
message GeoSearchRequest {
  string collection = 1;
  double lat = 2;
  double lng = 3;
  double radius_meters = 4;
  int32 top_k = 5;
  map<string, MetaValues> filter_meta = 6;
  bool include_content = 7;
}

// GeoSearchResultItem: one result, ordered by ascending distance.
message GeoSearchResultItem {
  Document document = 1;
  double distance_meters = 2;
  int32 rank = 3;
}

message GeoSearchResponse {
  repeated GeoSearchResultItem results = 1;
  int32 total = 2;
  double radius_meters = 3;
  string algorithm = 4;
  bool limit_capped = 5;                        // (v2.18.10, #368) the requested limit was above the server's cap
  int32 limit = 6;                              // (v2.18.10, #368) the limit used, set when limit_capped
}

// GeoWithinRequest: find docs inside the axis-aligned bbox
// [min_lat, max_lat] × [min_lng, max_lng].
message GeoWithinRequest {
  string collection = 1;
  double min_lat = 2;
  double max_lat = 3;
  double min_lng = 4;
  double max_lng = 5;
  map<string, MetaValues> filter_meta = 6;
  bool include_content = 7;
}

message GeoWithinResponse {
  repeated GeoSearchResultItem results = 1;
  int32 total = 2;
  string algorithm = 3;
}

// GeoPostcodeLoadProto instructs GeoReindex to load an optional postcode CSV.
message GeoPostcodeLoadProto {
  string country = 1;
  string csv_path = 2;
}

// GeoReindexRequest: force-rebuild the in-memory R-tree and optionally load
// postcode lookup CSVs. An empty collection means "rebuild all".
message GeoReindexRequest {
  string collection = 1;
  repeated GeoPostcodeLoadProto load_postcodes = 2;
}

message GeoReindexResponse {
  int32 points = 1;
  string collection = 2;
  map<string, int32> postcodes_loaded = 3;
  int64 duration_ms = 4;
}

// GeoStatsRequest is an empty request for the stats RPC.
message GeoStatsRequest {}

// GeoCollectionStatProto mirrors GeoCollectionStat on the HTTP side.
message GeoCollectionStatProto {
  int32 points = 1;
  int64 last_rebuild_unix = 2;
}

message GeoStatsResponse {
  map<string, GeoCollectionStatProto> collections = 1;
  map<string, int32> postcode_datasets = 2;
  bool ready = 3;
}

// GeoEncodeRequest: convert (lat, lng) → geohash string.
message GeoEncodeRequest {
  double lat = 1;
  double lng = 2;
  int32 precision = 3;
}

message GeoEncodeResponse {
  string geohash = 1;
  int32 precision = 2;
}

// GeoDecodeRequest: convert geohash → centroid + bbox.
message GeoDecodeRequest {
  string geohash = 1;
}

message GeoDecodeResponse {
  double lat = 1;
  double lng = 2;
  double min_lat = 3;
  double max_lat = 4;
  double min_lng = 5;
  double max_lng = 6;
}

// --- Curation (v2.9.14+) ---
// Curation rules let editors pin specific documents to fixed positions and
// hide others for a given query, overriding organic ranking. Inspired by
// Typesense curation; persisted in the `curation` bucket and applied in the
// FTS and HybridSearch post-processing stages.

message PinnedDocProto {
  string key = 1;
  string lang = 2;
  int32 position = 3;            // 1-based; <=0 means "append after organic results"
}

message CurationRuleProto {
  string id = 1;
  string collection = 2;
  string query = 3;
  string match_mode = 4;         // "exact" (default) or "contains"
  repeated PinnedDocProto pins = 5;
  repeated string hides = 6;     // document keys to drop
  bool enabled = 7;
  int64 created_at = 8;
  int64 updated_at = 9;
}

message ListCurationRulesRequest {
  string collection = 1;         // optional; "" = list all
}

message ListCurationRulesResponse {
  repeated CurationRuleProto rules = 1;
  int32 total = 2;
  string collection = 3;
}

message CreateCurationRuleRequest {
  CurationRuleProto rule = 1;
}

message UpdateCurationRuleRequest {
  CurationRuleProto rule = 1;
}

message DeleteCurationRuleRequest {
  string id = 1;
}

message DeleteCurationRuleResponse {
  string status = 1;
  string id = 2;
}

// SearchAdvisorRequest asks how a collection should be searched (SRCH-010).
message SearchAdvisorRequest {
  string collection = 1;
}

// GO-042: indexing status. Field meanings match GET /v1/indexing-status.
message IndexingStatusRequest {
  string collection = 1; // empty = whole server
}

message IndexingStatusResponse {
  string collection = 1;
  int32 pending_embeddings = 2;
  uint64 failed_embeddings = 3;
  uint64 completed_embeddings = 4;
  int32 pending_metadata = 5;
  double progress = 6;                // completed / (completed + pending); 1 when nothing is pending
  int64 oldest_pending_at = 7;        // unix seconds; 0 when nothing is pending
  string provider = 8;                // embedding model; empty when none
  bool indexed = 9;                   // nothing pending
  ImageIndexingStatus images = 10;    // (v2.18.9, RAG-010) unset when the collection holds no images
  repeated string training_collections = 11; // (v2.18.10, GO-047) collections whose ivf/pq/opq/sq/sq4 are still training; flat and hnsw already answer
}

// Image documents and their vectors (v2.18.9, RAG-010).
message ImageIndexingStatus {
  int32 documents = 1;                // image documents holding an image
  int32 embedded = 2;                 // of them, with an image vector
  string model = 3;                   // multimodal model; empty when the provider embeds no images
  string note = 4;                    // why images are not embedded, when they are not
}

// CollectionProfile is what the advisor measured.
message CollectionProfile {
  string collection = 1;
  int32 documents = 2;
  int32 sampled = 3;
  int32 embedded_documents = 4;
  int32 vector_dimensions = 5;
  int32 median_words = 6;
  double long_document_ratio = 7;
  int32 distinct_terms = 8;
  // How much new vocabulary each document contributes. This, and not the
  // type-token ratio, decides whether keyword search can discriminate: TTR
  // pooled over a corpus falls towards zero as the corpus grows.
  double terms_per_document = 9;
  double type_token_ratio = 10;
  int32 code_documents = 11;
  int64 estimated_vector_bytes = 12;
  int32 summary_documents = 13;     // (RAG-009) sampled documents carrying a client-written summary
  double summary_ratio = 14;        // (RAG-009) their share of the sample, 0-1
  optional bool semantic = 15;      // (SRCH-014) the vectors encode meaning; false for the lexical provider, unset when nothing is embedded
}

// SearchAdvisorResponse is the advice, with the reasons for it.
message SearchAdvisorResponse {
  CollectionProfile profile = 1;
  string search_type = 2;
  string fts_algorithm = 3;
  string vector_algorithm = 4;
  string hybrid_strategy = 5;
  double hybrid_alpha = 6;
  string retrieval_mode = 7;
  int32 top_k = 8;
  string summary_mode = 11;         // (RAG-009) blend when most documents carry a summary; empty otherwise
  // One line per decision, in plain language. A recommendation nobody can
  // argue with is one nobody should follow.
  repeated string reasons = 9;
  // What would stop the recommendation working.
  repeated string warnings = 10;
}

// ---- v2.18.8: shared search shapes ----

// One metadata condition (SRCH-017). Every set field must hold.
message MetaCondition {
  repeated string any_of = 1;                    // the "in" operator: any of these values
  string prefix = 2;
  string contains = 3;
  optional string gt = 4;                        // numbers compare as numbers, dates as dates
  optional string gte = 5;
  optional string lt = 6;
  optional string lte = 7;
  repeated string none_of = 8;                   // the "not" operator: none of these values
  optional bool exists = 9;                      // the key is (true) or is not (false) set
}

// At most per_group results per value of key (SRCH-016). key is a metadata
// key, "document", or for cross-search "collection".
message GroupBy {
  string key = 1;
  int32 per_group = 2;                           // 0 means 1
}

// A place in a document (AGT-002): the lines, the definition holding them,
// and their text.
message Passage {
  string collection = 1;
  string key = 2;
  string lang = 3;
  string path = 4;
  int32 start_line = 5;
  int32 end_line = 6;
  string symbol = 7;
  string kind = 8;
  string content = 9;
  double score = 10;
  string source = 11;                            // fts, vector, hybrid, cross, or a symbol relation
  int32 tokens = 12;
  repeated ImageRef images = 13;                 // (v2.18.9, RAG-010) the document's images, with include_images
}

// How long a search waited for queued embeddings (GO-042).
message IndexWaitResult {
  int64 waited_ms = 1;
  bool timed_out = 2;
}

// ---- v2.18.8: symbols (CODE-008) ----

message CodeSymbolRequest {
  string collection = 1;
  string name = 2;
  repeated string include = 3;                   // relations to return; empty = all
  int32 limit = 4;                               // passages per relation (default 20, max 200)
  bool include_content = 5;
}

message CodeSymbolResponse {
  string collection = 1;
  string symbol = 2;
  repeated Passage definitions = 3;
  repeated Passage references = 4;
  repeated Passage callers = 5;
  repeated Passage callees = 6;
  repeated Passage tests = 7;
  repeated Passage siblings = 8;
  bool truncated = 9;
  bool limit_capped = 10;                        // (v2.18.10, #368) the requested limit was above the server's cap
  int32 limit = 11;                              // (v2.18.10, #368) the limit used, set when limit_capped
}

// ---- v2.18.8: retrieval evaluation (SRCH-019) ----

message EvalQueryProto {
  string id = 1;
  string query = 2;
  repeated string expected_keys = 3;
  map<string, int32> grades = 4;                 // key -> relevance 0..3
}

message EvalConfigProto {
  string name = 1;
  string search_type = 2;                        // fts, vector, hybrid
  string algorithm = 3;
  string vector_algorithm = 4;
  optional double alpha = 5;
  string strategy = 6;
  string retrieval_mode = 7;
  optional double bm25_k1 = 8;                   // (SRCH-018) BM25 parameters to try on fts and hybrid
  optional double bm25_b = 9;
  string summary_mode = 10;                      // (RAG-009) off, blend or expand; empty = the collection profile's
}

message RunEvalRequest {
  string collection = 1;
  int32 k = 2;                                   // default 10, max 100
  repeated EvalConfigProto configs = 3;          // default fts/bm25, hybrid, vector; max 8
  repeated EvalQueryProto queries = 4;           // inline queries instead of the stored set; max 200
  bool details = 5;
}

message EvalQueryResultProto {
  string id = 1;
  string query = 2;
  double recall = 3;
  double ndcg = 4;
  double reciprocal_rank = 5;
  repeated string returned = 6;
}

message EvalConfigResultProto {
  string config = 1;
  double recall_at_k = 2;
  double ndcg_at_k = 3;
  double mrr = 4;
  double p50_ms = 5;
  double p99_ms = 6;
  int64 tokens = 7;
  string error = 8;
  repeated EvalQueryResultProto per_query = 9;
}

message RunEvalResponse {
  string collection = 1;
  int32 k = 2;
  int32 queries = 3;
  repeated EvalConfigResultProto results = 4;
}

message AddEvalQueryRequest {
  string collection = 1;
  EvalQueryProto query = 2;
}

message ListEvalQueriesRequest {
  string collection = 1;
}

message ListEvalQueriesResponse {
  string collection = 1;
  repeated EvalQueryProto queries = 2;
}

message DeleteEvalQueryRequest {
  string collection = 1;
  string id = 2;
}

message DeleteEvalQueryResponse {
  bool deleted = 1;
}

// ---- v2.18.8: retrieval gain (AGT-004) ----

message GetGainRequest {
  string window = 1;                             // "30d" (default) .. "365d"
  bool daily = 2;
}

message GainCountersProto {
  map<string, int64> searches = 1;
  map<string, int64> algorithms = 2;
  map<string, int64> fusion = 3;
  int64 tokens_returned = 4;
  int64 tokens_avoided = 5;
  int64 fragment_hits = 6;
  int64 document_hits = 7;
}

message GainDayProto {
  string date = 1;
  GainCountersProto counters = 2;
}

message GetGainResponse {
  int32 window_days = 1;
  string from_date = 2;
  string to_date = 3;
  GainCountersProto totals = 4;
  int64 total_searches = 5;
  int64 tokens_without_retrieval = 6;
  double saved_percent = 7;
  repeated GainDayProto daily = 8;
}

// ---- v2.18.8: operations by metadata filter (GO-045) ----

message WhereRequest {
  string collection = 1;
  map<string, MetaValues> filter_meta = 2;
  map<string, MetaCondition> filter = 3;
  int32 limit = 4;                               // documents affected by this call; default 1000, max 10000
  string cursor = 5;                             // next_cursor of the previous call
  bool dry_run = 6;                              // report, change nothing
  map<string, MetaValues> meta = 7;              // UpdateWhere: merged into each document's metadata
  optional int64 ttl = 8;                        // SetTTLWhere: seconds from now; 0 removes the expiry
}

message WhereResponse {
  int32 matched = 1;
  int32 affected = 2;
  repeated string sample = 3;
  string next_cursor = 4;
  bool dry_run = 5;
  repeated string errors = 6;
}
