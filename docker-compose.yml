# Reusable anchors (OPS-002): log rotation (max 10 MB × 3) + resource
# limits/reservations applied to every service.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-deploy-server: &deploy-server
  resources:
    limits:
      cpus: "2.00"
      memory: 2G
    reservations:
      cpus: "0.50"
      memory: 512M

x-deploy-medium: &deploy-medium
  resources:
    limits:
      cpus: "1.00"
      memory: 512M
    reservations:
      cpus: "0.25"
      memory: 128M

x-deploy-small: &deploy-small
  resources:
    limits:
      cpus: "0.50"
      memory: 256M
    reservations:
      cpus: "0.10"
      memory: 64M

services:
  mddb:
    image: tradik/mddb:${MDDB_VERSION:-2.12.0}
    container_name: mddb-server
    restart: unless-stopped
    ports:
      # OPS-001/OPS-012: bound to loopback by default. Reverse proxies and
      # cloudflared reach the server over mddb-network and need no published
      # port at all; set MDDB_BIND_ADDR=0.0.0.0 only to expose it deliberately.
      - "${MDDB_BIND_ADDR:-127.0.0.1}:11023:11023" # HTTP API
      - "${MDDB_BIND_ADDR:-127.0.0.1}:11024:11024" # gRPC API
      - "${MDDB_BIND_ADDR:-127.0.0.1}:9000:9000" # MCP
      - "${MDDB_BIND_ADDR:-127.0.0.1}:11443:11443" # HTTP/3 (extreme mode)
    # GO-034: the ordered shutdown drains the queues and has a 15s budget
    # (MDDB_SHUTDOWN_TIMEOUT_SEC). Docker's default grace period is 10s, which
    # would SIGKILL the server mid-drain — the very thing the drain exists to
    # avoid. Give it room to finish and still stop promptly.
    stop_grace_period: 20s
    volumes:
      - mddb-data:/data
      - ./backups:/backups
    environment:
      - MDDB_PATH=/data/mddb.db
      - MDDB_MODE=wr
      - MDDB_EXTREME=true
      - MDDB_HTTP_PORT=11023
      - MDDB_GRPC_PORT=11024
      - MDDB_HTTP3_PORT=11443
      # OPS-012: the image ships MDDB_AUTH_ENABLED="false" for a frictionless
      # local start, so a production compose must turn it on explicitly — this
      # file runs MDDB_MODE=wr and publishes HTTP/gRPC/MCP.
      - MDDB_AUTH_ENABLED=true
      # SEC-007: secrets come from .env (gitignored), never hardcoded here.
      # Copy .env.example to .env and set these. Compose errors if unset.
      - MDDB_AUTH_JWT_SECRET=${MDDB_AUTH_JWT_SECRET:?set MDDB_AUTH_JWT_SECRET in .env, see .env.example}
      - MDDB_AUTH_JWT_EXPIRY=${MDDB_AUTH_JWT_EXPIRY:-24h}
      - MDDB_AUTH_ADMIN_USERNAME=${MDDB_AUTH_ADMIN_USERNAME:-admin}
      - MDDB_AUTH_ADMIN_PASSWORD=${MDDB_AUTH_ADMIN_PASSWORD:?set MDDB_AUTH_ADMIN_PASSWORD in .env, see .env.example}
      # - MDDB_PANEL_MODE=external  # internal (default, CORS enabled) or external (CORS disabled, panel proxies)
      - TZ=UTC
    networks:
      - mddb-network
    logging: *default-logging
    deploy: *deploy-server
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:11023/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      - "com.mddb.description=MDDB - High-Performance Markdown Database"
      - "com.mddb.version=${MDDB_VERSION:-2.12.0}"
      - "com.mddb.performance=optimized"

  mddb-panel:
    build:
      context: .
      dockerfile: services/mddb-panel/Dockerfile
    container_name: mddb-panel
    restart: unless-stopped
    ports:
      - "${MDDB_BIND_ADDR:-127.0.0.1}:3000:3000" # Web UI
    environment:
      - MDDB_SERVER=http://mddb:11023
    networks:
      - mddb-network
    logging: *default-logging
    deploy: *deploy-small
    depends_on:
      mddb:
        condition: service_healthy
    labels:
      - "com.mddb.description=MDDB Panel - Web Admin Interface"
      - "com.mddb.version=${MDDB_VERSION:-2.12.0}"

  # MCP is built into the mddb server — runs on port 9000 by default
  # For stdio mode, use: docker run -i --rm -e MDDB_MCP_STDIO=true tradik/mddb:latest

  mddb-chat:
    build:
      context: .
      dockerfile: services/mddb-chat/Dockerfile
    container_name: mddb-chat
    restart: unless-stopped
    ports:
      - "${MDDB_BIND_ADDR:-127.0.0.1}:11030:11030"
    environment:
      - MDDB_CHAT_CONFIG=/etc/mddb-chat/config.toml
      - MDDB_CHAT_LLM_API_KEY=${MDDB_CHAT_LLM_API_KEY}
      # OPS-012: mddbd now requires auth, so the chat backend has to present
      # the same credentials (config.rs falls back to these when the TOML
      # leaves mddb.auth_* empty).
      - MDDB_CHAT_AUTH_USERNAME=${MDDB_AUTH_ADMIN_USERNAME:-admin}
      - MDDB_CHAT_AUTH_PASSWORD=${MDDB_AUTH_ADMIN_PASSWORD:?set MDDB_AUTH_ADMIN_PASSWORD in .env, see .env.example}
    networks:
      - mddb-network
    logging: *default-logging
    deploy: *deploy-medium
    depends_on:
      mddb:
        condition: service_healthy
    labels:
      - "com.mddb.description=MDDB Chat - AI Chat Support"
      - "com.mddb.version=${MDDB_VERSION:-2.12.0}"

  mddb-chat-widget:
    build:
      context: .
      dockerfile: services/mddb-chat-widget/Dockerfile
    container_name: mddb-chat-widget
    restart: unless-stopped
    ports:
      - "${MDDB_BIND_ADDR:-127.0.0.1}:11032:8080" # nginx-unprivileged listens on 8080 (OPS-006)
    networks:
      - mddb-network
    logging: *default-logging
    deploy: *deploy-small
    labels:
      - "com.mddb.description=MDDB Chat Widget - Embeddable JS chatbox"
      - "com.mddb.version=${MDDB_VERSION:-2.12.0}"

volumes:
  mddb-data:
    driver: local
    name: mddb-data

networks:
  mddb-network:
    driver: bridge
    name: mddb-network
