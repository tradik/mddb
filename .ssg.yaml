# SSG configuration for MDDB documentation site
# Dev:  ssg --config .ssg.yaml
# Prod: ssg --config .ssg.yaml --clean --minify-all

source: .
content_dir: docs
pages_path: .

# Blog posts live outside docs/ and are merged in as posts (slug prefix
# "blog/" → URLs /blog/<name>/; the /blog/ index is docs/BLOG.md with
# layout: blog).
content_sources:
  - path: blog
    type: post
    category: Blog
template: ssg-template
templates_dir: services
domain: mddb.tradik.com
output_dir: dist
port: 8888
post_url_format: slug
page_format: directory
http: false
watch: false

# Build optimization
webp: true
# The webp pass covers the whole output tree and replaces each original. Our
# og:image is an absolute URL (https://…/og-image.png), which SSG deliberately
# leaves alone — so replace mode deleted the PNG out from under every page's
# social-preview meta. Keeping originals alongside the .webp restores it;
# in-page references are still rewritten to WebP.
webp_keep_original: true
# minify_all collapses whitespace inside Mermaid code blocks, which corrupts
# diagrams (Mermaid source is whitespace-significant: xychart "y-axis 0 --> 55",
# subgraph layouts, sequence diagrams). Keep HTML un-minified so diagram source
# survives verbatim. Cloudflare Pages still serves it gzip/brotli-compressed.
minify_all: false
clean: true

# Content-addressed CSS/JS filenames. The generated _headers ships a one-year
# `immutable` cache policy for /css/* and /js/*, which is only safe when a
# file's name changes with its contents — without this, an edited stylesheet
# keeps its name and returning visitors (and the CDN) serve the old one for a
# year. See SSG docs: DEPLOYMENT.md "Generated _headers and _redirects".
fingerprint: true

# Site-wide template variables (.Vars.*) — the single source of truth for
# version strings baked into the HTML at build time (no client-side JS).
# Updated by the release version sweep alongside Makefile/main.go.
variables:
  mddbVersion: "2.14.1"
  # The tag date of the version above, not of the one before it: the download
  # section prints it verbatim. It has now been wrong twice in a row (2.11.4's
  # date shown for 2.12.0, then for 2.13.0) — `git log -1 --format=%ad v<tag>`
  # settles it, and the release version sweep has to touch this line too.
  mddbReleaseDate: "8 September 2026"
  # Counted from tools/list against a running server, not from memory.
  mcpTools: "81"
  # A release binary: CGO_ENABLED=0, -ldflags="-s -w". A plain `go build` is
  # ~40MB because it keeps the symbol table and DWARF, which is not what
  # anyone downloads.
  mddbBinarySize: "~28MB"
  mddbDockerSize: "~33MB"


# Native mermaid rendering: ```mermaid fences become <pre class="mermaid">
# and the runtime is injected only on pages/posts that contain a diagram.
# (Replaces the theme's former page.html-only bootstrap script, which never
# ran for posts — blog diagrams stayed as plain code blocks.)
mermaid: true
mermaid_theme: neutral
mermaid_background: "#ffffff"


# The only category is "Blog", and its archive at /category/blog/ listed the
# same posts as /blog/ under a different URL: noindex, linked from nowhere,
# and named in sitemap.xml anyway (the sitemap reads what was rendered, not
# what the template's robots meta says). Not rendering it removes the
# duplicate, the stray sitemap entry and the 404 canonical trail behind it.
# Tags stay on: they are a real navigation layer with an archive per term.
taxonomies:
  category:
    archive: false

# Enable sitemap and robots.txt generation
sitemap_off: false
robots_off: false

# Rewrite .md links to final /docs/ URLs
rewrite_md_links: true
# Drop the ".md" from link text that is a bare filename
# ([TEMPORAL-TRACK.md](...) renders as "TEMPORAL-TRACK")
strip_md_link_text: true

# Template engine (Go templates)
engine: "go"

# Files published verbatim that live outside the theme's static/ root. Copying
# them here rather than after the build means the generator's own checks can
# see them — while they were staged by a Makefile step afterwards, every page
# linking /docs/api/swagger was reported as a dead link.
# `dest` for a file is its full destination path, not a directory to drop it in.
static_sources:
  # A directory page, not swagger.html: Cloudflare Pages strips the extension
  # and 308s, so a .html URL and the file on disk can never both be right.
  - path: services/ssg-template/swagger.html
    dest: docs/api/swagger/index.html
    # A copied file never becomes a page, so nothing in the sitemap could reach
    # it: the API reference was linked from the footer of every page and absent
    # from the file the site uses to state its own structure (SSG 1.8.57).
    sitemap: true
  - path: docs/openapi.yaml
    dest: docs/api/openapi.yaml
  - path: services/ssg-template/404.html
    dest: 404.html
  # og:image is referenced as an absolute URL by every page's meta tags and
  # must stay a PNG at the site root: the webp pass rewrites anything under
  # images/, and several social crawlers still refuse WebP previews.
  - path: services/ssg-template/og-image.png
    dest: og-image.png

# docs/examples/sample-with-frontmatter.md documents MDDB's own front-matter
# format (comma-separated `tags`), which is valid for its purpose and
# unparseable as a page. It is data, not content.
content_exclude:
  # docs/index.md carries only the homepage's frontmatter — the body lives in
  # the index.html template. Left as content it also rendered a near-empty
  # second page at /index/ with the same title: a thin duplicate of the
  # homepage. Excluding it removes the duplicate outright; / is unaffected,
  # because the homepage is rendered from the template, not from the slug.
  - "index.md"
  # sample-with-frontmatter.md documents MDDB's own front-matter format
  # (comma-separated `tags`), which is valid for its purpose and unparseable
  # as a page. It is data, not content.
  - "docs/examples/**"

# /index/ names / as its canonical: docs/index.md renders the homepage and a
# near-empty duplicate, and it cannot be unpublished without losing the
# homepage. noindex pages are dropped from the sitemap unconditionally; this
# opts into dropping the non-self-canonical one too.
sitemap_prune_canonical: false

# Feed for the blog, so readers can subscribe without polling the index.
# Both formats, same posts. Readers accept either, but plenty of "paste your
# RSS URL" fields still expect the older one, so publishing both removes the
# question. Declared rather than using `feed: true`, which names the Atom feed
# after the bare hostname. SSG injects the autodiscovery <link> tags itself.
feed_items: 20
feeds:
  - path: /feed.xml
    format: atom
    title: MDDB blog
  - path: /rss.xml
    format: rss
    title: MDDB blog


# /index/ was published for months before the duplicate was removed; send it to
# the page it duplicated rather than letting it 404.
redirects:
  - from: /index/
    to: /
    status: 301
  # Retired tags (2026-09): the vocabulary carried 23 terms across 11 posts, so
  # 13 archives listed a single article each — thin pages a crawler reports and
  # a reader gains nothing from. The terms were merged into the ones below;
  # the URLs keep resolving to the archive that absorbed them.
  - from: /tag/vector-search/
    to: /tag/search/
    status: 301
  - from: /tag/hybrid-search/
    to: /tag/search/
    status: 301
  - from: /tag/code-intelligence/
    to: /tag/agents/
    status: 301
  - from: /tag/refactoring/
    to: /tag/agents/
    status: 301
  - from: /tag/css/
    to: /tag/agents/
    status: 301
  - from: /tag/simd/
    to: /tag/performance/
    status: 301
  - from: /tag/profiling/
    to: /tag/performance/
    status: 301
  - from: /tag/synonyms/
    to: /tag/retrieval/
    status: 301
  - from: /tag/ranking/
    to: /tag/retrieval/
    status: 301
  - from: /tag/deduplication/
    to: /tag/retrieval/
    status: 301
  - from: /tag/memory/
    to: /tag/operations/
    status: 301
  - from: /tag/monitoring/
    to: /tag/operations/
    status: 301
  - from: /tag/configuration/
    to: /tag/rag/
    status: 301
  - from: /tag/windows/
    to: /tag/release/
    status: 301

# Fail the build on anything a crawl would report: dead links, images with no
# alt attribute, indexable pages missing a title or description, and pages
# nothing links to. Length bounds stay advisory — a headline that reads well
# at 62 characters beats one mangled to fit.
check_links: strict
check_images: strict
check_meta: strict
check_orphans: strict
meta_limits:
  # 0 let /blog/ ship an 11-character title ("Blog — MDDB") — the page every
  # post links back to. Crawlers report a title under ~15 characters as too
  # short; 20 leaves a margin without warning about every page on the site.
  title_min: 20
  title_max: 60
  description_min: 70
  description_max: 160

# Validate JSON-LD against the properties each type actually requires. The home
# page shipped `codeRepository` on a SoftwareApplication (it belongs to
# SoftwareSourceCode) and a softwareVersion two releases behind, and nothing in
# the build had an opinion about either.
check_schema: strict
