{{define "page_slug"}}{{.Page.Slug}}{{end -}}
<!DOCTYPE html>
<html lang="en">
<head>
    {{template "head_meta" .}}
    <meta name="robots" content="index, follow">
    <meta name="description" content="{{if .Page.Description}}{{.Page.Description}}{{else}}{{.Page.Excerpt}}{{end}}">
    <meta property="og:title" content="{{.Page.Title}} — MDDB">
    <meta property="og:description" content="{{if .Page.Description}}{{.Page.Description}}{{else}}{{.Page.Excerpt}}{{end}}">
    <meta property="og:url" content="https://{{.Domain}}/{{.Page.Slug}}/" />
    <meta property="twitter:title" content="{{.Page.Title}} — MDDB">
    <meta property="twitter:url" content="https://{{.Domain}}/{{.Page.Slug}}/" />
    <link rel="canonical" href="https://{{.Domain}}/{{.Page.Slug}}/" />
    <title>{{.Page.Title}} — MDDB</title>
</head>
<body>
{{template "email_off" .}}
{{template "gtm_noscript" .}}
{{template "navbar" .}}

<div class="site-layout">
    {{template "sidebar" .}}
    <main id="main-content" class="main-content">
        <article class="doc-article">
            <header class="doc-header">
                <h1 class="doc-title">{{.Page.Title}}</h1>
            </header>
            <div class="doc-body">
                {{.Page.Content | safeHTML}}
            </div>
        </article>
    </main>
</div>

{{template "footer" .}}
{{template "email_on" .}}
</body>
</html>
