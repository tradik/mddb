<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- FE-002: defense-in-depth CSP. connect-src 'self' blocks fetching
         markdown from any other origin (reinforces the ?doc validation below);
         object-src/base-uri are locked down. Scripts/styles stay permissive
         enough for the inline bootstrap script and mermaid's inline SVG/styles. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; img-src 'self' data:; font-src 'self' https://cdnjs.cloudflare.com data:; connect-src 'self'; object-src 'none'; base-uri 'self'">
    <title>MDDB Documentation</title>
    <link rel="stylesheet" href="css/landing.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.1/github-markdown.min.css" integrity="sha384-LTbdgUzZ3SXn50n5dAZ75Kpp86fR5oSHELRlFJqZ08kHpI2/Jwsgi/KA8UdnqXSK" crossorigin="anonymous" referrerpolicy="no-referrer">
    <style>
        .markdown-body {
            box-sizing: border-box;
            min-width: 200px;
            max-width: 980px;
            margin: 0 auto;
            padding: 45px;
        }
        @media (max-width: 767px) {
            .markdown-body {
                padding: 15px;
            }
        }
        .loading {
            text-align: center;
            padding: 50px;
            font-size: 1.2rem;
            color: #666;
        }
        .error {
            padding: 20px;
            background: #fee;
            border: 1px solid #fcc;
            border-radius: 4px;
            color: #c00;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            padding: 10px 20px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 4px;
        }
        .back-link:hover {
            background: #1e40af;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/mddb/" class="back-link">← Back to Home</a>
        <div id="content" class="loading">Loading documentation...</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js" integrity="sha384-zbcZAIxlvJtNE3Dp5nxLXdXtXyxwOdnILY1TDPVmKFhl4r4nSUG1r8bcFXGVa4Te" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@11.15.0/dist/mermaid.min.js" integrity="sha384-yQ4mmBBT+vhTAwjFH0toJXNYJ6O4usWnt6EPIdWwrRvx2V/n5lXuDZQwQFeSFydF" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.4.10/dist/purify.min.js" integrity="sha384-eguRoJERj8ghOpzO//Rl7+ScQsQIR1cH+ajll7+fG+IpbNPlkZsQn9h8ccr+wPXx" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script>
        mermaid.initialize({ startOnLoad: false, theme: 'default' });

        // FE-002: escape HTML metacharacters so untrusted text can never break
        // out of the element it is placed in.
        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, (c) => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
            }[c]));
        }

        // Custom renderer to handle mermaid code blocks
        const renderer = new marked.Renderer();
        const originalCodeRenderer = renderer.code.bind(renderer);
        renderer.code = function(code, lang) {
            // marked@11 passes (code, lang) or ({text, lang}) depending on version
            let text = code, language = lang;
            if (typeof code === 'object') {
                text = code.text;
                language = code.lang;
            }
            if (language === 'mermaid') {
                // FE-002: escape the block body so a crafted diagram (e.g.
                // "</pre><script>…") can't inject HTML. mermaid.run() reads
                // textContent, which decodes the entities, so diagrams still render.
                return '<pre class="mermaid">' + escapeHtml(text) + '</pre>';
            }
            return originalCodeRenderer(code, lang);
        };

        // FE-002: validate the ?doc parameter. Only same-origin, relative paths
        // ending in .md are allowed; absolute URLs, protocol-relative ("//"),
        // traversal ("..") and scheme-bearing (":") values fall back to the
        // default doc — so a link like ?doc=https://evil/x.md can't make the
        // viewer fetch and render attacker-controlled markdown.
        function resolveDocParam(raw) {
            const fallback = 'QUICKSTART.md';
            if (!raw) return fallback;
            if (/(^|[\\/])\.\.([\\/]|$)/.test(raw) || raw.includes('//') || raw.includes(':') || raw.startsWith('/')) {
                return fallback;
            }
            let resolved;
            try {
                resolved = new URL(raw, window.location.href);
            } catch {
                return fallback;
            }
            if (resolved.origin !== window.location.origin) return fallback;
            if (!resolved.pathname.endsWith('.md')) return fallback;
            return resolved.pathname.replace(/^\//, '') + resolved.search;
        }

        // Get the markdown file from URL parameter
        const urlParams = new URLSearchParams(window.location.search);
        const mdFile = resolveDocParam(urlParams.get('doc'));
        const contentDiv = document.getElementById('content');

        // Configure marked
        marked.setOptions({
            breaks: true,
            gfm: true,
            headerIds: true,
            mangle: false,
            renderer: renderer
        });

        // Fetch and render markdown
        fetch(mdFile)
            .then(response => {
                if (!response.ok) {
                    throw new Error(`Failed to load ${mdFile}`);
                }
                return response.text();
            })
            .then(markdown => {
                contentDiv.className = 'markdown-body';
                // FE-002: sanitize the rendered HTML so inline HTML in any .md
                // file (e.g. <img src=x onerror=alert(1)>, <script>) is stripped
                // before it reaches the DOM. <pre class="mermaid"> survives
                // (both tag and class are DOMPurify defaults).
                contentDiv.innerHTML = DOMPurify.sanitize(marked.parse(markdown));

                // Update page title
                const firstH1 = contentDiv.querySelector('h1');
                if (firstH1) {
                    document.title = firstH1.textContent + ' - MDDB Documentation';
                }

                // Make links work properly
                contentDiv.querySelectorAll('a').forEach(link => {
                    const href = link.getAttribute('href');
                    if (href && href.endsWith('.md')) {
                        link.href = `md-viewer.html?doc=${href}`;
                    }
                });

                // Render mermaid diagrams
                mermaid.run({ nodes: contentDiv.querySelectorAll('.mermaid') });
            })
            .catch(error => {
                contentDiv.className = 'error';
                // FE-002: escape the error message (it embeds the requested
                // filename) so it can't smuggle markup into the error panel.
                contentDiv.innerHTML = `
                    <h2>Error Loading Documentation</h2>
                    <p>${escapeHtml(error.message)}</p>
                    <p>Please try <a href="/mddb/">returning to the home page</a>.</p>
                `;
            });
    </script>
</body>
</html>
