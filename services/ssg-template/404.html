<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>404 – Page Not Found | MDDB</title>
    <link rel="canonical" href="https://mddb.tradik.com/" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="/images/logo.svg">
    <style>
        .not-found {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
            background: var(--bg, #ffffff);
            color: var(--text, #0F172A);
            font-family: 'JetBrains Mono', monospace;
        }
        .not-found__code {
            font-size: 8rem;
            font-weight: 700;
            line-height: 1;
            color: var(--primary, #0050A6);
            margin-bottom: 1rem;
        }
        .not-found__title {
            font-size: 1.5rem;
            margin-bottom: 0.75rem;
        }
        .not-found__desc {
            color: var(--text-secondary, #334155);
            margin-bottom: 2rem;
            max-width: 400px;
        }
        .not-found__links {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
        }
        .not-found__links a {
            padding: 0.6rem 1.4rem;
            border-radius: 0.5rem;
            text-decoration: none;
            font-size: 0.9rem;
            transition: opacity 0.15s;
        }
        .not-found__links a:hover { opacity: 0.8; }
        .btn-primary {
            background: var(--primary, #0050A6);
            color: #fff;
        }
        .btn-secondary {
            border: 1px solid var(--border, #e2e8f0);
            color: var(--text, #0F172A);
        }
    </style>
</head>
<body>
    <!--email_off--><!-- Cloudflare rewrites addresses it finds; see base.html. -->
    <div class="not-found">
        <div class="not-found__code">404</div>
        <h1 class="not-found__title">Page not found</h1>
        <p class="not-found__desc">The page you're looking for doesn't exist or has been moved.</p>
        <div class="not-found__links">
            <a href="/" class="btn-primary">Home</a>
            <a href="/docs/quickstart/" class="btn-secondary">Quickstart</a>
            <a href="/docs/api/" class="btn-secondary">API Docs</a>
        </div>
    </div>
    <!--/email_off-->
</body>
</html>
