{{define "index_used_by"}}
<!-- Projects running on mddb -->
<div class="ai-strip used-by-strip">
    <div class="container">
        <span class="ai-strip-label">Powers</span>
        <p class="used-by-text">
            <a href="https://daemonports.org/" rel="noopener">daemonports.org</a>

        </p>
    </div>
</div>
