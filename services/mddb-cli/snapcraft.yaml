name: mddb-cli
title: MDDB CLI
version: "2.13.0"
summary: Command-line client for MDDB Markdown Database
description: |
  mddb is the official command-line interface for MDDB (Markdown Database).
  Connect to a running mddbd server to manage collections, documents,
  run queries, import/export data and more.

  Usage: mddb --server http://localhost:11023 <command>

grade: stable
confinement: strict
base: core24
platforms:
  amd64:
  arm64:

apps:
  mddb:
    command: bin/mddb
    plugs:
      - network
      - home

parts:
  mddb-cli:
    # As in services/mddbd/snapcraft.yaml: the binary comes from the release
    # workflow rather than being compiled in the sandbox, because the store has
    # no Go track for the version this project pins.
    #
    # This also retires the `go mod vendor` step the workflow used to run. That
    # existed solely because the sandbox could not resolve mddb-cli's local
    # `replace` onto the shared client — a problem that disappears when the
    # build happens in the checkout, where the shared module is.
    plugin: nil
    source: .
    source-type: local
    override-build: |
      install -D -m 0755 "$CRAFT_PART_SRC/snapbuild/mddb" "$CRAFT_PART_INSTALL/bin/mddb"
