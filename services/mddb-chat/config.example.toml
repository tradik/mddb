[server]
host = "0.0.0.0"
port = 11030
cors_origins = ["*"]

[mddb]
grpc_addr = "http://localhost:11024"
default_collection = "docs"
# Retrieval settings. Leave these commented out to use whatever the collection
# says (its retrieval profile, set in the panel or over the API) — that is the
# point of RAG-001: search settings live next to the data, not in every client.
# Uncomment only to override a specific collection's profile from here.
# search_top_k = 5
# search_type = "hybrid"  # "hybrid", "vector", "fts"
# How much of each search result the model gets to read, in characters
# (counted in characters, so a cut never lands inside a Polish letter or an
# emoji). A result shorter than this arrives whole, fenced code blocks and
# inline code included; a longer one is cut at this many characters and ends
# with an ellipsis. 0 = the whole chunk, whatever its length. Raise it when
# the model should see entire config samples or command listings; the cost
# is prompt tokens per result.
result_max_chars = 800
# Credentials used to authenticate to mddbd. Leave EMPTY here and supply them
# via env (SEC-007): MDDB_CHAT_AUTH_USERNAME / MDDB_CHAT_AUTH_PASSWORD override
# these when blank. Never commit real passwords — config.toml is gitignored.
auth_username = ""
auth_password = ""
# Startup when mddbd is not reachable yet (the normal order in Kubernetes).
# mddb-chat opens its port at once and keeps trying to connect and log in,
# waiting 1 s, 2 s, 4 s... up to this many seconds between attempts, for as
# long as it takes. Until it succeeds /health answers 503 and chat messages
# get "the knowledge base is not connected yet".
#   0 = no retry: one attempt before the port opens, exit on failure
#       (the behaviour before this setting existed).
connect_retry_max_seconds = 30

# LLM provider configuration
# Supported providers:
#   "openai"    — OpenAI (gpt-4o, gpt-4o-mini)
#   "anthropic" — Claude (claude-sonnet-4-20250514, claude-haiku-4-5-20251001)
#   Any OpenAI-compatible service also works with provider = "openai":
#     - Ollama:      api_url = "http://localhost:11434/v1", model = "qwen3:8b"
#     - Bielik:      api_url = "https://api.bielik.ai/v1", model = "Bielik-11B-v2.3-Instruct"
#     - Groq:        api_url = "https://api.groq.com/openai/v1", model = "llama-3.3-70b-versatile"
#     - Mistral:     api_url = "https://api.mistral.ai/v1", model = "mistral-large-latest"
#     - OpenRouter:  api_url = "https://openrouter.ai/api/v1", model = "anthropic/claude-sonnet-4"
#     - Together:    api_url = "https://api.together.xyz/v1"
#     - DeepSeek:    api_url = "https://api.deepseek.com/v1", model = "deepseek-chat"

[llm]
provider = "openai"
api_url = "https://api.openai.com/v1"
api_key = ""  # or set MDDB_CHAT_LLM_API_KEY env var
model = "gpt-4o-mini"
max_tokens = 1024
temperature = 0.7
# Extra fields merged into every request to an OpenAI-compatible endpoint,
# for parameters mddb-chat does not model. Any TOML value is sent as JSON.
# Keys the request sets itself (model, messages, max_tokens, temperature,
# stream, tools) are ignored here. Not used with provider = "anthropic".
#
# Thinking models behind Ollama (qwen3, deepseek-r1...) put their reasoning in
# a separate field; once it uses up max_tokens the answer comes back empty.
# Turn the reasoning off, or raise max_tokens:
#   extra_body = { reasoning_effort = "none" }
# Other examples:
#   extra_body = { seed = 7, top_p = 0.9, options = { num_ctx = 8192 } }

[session]
max_concurrent = 2
queue_size = 10
max_history_length = 50
# How long a session is kept without activity. A session outlives its
# WebSocket: on disconnect it is detached (it stops counting toward
# max_concurrent) and a reconnecting client's `resume` picks it up again.
# Only `end` or this many idle minutes remove it.
session_ttl_minutes = 60
max_response_length = 4096
name_max_chars = 50

[security]
rate_limit_per_minute = 30
max_message_length = 2000
webhook_secret = ""  # or set MDDB_CHAT_WEBHOOK_SECRET env var

# Tokens one session may spend before it is refused. 0 = unlimited.
#
# The second limit, and the one a budget actually runs out in. A scenario's
# max_turns caps how many turns a conversation takes and says nothing about
# what they cost — one turn carrying a large retrieval context through several
# tool-calling rounds can be worth ten short ones.
#
# Charged from the usage block every provider response carries, summed across
# every round of a turn rather than only the round that produced the answer.
# A turn that exhausts the tool-calling rounds and falls through to the
# streaming path undercounts by its final response: that call's usage arrives
# in an SSE frame this server does not read.
max_tokens_per_session = 0

# Networks whose X-Forwarded-For header is believed, as addresses or CIDRs.
#
# Leave this empty and the rate limit is charged to the TCP peer, which cannot
# be spoofed — right for a directly exposed server. Behind a reverse proxy or
# cloudflared, though, every visitor arrives from the proxy's address and they
# all share one bucket, so the first noisy visitor locks everyone out.
#
# Set it to the proxy's address or network to get per-visitor limits back.
# Only list addresses you control: anything listed here can name whatever
# client address it likes.
#
#   trusted_proxies = ["172.16.0.0/12"]   # the Docker bridge network
#   trusted_proxies = ["10.0.0.7"]        # one nginx host
trusted_proxies = []

[scenarios.assistant]
name = "Documentation Assistant"
system_prompt = """You are a helpful documentation assistant for our product.
Answer questions based on the provided context from the documentation.
Be concise, accurate, and helpful. If you don't know the answer,
say so honestly rather than making something up."""
allowed_collections = ["docs"]

[scenarios.support]
name = "Customer Support"
system_prompt = """You are a friendly customer support agent.
Help users with their questions about our product and services.
Be empathetic, clear, and solution-oriented.
If you cannot resolve an issue, suggest contacting human support."""
allowed_collections = ["docs", "faq"]
temperature = 0.5
max_turns = 30

# Webhooks: each entry is one URL and the events it receives. Every POST is
# JSON — { "event", "timestamp", "data" } — with the event name in X-MDDB-Event
# and, when [security] webhook_secret is set, the hex HMAC-SHA256 of the body
# in X-MDDB-Signature.
#
# Events are opt-in per entry:
#
#   session.start  a visitor was admitted
#   session.end    a session ended (the visitor sent `end`, or it timed out
#                  after session_ttl_minutes; a disconnect only detaches it)
#   queue.full     a visitor was turned away
#   message        a visitor's question, as sanitized (session id, scenario,
#                  message id, text)
#   answer         the assistant's final text, with provider, model, token
#                  usage (null when the provider reports none), the tools
#                  called (name + collection), latency in ms, its own message
#                  id and the id of the question it answers
#   feedback       a rating sent by the widget, with the message id it rates
#                  (null from clients that predate message ids)
#
# Leaving `events` out subscribes to session.start, session.end and
# queue.full only — the events that existed before the per-message ones — so
# an older config keeps receiving exactly what it did. `message` and `answer`
# carry conversation text: subscribe to them only for an endpoint you trust
# with it. An event name the server does not know is logged at startup.
#
# Payload examples: services/mddb-chat/README.md.
#
# [[webhooks]]
# url = "https://example.com/webhook"
# events = ["session.start", "session.end", "queue.full"]
# headers = { "Authorization" = "Bearer your-token" }
#
# [[webhooks]]
# url = "https://example.com/chat-log"
# events = ["message", "answer", "feedback"]
