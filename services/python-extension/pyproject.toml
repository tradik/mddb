[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mddb"
version = "2.13.0"
description = "Python client/extension for MDDB (Markdown Database) over HTTP / Unix socket."
license = { text = "BSD-3-Clause" }
authors = [{ name = "tradik" }]
requires-python = ">=3.9"
dependencies = []

[project.urls]
Homepage = "https://github.com/tradik/mddb"
Repository = "https://github.com/tradik/mddb"

[tool.setuptools]
py-modules = ["mddb"]
