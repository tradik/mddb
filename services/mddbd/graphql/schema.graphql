# Directives for authentication and authorization
directive @auth on FIELD_DEFINITION
directive @hasRole(role: Role!) on FIELD_DEFINITION

enum Role {
  ADMIN
  USER
}

enum Permission {
  READ
  WRITE
  ADMIN
}

# Custom scalar for flexible JSON
scalar JSONObject
scalar Time

# Core document type
type Document {
  id: ID!
  key: String!
  lang: String!
  meta: JSONObject!
  contentMd: String!
  addedAt: Time!
  updatedAt: Time!
  expiresAt: Time
  "Identifies this version on a read or write of the whole document; send it back as expectedRevision (INT-021)."
  revision: String
}

# Search and pagination
type DocumentConnection {
  edges: [DocumentEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type DocumentEdge {
  cursor: String!
  node: Document!
}

type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
}

# Vector search result
type VectorSearchResult {
  document: Document!
  score: Float!
  rank: Int!
  "Group this result counted against when the request had groupBy (SRCH-016)."
  group: String
  "1-based place of this result within its group."
  groupRank: Int
  "The document's images, with includeImages (RAG-010)."
  images: [ImageRef!]
}

"An image document attached to a hit or found by its picture (RAG-010)."
type ImageRef {
  key: String!
  lang: String!
  altText: String
  caption: String
  "PDF page, null when unknown."
  page: Int
  mimeType: String
  width: Int
  height: Int
  "The document the image came from."
  parent: String
  "Similarity to the query, on image hits."
  score: Float
  "GET path of the image bytes."
  url: String!
}

"Image documents and their vectors (RAG-010)."
type ImageIndexingStatus {
  documents: Int!
  embedded: Int!
  "Multimodal model; null when the provider embeds no images."
  model: String
  "Why images are not embedded, when they are not."
  note: String
}

"A 1-based, inclusive line range."
type PassageLines {
  start: Int!
  end: Int!
}

"A place in a document: file, lines, the definition holding them, and optionally the text (AGT-002)."
type Passage {
  collection: String!
  key: String!
  lang: String
  path: String!
  lines: PassageLines!
  symbol: String
  kind: String
  content: String
  score: Float
  source: String
  tokens: Int!
  "The document's images, with includeImages (RAG-010)."
  images: [ImageRef!]
}

input CodeSymbolInput {
  collection: String!
  name: String!
  "definitions, references, callers, callees, tests, siblings; default all"
  include: [String!]
  limit: Int
  includeContent: Boolean
}

"Everything about one symbol (CODE-008); each relation is a list of passages."
type CodeSymbol {
  collection: String!
  symbol: String!
  definitions: [Passage!]!
  references: [Passage!]!
  callers: [Passage!]!
  callees: [Passage!]!
  tests: [Passage!]!
  siblings: [Passage!]!
  truncated: Boolean!
}

"Queued indexing work (GO-042); fields match GET /v1/indexing-status."
type IndexingStatus {
  collection: String
  pendingEmbeddings: Int!
  failedEmbeddings: Int!
  completedEmbeddings: Int!
  pendingMetadata: Int!
  progress: Float!
  oldestPendingAt: Time
  provider: String
  indexed: Boolean!
  "Image documents and their vectors (RAG-010); null when there are none."
  images: ImageIndexingStatus
  "Collections a trainable index (ivf, pq, opq, sq, sq4) has not trained yet (GO-047); flat and hnsw already answer for them."
  trainingCollections: [String!]
}

type VectorSearchResponse {
  results: [VectorSearchResult!]!
  total: Int!
  model: String
  dimensions: Int
  "Set instead of results when the input asked for format passages (AGT-002)."
  passages: [Passage!]
  "How the search ran and why (SRCH-013); null unless the input set explain."
  plan: SearchPlan
  "Images the query matched by their picture, with includeImages and a provider that embeds images (RAG-010)."
  imageHits: [ImageRef!]
}

"How a vector search ran and why (SRCH-013): the index chosen and the reasons."
type SearchPlan {
  algorithm: String!
  "The filter was applied first and the admitted documents scanned exactly."
  prefilter: Boolean!
  "Hits the index was asked for: topK × oversample."
  candidates: Int!
  "A filtered index search came back short and the scan continued further."
  iterativeScan: Boolean!
  reasons: [String!]!
  "The correction relevance feedback made (SRCH-015); null without examples."
  feedback: FeedbackApplied
  "How the query was split (SRCH-020); set with queryDecomposition auto."
  decomposition: QueryDecomposition
}

"How query decomposition split the query (SRCH-020)."
type QueryDecomposition {
  "Parts searched besides the whole query; 1 = the query was not split."
  parts: Int!
  "The parts, when there was more than one."
  texts: [String!]!
}

"""
What relevance feedback did (SRCH-015). alpha, beta, gamma and queryShift
are set in query mode; weight and rescored in rescore mode; the rest are 0.
"""
type FeedbackApplied {
  mode: String!
  positive: Int!
  negative: Int!
  alpha: Float!
  beta: Float!
  gamma: Float!
  "1 − cosine(query, corrected query): how far the examples moved it."
  queryShift: Float!
  weight: Float!
  "Candidates that had a vector to rescore."
  rescored: Int!
}

# Full-text search result
type FTSResult {
  document: Document!
  score: Float!
  matchedTerms: [String!]!
  "The document's images, with includeImages (RAG-010)."
  images: [ImageRef!]
}

type FTSResponse {
  results: [FTSResult!]!
  total: Int!
  "Set instead of results when the input asked for format passages (AGT-002)."
  passages: [Passage!]
}

# Stats and metrics
type CollectionStats {
  name: String!
  documentCount: Int!
  revisionCount: Int!
  metaIndexCount: Int!
}

type Stats {
  databasePath: String!
  databaseSize: Int!
  mode: String!
  collections: [CollectionStats!]!
  totalDocuments: Int!
  totalRevisions: Int!
  totalMetaIndices: Int!
}

type VectorCollectionStats {
  collection: String!
  totalDocuments: Int!
  embeddedDocuments: Int!
}

type VectorStats {
  enabled: Boolean!
  provider: String
  model: String
  dimensions: Int
  collections: [VectorCollectionStats!]!
  indexReady: Boolean!
}

# Webhooks
type Webhook {
  id: ID!
  url: String!
  events: [String!]!
  collection: String!
  createdAt: Time!
}

# Schema validation
type Schema {
  collection: String!
  schema: String!
  enabled: Boolean!
}

type ValidationResult {
  valid: Boolean!
  errors: [String!]!
  """
  Advisory findings that do not make the document invalid (DOC-012) — today,
  metadata values that look like a structure lost on the way in.
  """
  warnings: [String!]
}

# Authentication types
type AuthPayload {
  token: String!
  expiresAt: Time!
}

type User {
  username: String!
  admin: Boolean!
  createdAt: Time!
}

type APIKey {
  key: String!
  description: String!
  expiresAt: Time
  createdAt: Time!
}

type Group {
  name: String!
  description: String!
  members: [String!]!
  createdAt: Time!
}

type UserPermission {
  username: String!
  collection: String!
  read: Boolean!
  write: Boolean!
  admin: Boolean!
}

type GroupPermission {
  groupName: String!
  collection: String!
  read: Boolean!
  write: Boolean!
  admin: Boolean!
}

# Input types
input MetaInput {
  key: String!
  values: [String!]!
}

input AddDocumentInput {
  collection: String!
  key: String!
  lang: String!
  meta: [MetaInput!]
  contentMd: String!
  ttl: Int
}

input UpdateDocumentInput {
  collection: String!
  key: String!
  lang: String!
  meta: [MetaInput!]
  contentMd: String
  "Update only if the document is still at this revision; otherwise a revision conflict (INT-021)."
  expectedRevision: String
}

input SearchInput {
  collection: String!
  filterMeta: [MetaInput!]
  """
  Operator metadata filter (SRCH-017), ANDed with filterMeta. One condition
  per key: in, prefix, contains, gt, gte, lt, lte, not, exists — e.g.
  {"path": {"prefix": "internal/"}, "kind": {"not": ["test"]}}.
  """
  filter: JSONObject
  sort: String
  asc: Boolean
  limit: Int
  offset: Int
}

input VectorSearchInput {
  collection: String!
  query: String
  queryVector: [Float!]
  topK: Int
  threshold: Float
  filterMeta: [MetaInput!]
  """
  Operator metadata filter (SRCH-017), ANDed with filterMeta. One condition
  per key: in, prefix, contains, gt, gte, lt, lte, not, exists — e.g.
  {"path": {"prefix": "internal/"}, "kind": {"not": ["test"]}}.
  """
  filter: JSONObject
  includeContent: Boolean
  """
  Recall/latency knob (SRCH-005): candidates fetched per requested result
  before deduplication trims them. 1.0-10.0; omit to use the collection's
  retrieval profile, then MDDB's default of 3.0.
  """
  oversample: Float
  "Keep at most perGroup results per value of key (SRCH-016)."
  groupBy: GroupByInput
  "results (default) or passages: path, lines, symbol and text per hit (AGT-002)."
  format: String
  passageLines: Int
  """
  flat (default, or the collection profile's), auto (SRCH-013: the planner
  picks), hnsw, ivf, pq, opq, sq, sq4 or bq.
  """
  algorithm: String
  "Return the plan — the index chosen and why (SRCH-013)."
  explain: Boolean
  "Optional goal for algorithm auto, 0-60000 ms; a tight one favours a quantized index."
  latencyTargetMs: Int
  "Relevance feedback (SRCH-015): documents or vectors like the ones wanted, at most 50."
  positive: [FeedbackExampleInput!]
  "Documents or vectors unlike the ones wanted, at most 50."
  negative: [FeedbackExampleInput!]
  "query (default: move the query, Rocchio) or rescore (re-rank the candidates)."
  feedbackMode: String
  "How far rescore mode shifts a score, 0-10; omit for 0.5."
  feedbackWeight: Float
  "Rocchio weights for query mode; omitted ones keep 1, 0.75, 0.25."
  rocchio: RocchioInput
  "Attach each hit's images; with a provider that embeds images, also return imageHits (RAG-010)."
  includeImages: Boolean
  """
  Search by an image instead of text (RAG-010): base64, a data URI or an
  http(s) URL. Needs a provider that embeds images; the results are image
  documents.
  """
  queryImage: String
  """
  off (default) or auto (SRCH-020): a query of several clauses is also
  searched per clause, and each document keeps its best score.
  """
  queryDecomposition: String
}

"A relevance-feedback example (SRCH-015): a document key or ID, or a vector — one, not both."
input FeedbackExampleInput {
  key: String
  vector: [Float!]
}

"Rocchio coefficients (SRCH-015): query, positive centroid, negative centroid."
input RocchioInput {
  alpha: Float
  beta: Float
  gamma: Float
}

"""
Result grouping (SRCH-016): key is a metadata key, "document" or
"collection"; perGroup defaults to 1.
"""
input GroupByInput {
  key: String!
  perGroup: Int
}

input FTSInput {
  collection: String!
  query: String!
  limit: Int
  "results (default) or passages: path, lines, symbol and text per hit (AGT-002)."
  format: String
  passageLines: Int
  "Attach each hit's images (RAG-010)."
  includeImages: Boolean
}

input RegisterWebhookInput {
  url: String!
  events: [String!]!
  collection: String!
}

input SetSchemaInput {
  collection: String!
  schema: String!
}

input SetPermissionInput {
  username: String!
  collection: String!
  read: Boolean!
  write: Boolean!
  admin: Boolean!
}

input SetGroupPermissionInput {
  groupName: String!
  collection: String!
  read: Boolean!
  write: Boolean!
  admin: Boolean!
}

input CreateGroupInput {
  name: String!
  description: String!
  members: [String!]!
}

input CreateAPIKeyInput {
  description: String!
  expiresAt: Time
}

# Batch add result
type BatchAddResult {
  added: Int!
  updated: Int!
  failed: Int!
  errors: [String!]
}

# Ingest types
input IngestDocumentInput {
  url: String
  key: String
  lang: String!
  contentMd: String!
  meta: [MetaInput!]
  extractFrontmatter: Boolean
  scrapedAt: Int
  scraper: String
  ttl: Int
}

input IngestOptionsInput {
  skipDuplicates: Boolean
  skipEmbeddings: Boolean
  skipFts: Boolean
  skipWebhooks: Boolean
  autoConfigureCollection: Boolean
  saveRevision: Boolean
  "Images in Markdown documents become image documents (RAG-010); data URIs, and remote links with fetchRemoteImages."
  extractImages: Boolean
  "Fetch Markdown image links to http(s) URLs, SSRF-guarded (RAG-010)."
  fetchRemoteImages: Boolean
}

type IngestResult {
  added: Int!
  updated: Int!
  skipped: Int!
  failed: Int!
  errors: [String!]
  collection: String!
  durationMs: Int!
}

input AddBatchDocumentInput {
  key: String!
  lang: String!
  contentMd: String!
  meta: [MetaInput!]
  saveRevision: Boolean
}

# Queries
type Query {
  # Document operations
  document(collection: String!, key: String!, lang: String!, env: JSONObject): Document @auth

  search(input: SearchInput!): DocumentConnection @auth

  # Vector search
  vectorSearch(input: VectorSearchInput!): VectorSearchResponse @auth
  vectorStats: VectorStats @auth
  # Queued embedding and metadata work (GO-042); omit collection for the server.
  indexingStatus(collection: String): IndexingStatus @auth

  # Full-text search
  fts(input: FTSInput!): FTSResponse @auth

  # Code connection graph (CODE-005)
  #
  # The ticket proposed `neighbors` as a field on Document, but Document
  # carries no collection and edges only resolve within one — threading the
  # collection through would change a type every query returns. A Query field
  # matches how `fts` and `vectorSearch` already take their scope.
  codeGraph(input: CodeGraphInput!): CodeGraph @auth
  # Where a symbol is defined and used, as passages (CODE-008).
  codeSymbol(input: CodeSymbolInput!): CodeSymbol @auth

  # Stats
  stats: Stats @auth

  # Webhooks
  webhooks(collection: String): [Webhook!]! @auth @hasRole(role: ADMIN)

  # Schema
  schema(collection: String!): Schema @auth
  schemas: [Schema!]! @auth

  # Auth
  me: User! @auth
  users: [User!]! @auth @hasRole(role: ADMIN)
  groups: [Group!]! @auth @hasRole(role: ADMIN)
  userPermissions(username: String!): [UserPermission!]! @auth @hasRole(role: ADMIN)
  groupPermissions(groupName: String!): [GroupPermission!]! @auth @hasRole(role: ADMIN)
}

# Mutations
type Mutation {
  # Document operations
  addDocument(input: AddDocumentInput!): Document! @auth
  updateDocument(input: UpdateDocumentInput!): Document! @auth
  deleteDocument(collection: String!, key: String!, lang: String!): Boolean! @auth
  deleteCollection(collection: String!): Int! @auth

  # Batch operations
  addBatch(collection: String!, documents: [AddBatchDocumentInput!]!): BatchAddResult! @auth
  ingestDocuments(collection: String!, documents: [IngestDocumentInput!]!, options: IngestOptionsInput): IngestResult! @auth

  # Vector operations
  vectorReindex(collection: String!, force: Boolean): VectorStats! @auth

  # TTL
  setTTL(collection: String!, key: String!, lang: String!, ttl: Int!): Document! @auth

  # Import
  importURL(collection: String!, url: String!, key: String, lang: String!, meta: [MetaInput!], ttl: Int): Document! @auth

  # Webhooks
  registerWebhook(input: RegisterWebhookInput!): Webhook! @auth @hasRole(role: ADMIN)
  deleteWebhook(id: ID!): Boolean! @auth @hasRole(role: ADMIN)

  # Schema
  setSchema(input: SetSchemaInput!): Boolean! @auth @hasRole(role: ADMIN)
  deleteSchema(collection: String!): Boolean! @auth @hasRole(role: ADMIN)
  validateDocument(collection: String!, meta: [MetaInput!]!): ValidationResult! @auth

  # Auth
  login(username: String!, password: String!): AuthPayload!
  register(username: String!, password: String!): User! @auth @hasRole(role: ADMIN)
  createAPIKey(input: CreateAPIKeyInput!): APIKey! @auth

  # Permissions
  setPermission(input: SetPermissionInput!): Boolean! @auth @hasRole(role: ADMIN)

  # Groups
  createGroup(input: CreateGroupInput!): Group! @auth @hasRole(role: ADMIN)
  updateGroup(name: String!, description: String!, members: [String!]!): Group! @auth @hasRole(role: ADMIN)
  deleteGroup(name: String!): Boolean! @auth @hasRole(role: ADMIN)
  setGroupPermission(input: SetGroupPermissionInput!): Boolean! @auth @hasRole(role: ADMIN)
}

# Code connection graph (CODE-005). Edges are derived from the defines/uses/
# imports metadata of code documents; nothing is stored, so a reindex
# reproduces the graph exactly.
input CodeGraphInput {
  collection: String!
  key: String!
  """in = what depends on this document, out = what it depends on, both (default)"""
  direction: String
  """Hops to follow, 1-3 (default: 1)"""
  depth: Int
  """Maximum neighbours per node, 1-100 (default: 100)"""
  maxDegree: Int
  """
  Include the first line each edge's symbol appears on, both sides. Reads
  document content, which a traversal otherwise never does.
  """
  lines: Boolean
}

type CodeGraph {
  collection: String!
  root: String!
  direction: String!
  depth: Int!
  nodes: [CodeGraphNode!]!
  edges: [CodeGraphEdge!]!
  """True when a depth or degree limit cut the walk short."""
  truncated: Boolean!
}

type CodeGraphNode {
  key: String!
  docId: String!
  lang: String
  language: String
  depth: Int!
}

type CodeGraphEdge {
  from: String!
  to: String!
  """uses-selector, calls, references or imports"""
  kind: String!
  """The symbol or path that justifies this edge."""
  symbol: String!
  direction: String!
  """First occurrence of the symbol in the source document, 0 if not literal."""
  fromLine: Int
  """First occurrence of the symbol in the target document, 0 if not literal."""
  toLine: Int
}
