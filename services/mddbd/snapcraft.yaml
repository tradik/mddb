name: mddbd
title: MDDB Server
version: "2.13.0"
summary: Embedded Markdown database server
description: |
  MDDB (Markdown Database) is an embedded database server that stores documents
  as Markdown with YAML frontmatter. Provides REST, gRPC, GraphQL and vector
  search APIs. Supports BoltDB storage, full-text search, and AI embeddings.

  Default port: 11023 (HTTP), 11024 (gRPC)

grade: stable
confinement: strict
base: core24
platforms:
  amd64:
  arm64:

apps:
  mddbd:
    command: bin/mddbd
    daemon: simple
    restart-condition: on-failure
    plugs:
      - network
      - network-bind
      - home
    environment:
      MDDB_DATA_DIR: $SNAP_DATA/data

parts:
  mddbd:
    # The binary is built by the release workflow and packaged here, the same
    # way the DEB and RPM are made. It used to be compiled inside the snap
    # sandbox against a build-snap of the Go toolchain, and that broke the snap
    # for two releases: the store has no track for the version this project
    # pins. Its newest is one minor behind, so the version guard and the snap
    # store could not both be satisfied.
    #
    # Packaging the released binary removes the disagreement rather than
    # resolving it. It also means the snap ships the same bytes that were built
    # and tested, instead of a second compilation nobody checked.
    plugin: nil
    source: .
    source-type: local
    override-build: |
      install -D -m 0755 "$CRAFT_PART_SRC/snapbuild/mddbd" "$CRAFT_PART_INSTALL/bin/mddbd"
