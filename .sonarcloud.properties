# SonarCloud Automatic Analysis configuration.
# Not in use: since 2026-10-30 the project is analysed by the sonar-scanner in
# CI (OPS-021), which reads sonar-project.properties and ignores this file.
# This file matters again only if Automatic Analysis is turned back on
# (SonarCloud → Administration → Analysis Method) — kept for that case, with
# the same exclusion lists as sonar-project.properties;
# scripts/check-sonar-exclusions.py fails the scan if the two differ. Auto Analysis
# supports a limited subset of properties — only sonar.sources/tests,
# sonar.exclusions/inclusions, sonar.test.exclusions/inclusions,
# sonar.coverage.exclusions, sonar.cpd.exclusions.
# sonar.issue.ignore.* is NOT honoured by Auto Analysis (only by sonar-scanner CLI).
#
# Project standard is camelCase (CLAUDE.md). SonarCloud's default Python
# Quality Profile enforces PEP 8 snake_case (S100/S116/S117/S1542), which
# floods the Quality Gate with naming smells. The connector is exercised
# by the dedicated workflow (.github/workflows/airbyte-destination.yml):
# pytest with --cov-fail-under=90 (97% achieved) + docker spec smoke test.
# Exclude its Python sources from Auto Analysis to keep the gate green
# without violating the camelCase house rule.

# The scanner keeps the connector in analysis and turns off only the naming
# rules (sonar.issue.ignore.* in sonar-project.properties), which Auto
# Analysis cannot do — so here the whole directory is excluded.

sonar.exclusions=\
  integrations/airbyte-destination/**/*.py,\
  services/mddbd/third_party/**,\
  .github/workflows/**,\
  tools/bench/**,\
  **/testdata/**,\
  **/*.pb.go,\
  services/mddbd/graphql/generated.go,\
  services/mddbd/graphql/models_gen.go,\
  integrations/wordpress-plugin/tests/stubs/**,\
  **/vendor/**,\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/coverage/**,\
  **/*.min.js,\
  proto/**,\
  services/mddbd/proto/**,\
  services/mddb-chat/target/**,\
  **/*.phar

# --- Duplication ------------------------------------------------------------
#
# The same list as sonar.cpd.exclusions in sonar-project.properties. The
# per-integration CI workflows are declarative YAML and intentionally parallel,
# and test code repeats fixtures by design.
#
# services/mddbd/mcp_builtin_tools.go is a declarative registry: 81 MCP tool
# schemas, no control flow in the file at all. Every entry has the same shape
# because that is what a schema table is, and the copy-paste detector reads
# almost the whole file as duplicated. The consequence is not cosmetic: with
# the gate at 3% of new lines, a two-line edit to a tool description fails the
# build unless the same pull request happens to add 67 lines elsewhere.
#
# This disables copy-paste detection only. Every bug, vulnerability and code
# smell rule still runs on these files.
sonar.cpd.exclusions=\
  .github/workflows/**,\
  **/*_test.go,\
  **/__tests__/**,\
  services/mddbd/mcp_builtin_tools.go

# --- Why these exclusions -----------------------------------------------------
#
# .github/workflows/** — CI configuration, already excluded from duplication
# detection for the same reason. The rules that fire here want
# `--only-binary :all:` and command-line version pins on the Python steps.
# The actual mitigation is in place and is stronger: both Python projects
# carry a committed uv.lock and CI installs with `uv sync --locked`, so every
# version comes from the lock and the run fails if the lock and
# pyproject.toml disagree. `--only-binary` cannot apply at all — the package
# being installed is this repository's own source, and an editable install has
# to run a build backend. Analysing workflow YAML for these rules produces
# findings with no available fix.
#
# tools/bench/** — a benchmark harness, already excluded from coverage. It
# fills a synthetic corpus with math/rand, and a cryptographic source would
# make the generator the thing being measured.
#
# **/testdata/** — test inputs, not code: converter fixtures (GO-046), image
# fixtures (RAG-010) and fuzz corpora. They are deliberately odd — an HTML page
# without a lang attribute, mail with CRLF line ends — and the reliability
# rules that fire on them (Web:S5254 on sample.html failed the 2.18.9 gate)
# describe the fixture, not a defect.
#
# --- Generated code, external-API stubs and build output --------------------
#
# **/vendor/**, **/node_modules/**, **/dist/**, **/build/**, **/coverage/**,
# **/*.min.js, **/*.phar, services/mddb-chat/target/** — third-party code and
# build artefacts, not source (integrations/github-action/dist is a committed
# bundle of its src/). proto/**, services/mddbd/proto/** — protobuf
# definitions and their generated code (./proto/generate.sh).
#
# **/*.pb.go — protoc output (./proto/generate.sh). sonar-project.properties
# has always excluded it; this file did not, so Auto Analysis was reading it.
#
# services/mddbd/graphql/generated.go, models_gen.go — gqlgen output
# (services/mddbd/graphql/gqlgen.yml). Function names such as
# _Query_search_args are gqlgen's, and the file is rewritten on every
# `go generate`; a rename there (go:S100) would be lost on the next run. The
# hand-written resolvers (schema.resolvers.go, resolver.go, mapper.go,
# directives.go) stay in analysis.
#
# integrations/wordpress-plugin/tests/stubs/** — test doubles for WordPress
# core functions. They must carry WordPress's exact names (apply_filters,
# rest_ensure_response) or the plugin under test would not call them, so the
# naming rule (php:S100) asks for a change that would break the tests.

# Note the constraint this file already documents: Auto Analysis does NOT
# honour sonar.issue.ignore.*, so rule-scoped suppression is unavailable and
# whole-file exclusion is the only lever. That is the one permitted difference
# between the two files: a pattern excluded here may instead be a resourceKey
# of a sonar.issue.ignore entry in sonar-project.properties. See OPS-021.
