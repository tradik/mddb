# MDDB Cluster Ring - Leader + 2 Followers + Panel
#
# Usage:
#   docker compose -f docker-compose.ring.yml up --build
#
# Ports:
#   Leader:     HTTP :11023, gRPC :11024
#   Follower 1: HTTP :11033, gRPC :11034
#   Follower 2: HTTP :11043, gRPC :11044
#   Panel:      :3000

# ── Reusable anchors (OPS-003: DRY — every mddbd node shares these) ──────────
# Log rotation + resource tiers (OPS-013: same compose rules as docker-compose.yml).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-deploy-server: &deploy-server
  resources:
    limits:
      cpus: "2.00"
      memory: 2G
    reservations:
      cpus: "0.50"
      memory: 512M

x-deploy-small: &deploy-small
  resources:
    limits:
      cpus: "0.50"
      memory: 256M
    reservations:
      cpus: "0.10"
      memory: 64M

# Build context for all three mddbd nodes (leader + 2 followers).
x-mddbd-build: &mddbd-build
  context: .
  dockerfile: services/mddbd/Dockerfile

# Environment keys common to every mddbd node.
x-mddbd-env: &mddbd-env
  MDDB_PATH: "/app/data/mddb.db"

# Environment keys shared by the read-only follower nodes (merges mddbd-env).
x-follower-env: &follower-env
  <<: *mddbd-env
  MDDB_MODE: "read"
  MDDB_REPLICATION_ROLE: "follower"
  MDDB_REPLICATION_LEADER_ADDR: "leader:11024"

# depends_on block reused by both followers and the panel.
x-leader-healthy: &leader-healthy
  leader:
    condition: service_healthy

# Healthcheck timings shared by every node; only the probed URL differs
# (OPS-013: followers listen on 11033/11043, not the Dockerfile default 11023).
# Longer than MDDB_SHUTDOWN_TIMEOUT_SEC (15 s): Docker sends SIGKILL after
# 10 s by default, which cuts the shutdown before it stores the freelist, and
# the next start then walks the whole file (#333).
x-stop-grace: &stop-grace 20s

x-healthcheck-defaults: &healthcheck-defaults
  interval: 10s
  timeout: 3s
  retries: 5
  start_period: 5s

services:
  # ── Leader Node ──────────────────────────────────────────
  leader:
    build: *mddbd-build
    container_name: mddb-leader
    ports:
      - "11023:11023"
      - "11024:11024"
    environment:
      <<: *mddbd-env
      MDDB_ADDR: ":11023"
      MDDB_GRPC_ADDR: ":11024"
      MDDB_MODE: "wr"
      MDDB_REPLICATION_ROLE: "leader"
      MDDB_NODE_ID: "leader-1"
      MDDB_BINLOG_ENABLED: "true"
    volumes:
      - leader-data:/app/data
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:11023/health"]
      interval: 5s
    stop_grace_period: *stop-grace
    logging: *default-logging
    deploy: *deploy-server

  # ── Follower 1 ──────────────────────────────────────────
  follower-1:
    build: *mddbd-build
    container_name: mddb-follower-1
    ports:
      - "11033:11033"
      - "11034:11034"
    environment:
      <<: *follower-env
      MDDB_ADDR: ":11033"
      MDDB_GRPC_ADDR: ":11034"
      MDDB_NODE_ID: "follower-1"
    volumes:
      - follower1-data:/app/data
    depends_on: *leader-healthy
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:11033/health"]
    stop_grace_period: *stop-grace
    logging: *default-logging
    deploy: *deploy-server

  # ── Follower 2 ──────────────────────────────────────────
  follower-2:
    build: *mddbd-build
    container_name: mddb-follower-2
    ports:
      - "11043:11043"
      - "11044:11044"
    environment:
      <<: *follower-env
      MDDB_ADDR: ":11043"
      MDDB_GRPC_ADDR: ":11044"
      MDDB_NODE_ID: "follower-2"
    volumes:
      - follower2-data:/app/data
    depends_on: *leader-healthy
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:11043/health"]
    stop_grace_period: *stop-grace
    logging: *default-logging
    deploy: *deploy-server

  # ── Panel (dev mode with API proxy to leader) ───────────
  panel:
    build:
      context: services/mddb-panel
      dockerfile: Dockerfile
      target: development
    container_name: mddb-panel
    ports:
      - "3000:3000"
    environment:
      MDDB_SERVER: "http://leader:11023"
    depends_on: *leader-healthy
    logging: *default-logging
    deploy: *deploy-small

volumes:
  leader-data:
  follower1-data:
  follower2-data:
